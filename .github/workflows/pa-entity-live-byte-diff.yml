name: PA Entity live static byte diff

on:
  push:
    paths:
      - '.github/workflows/pa-entity-live-byte-diff.yml'

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare live static discovery files to frozen release
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://pa-entity-x402.floot.app'
          ROOT='docs/pa-entity-floot-release'
          mkdir -p /tmp/live

          compare() {
            remote="$1"; fixture="$2"
            out="/tmp/live/$(echo "$remote" | tr '/.' '__')"
            code=$(curl -sS --max-time 15 -o "$out" -w '%{http_code}' "$ORIGIN$remote")
            if [ "$code" != 200 ]; then
              echo "DIFF status=$code remote=$remote fixture=$fixture"
              return
            fi
            if cmp -s "$out" "$ROOT/$fixture"; then
              echo "MATCH remote=$remote fixture=$fixture bytes=$(wc -c < "$out")"
            else
              live_sha=$(sha256sum "$out" | awk '{print $1}')
              fixture_sha=$(sha256sum "$ROOT/$fixture" | awk '{print $1}')
              echo "DIFF remote=$remote fixture=$fixture live_sha=$live_sha fixture_sha=$fixture_sha live_bytes=$(wc -c < "$out") fixture_bytes=$(wc -c < "$ROOT/$fixture")"
            fi
          }

          compare '/openapi.json' 'openapi.json'
          compare '/llms.txt' 'llms.txt'
          compare '/llms-full.txt' 'llms-full.txt'
          compare '/skill.txt' 'skill.txt'
          compare '/.well-known/x402' 'x402'
          compare '/.well-known/x402.json' 'x402.json'
          compare '/.well-known/x402-services.json' 'x402-services.json'
          compare '/.well-known/x402-service.json' 'x402-service.json'
          compare '/.well-known/x402-catalog.json' 'x402-catalog.json'
          compare '/.well-known/security.txt' 'security.txt'
          compare '/sitemap.xml' 'sitemap.xml'
