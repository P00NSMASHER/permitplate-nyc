name: PA Entity PayAPI provider status once

on:
  push:
    paths:
      - '.github/workflows/tmp-pa-entity-payapi-status-api-trace.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read own PayAPI pending listing status
        shell: bash
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          COMMIT_JSON=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GH_REPOSITORY/commits/$GH_SHA")
          EMAIL=$(printf '%s' "$COMMIT_JSON" | jq -r '.commit.author.email // .commit.committer.email // empty')
          test -n "$EMAIL"

          LOGIN_HTTP=$(curl -sS -o /tmp/login.json -w '%{http_code}' \
            -X POST 'https://payapi.market/api/provider-login' \
            -H 'content-type: application/json' \
            --data "$(jq -nc --arg email "$EMAIL" '{email:$email}')")
          echo "LOGIN_HTTP=$LOGIN_HTTP"
          test "$LOGIN_HTTP" -ge 200
          test "$LOGIN_HTTP" -lt 300

          TOKEN=$(jq -r '.token // empty' /tmp/login.json)
          test -n "$TOKEN"

          STATUS_HTTP=$(curl -sS -o /tmp/status.json -w '%{http_code}' \
            -X POST 'https://payapi.market/api/get-provider' \
            -H 'content-type: application/json' \
            -H "authorization: Bearer $TOKEN" \
            --data "$(jq -nc --arg email "$EMAIL" '{email:$email}')")
          echo "STATUS_HTTP=$STATUS_HTTP"

          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/status.json'))
          out={
            'provider':{
              k:d.get('provider',{}).get(k) for k in [
                'id','company_name','tier','status','updated_at'
              ]
            },
            'listings':[
              {k:x.get(k) for k in [
                'id','name','status','health_status','payment_verified',
                'x402_payto_status','x402_payto_checked_at',
                'triage_status','triage_reasons','triage_checked_at',
                'reliability_score','total_requests','total_revenue',
                'base_url','paid_route_url','paid_route_quote_usdc',
                'created_at','updated_at'
              ]} for x in d.get('listings',[])
              if x.get('id')=='3b5351ff-4a2c-4ff9-911e-88c938486208'
            ]
          }
          print(json.dumps(out,indent=2))
          PY

          test "$STATUS_HTTP" -ge 200
          test "$STATUS_HTTP" -lt 300
