name: x402-list and direct readback

on:
  push:
    paths:
      - '.github/workflows/x402-directory-readback.yml'

jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query large buyer directories
        shell: bash
        run: |
          set -euo pipefail

          echo '=== x402-list exact Floot domain ==='
          curl -sS -G 'https://x402-list.com/api/v1/services'             --data-urlencode 'q=pa-entity-x402.floot.app'             --data-urlencode 'per_page=100' | jq .

          echo '=== x402-list exact AppDeploy domain ==='
          curl -sS -G 'https://x402-list.com/api/v1/services'             --data-urlencode 'q=api-v2.appdeploy.ai'             --data-urlencode 'per_page=100' | jq .

          echo '=== x402-list buyer-intent recommendations ==='
          for Q in             'Pennsylvania business registry'             'company identity legal entity enrichment'             'vendor verification Pennsylvania'
          do
            echo "--- $Q ---"
            curl -sS -G 'https://x402-list.com/api/v1/best'               --data-urlencode "q=$Q"               --data-urlencode 'max_price_usd=0.01'               --data-urlencode 'prefer=cheapest'               --data-urlencode 'limit=20' | jq .
          done

          echo '=== x402.direct newest scan for our domains ==='
          found=0
          for page in $(seq 1 12); do
            curl -sS -G 'https://x402.direct/api/services'               --data-urlencode "page=$page"               --data-urlencode 'limit=100'               --data-urlencode 'sort=newest' > "/tmp/direct-$page.json"
            if grep -qiE 'pa-entity-x402\.floot\.app|api-v2\.appdeploy\.ai/app/pa-entity-lookup-x402-4fbm4s' "/tmp/direct-$page.json"; then
              echo "FOUND_PAGE=$page"
              jq '.. | objects | select((tostring|test("pa-entity-x402\\.floot\\.app|api-v2\\.appdeploy\\.ai/app/pa-entity-lookup-x402-4fbm4s";"i")))' "/tmp/direct-$page.json" || true
              found=1
              break
            fi
          done
          echo "X402_DIRECT_FOUND=$found"
