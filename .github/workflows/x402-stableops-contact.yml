name: x402 StableOps contact lookup

on:
  push:
    paths:
      - '.github/workflows/x402-stableops-contact.yml'

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public contact page
        shell: bash
        run: |
          set -e
          curl -sS 'https://stableops.dev/en/contact' -o /tmp/contact.html
          echo '=== EMAIL TOKENS ==='
          grep -oE '/cdn-cgi/l/email-protection#[0-9A-Fa-f]+' /tmp/contact.html | sort -u || true
          echo '=== MAILTO ==='
          grep -oE 'mailto:[^"<> ]+' /tmp/contact.html | sort -u || true
          echo '=== CONTEXT ==='
          grep -ioE '.{0,120}(contact|support|email-protection).{0,180}' /tmp/contact.html | head -30 || true
