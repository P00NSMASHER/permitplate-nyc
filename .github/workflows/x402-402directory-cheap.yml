name: submit cheap SKU to 402directory

on:
  push:
    paths:
      - '.github/workflows/x402-402directory-cheap.yml'

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Submit and verify directory visibility
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT='https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s/api/pa-entity-one?q=OpenAI'
          DESC='Low-friction Pennsylvania company identity lookup by business name. Returns one best-ranked legal-entity registry record with filing number, registration type, registered address, city, ZIP, and county.'

          jq -nc \
            --arg name 'PA Entity Best Match x402' \
            --arg description "$DESC" \
            --arg endpoint "$ENDPOINT" \
            '{
              name:$name,
              description:$description,
              endpoint:$endpoint,
              method:"GET",
              price_usdc:0.001,
              chain:"base",
              protocol:"x402",
              category:"company-data",
              tags:"pennsylvania,business-registry,company-identity,legal-entity,entity-resolution,due-diligence",
              example:$endpoint
            }' > /tmp/payload.json

          echo '=== submission ==='
          status="$(curl -sS -D /tmp/headers -o /tmp/body -w '%{http_code}' \
            -X POST 'https://402directory.com/api/submissions' \
            -H 'content-type: application/json' \
            -H 'accept: application/json,text/plain,text/html' \
            --data-binary @/tmp/payload.json)"
          echo "HTTP=$status"
          cat /tmp/headers
          echo '--- body ---'
          cat /tmp/body
          echo
          test "$status" -ge 200
          test "$status" -lt 500

          echo '=== public directory search ==='
          curl -sS 'https://402directory.com/api/directory' -o /tmp/directory
          python3 - <<'PY'
          import json
          raw=open('/tmp/directory','rb').read()
          try:
              data=json.loads(raw)
          except Exception:
              print(raw[:4000].decode('utf-8','ignore'))
              raise SystemExit
          endpoint='https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s/api/pa-entity-one?q=OpenAI'
          rows=data.get('entries') or data.get('services') or data.get('items') or []
          hits=[r for r in rows if endpoint in json.dumps(r)]
          print(json.dumps({'found':bool(hits),'hits':hits[:5]},indent=2))
          PY
