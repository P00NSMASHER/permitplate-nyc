name: refresh Agent402 seller

on:
  push:
    paths:
      - '.github/workflows/refresh-agent402-pa-entity.yml'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Register and read back
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://pa-entity-x402.floot.app'
          curl -sS -i -X POST 'https://agent402.tools/api/index/register'             -H 'content-type: application/json'             --data "$(jq -nc --arg origin "$ORIGIN" '{origin:$origin}')"
          echo
          echo '=== SELLER DETAIL ==='
          curl -sS "https://agent402.tools/api/index?seller=pa-entity-x402.floot.app" | jq .
          echo
          echo '=== ROUTE QUERY ==='
          curl -sS 'https://agent402.tools/api/route?q=Pennsylvania%20business%20registry&include=external&top=20' |             jq '.results[]? | select((.seller // "") | contains("pa-entity-x402.floot.app"))'
