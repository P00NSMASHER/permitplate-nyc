name: PA Entity nohumans rank check

on:
  push:
    paths:
      - '.github/workflows/pa-entity-nohumans-rank.yml'

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query live buyer intents
        shell: bash
        run: |
          set -euo pipefail
          for q in             'company identity legal entity enrichment structured json'             'Pennsylvania business registry'             'company legal entity identification'             'vendor verification Pennsylvania'
          do
            echo "=== $q ==="
            curl -sS -G 'https://nohumans.directory/v1/discover'               --data-urlencode "q=$q"               --data-urlencode 'min_score=0.8' | tee /tmp/r.json
            echo
            echo '--- our matches ---'
            jq '[.. | objects | select(((.id? // "")=="958fd262-287") or ((.id? // "")=="9f2f7a33-cb2") or ((.endpoint_url? // "")|contains("pa-entity-x402.floot.app")))]' /tmp/r.json
            echo
          done
