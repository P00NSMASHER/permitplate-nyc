name: PA Entity nohumans buyer rank

on:
  push:
    paths:
      - '.github/workflows/pa-entity-nohumans-rank.yml'

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query live buyer search
        shell: bash
        run: |
          set -euo pipefail
          for q in             'Pennsylvania business registry'             'vendor verification Pennsylvania'             'company identity Pennsylvania'             'Pennsylvania legal entity lookup'
          do
            echo "=== $q ==="
            curl -sS --get 'https://nohumans.directory/v1/discover'               --data-urlencode "q=$q"               --data-urlencode 'min_score=0.8'               --data-urlencode 'limit=50' > /tmp/d.json
            python3 - "$q" <<'PY'
          import json,sys
          q=sys.argv[1]
          d=json.load(open('/tmp/d.json'))
          rows=d.get('results', d if isinstance(d,list) else [])
          if isinstance(rows,dict): rows=rows.get('results',[])
          print('TOTAL_RETURNED',len(rows) if isinstance(rows,list) else None)
          for i,r in enumerate(rows if isinstance(rows,list) else [],1):
              blob=json.dumps(r)
              if 'pa-entity-x402.floot.app' in blob:
                  print('PA_RANK',i,json.dumps(r,indent=2)[:9000])
          PY
          done
