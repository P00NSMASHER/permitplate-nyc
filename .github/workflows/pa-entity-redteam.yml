name: PA Entity red-team wire audit

on:
  push:
    paths:
      - '.github/workflows/pa-entity-redteam.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Adversarial production checks
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://pa-entity-x402.floot.app'
          PAID="$BASE/_api/pa-business"

          req() {
            label="$1"; shift
            echo
            echo "=== $label ==="
            curl -sS -D /tmp/h -o /tmp/b -w 'status=%{http_code} time=%{time_total} size=%{size_download}\n' "$@" || true
            grep -Ei '^(content-type|cache-control|payment-required|access-control-allow-origin|access-control-expose-headers|allow|vary|x-floot-status):' /tmp/h || true
            head -c 1200 /tmp/b; echo
          }

          req 'GET valid unpaid' "$PAID?q=OpenAI&limit=1"
          req 'GET missing q unpaid' "$PAID"
          req 'GET empty q unpaid' "$PAID?q=&limit=1"
          req 'GET invalid limit unpaid' "$PAID?q=OpenAI&limit=999999"
          req 'GET SQL-ish q unpaid' "$PAID?q=%27%20OR%201%3D1--&limit=1"
          req 'GET wildcard q unpaid' "$PAID?q=%25_%25&limit=1"
          req 'GET unicode q unpaid' "$PAID?q=M%C3%BCller&limit=1"
          req 'GET huge q unpaid' "$PAID?q=$(python3 - <<'PY'
print('A'*5000)
PY
)&limit=1"
          req 'HEAD paid route' -I "$PAID?q=OpenAI&limit=1"
          req 'OPTIONS paid route' -X OPTIONS -H 'Origin: https://buyer.example' -H 'Access-Control-Request-Method: GET' -H 'Access-Control-Request-Headers: payment-signature' "$PAID?q=OpenAI&limit=1"
          req 'POST paid route' -X POST "$PAID?q=OpenAI&limit=1"

          for p in '/.well-known/x402' '/.well-known/x402.json' '/.well-known/x402-services.json' '/.well-known/x402-service.json' '/.well-known/x402-catalog.json' '/openapi.json' '/llms.txt' '/skill.md' '/robots.txt' '/sitemap.xml' '/_api/sample-pa-business'; do
            req "DISCOVERY $p" "$BASE$p"
          done

          echo
          echo '=== 402 HEADER/BODY PARITY ==='
          curl -sS -D /tmp/h -o /tmp/b "$PAID?q=OpenAI&limit=1"
          python3 - <<'PY'
          import base64,json,re
          h=open('/tmp/h').read()
          b=json.load(open('/tmp/b'))
          m=re.search(r'(?im)^payment-required:\s*(\S+)',h)
          print('body keys',sorted(b.keys()))
          if not m:
              print('NO_PAYMENT_REQUIRED_HEADER')
              raise SystemExit(1)
          raw=m.group(1)
          pad='='*(-len(raw)%4)
          try:
              decoded=json.loads(base64.b64decode(raw+pad))
          except Exception:
              decoded=json.loads(base64.urlsafe_b64decode(raw+pad))
          print('header keys',sorted(decoded.keys()))
          print('x402Version parity',decoded.get('x402Version')==b.get('x402Version'))
          print('accepts parity',decoded.get('accepts')==b.get('accepts'))
          print('resource parity',decoded.get('resource')==b.get('resource'))
          a=(decoded.get('accepts') or [{}])[0]
          print('network',a.get('network'))
          print('amount',a.get('amount') or a.get('maxAmountRequired'))
          print('asset',a.get('asset'))
          print('payTo',a.get('payTo'))
          print('domain',a.get('extra'))
          print('resource',decoded.get('resource'))
          if decoded.get('accepts') != b.get('accepts'):
              raise SystemExit('header/body accepts mismatch')
          PY

          echo
          echo '=== OPENAPI INTERNAL CONSISTENCY ==='
          curl -fsSL "$BASE/openapi.json" >/tmp/openapi.json
          python3 - <<'PY'
          import json
          o=json.load(open('/tmp/openapi.json'))
          op=o['paths']['/_api/pa-business']['get']
          print('operationId',op.get('operationId'))
          print('summary',op.get('summary'))
          print('required params',[(p.get('name'),p.get('required')) for p in op.get('parameters',[])])
          print('payment',op.get('x-payment-info'))
          print('contact',o.get('info',{}).get('contact'))
          print('externalDocs',o.get('externalDocs'))
          PY
