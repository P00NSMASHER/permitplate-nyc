name: rescore PA Entity AppDeploy on Circle

on:
  push:
    paths:
      - '.github/workflows/tmp-circle-rescore.yml'

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run Circle agent-readiness score
        shell: bash
        run: |
          set -euo pipefail
          URL='https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s/openapi.json'
          curl -sS --max-time 30 -X POST 'https://agents.circle.com/sell/score/check'             -H 'content-type: application/json'             --data "$(jq -nc --arg url "$URL" '{url:$url}')" | tee /tmp/score.json
          echo
          echo '=== concise ==='
          jq '{ok,score,grade,tier,dimensions,checks,warnings,fixes,domain,origin,specUrl}' /tmp/score.json
