name: Agent402 cheap seller registration

on:
  push:
    paths:
      - '.github/workflows/x402-agent402-cheap-register.yml'

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Register AppDeploy seller base
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s'
          echo '=== register ==='
          curl -sS -w '\nHTTP_STATUS=%{http_code}\n' -X POST             'https://agent402.tools/api/index/register'             -H 'content-type: application/json'             --data "$(jq -nc --arg origin "$BASE" '{origin:$origin}')"
          echo
          echo '=== index readback by seller ==='
          curl -sS -G -w '\nHTTP_STATUS=%{http_code}\n'             'https://agent402.tools/api/index'             --data-urlencode "seller=api-v2.appdeploy.ai"             --data-urlencode 'limit=100' | head -c 30000
