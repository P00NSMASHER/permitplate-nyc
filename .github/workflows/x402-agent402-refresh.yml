name: x402 agent402 refresh

on:
  push:
    paths:
      - '.github/workflows/x402-agent402-refresh.yml'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-register seller origin and read back
        shell: bash
        run: |
          set +e
          ORIGIN='https://pa-entity-x402.floot.app'
          echo '=== register origin ==='
          curl -sS -i -X POST 'https://agent402.tools/api/index/register'             -H 'content-type: application/json'             --data "{"origin":"$ORIGIN"}"

          echo
          echo '=== seller index readback ==='
          curl -sS "https://agent402.tools/api/index?seller=pa-entity-x402.floot.app" | head -c 24000

          echo
          echo '=== buyer query: Pennsylvania business registry ==='
          curl -sS 'https://agent402.tools/api/route?q=Pennsylvania%20business%20registry&include=external' | head -c 24000
