name: Test x402 rehost core

on:
  push:
    paths:
      - 'recovery/x402-rehost-core.mjs'
      - 'scripts/test-x402-rehost-core.mjs'
      - '.github/workflows/test-x402-rehost-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Official upstream smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: |
          node --check recovery/x402-rehost-core.mjs
          node --check scripts/test-x402-rehost-core.mjs

      - name: Test official public upstreams
        run: node scripts/test-x402-rehost-core.mjs
