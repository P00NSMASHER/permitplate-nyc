name: Test x402 rehost core

on:
  push:
    paths:
      - 'recovery/x402-rehost-core.mjs'
      - 'scripts/test-x402-rehost-core.mjs'
      - 'scripts/verify-x402-portfolio.mjs'
      - 'recovery/x402-portfolio-target.json'
      - 'recovery/x402-payment-core.mjs'
      - 'recovery/x402-paid-operation.mjs'
      - 'scripts/test-x402-target-manifest.mjs'
      - 'scripts/test-x402-payment-core.mjs'
      - 'scripts/test-x402-paid-operation.mjs'
      - '.github/workflows/test-x402-rehost-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Official upstream smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: |
          node --check recovery/x402-rehost-core.mjs
          node --check scripts/test-x402-rehost-core.mjs
          node --check scripts/verify-x402-portfolio.mjs
          node --check scripts/test-x402-target-manifest.mjs
          node --check recovery/x402-payment-core.mjs
          node --check scripts/test-x402-payment-core.mjs
          node --check recovery/x402-paid-operation.mjs
          node --check scripts/test-x402-paid-operation.mjs
          node --check recovery/vendor-intake-gate-core.mjs
          node --check scripts/test-vendor-intake-gate-core.mjs
          node --check recovery/x402-paid-operation.mjs
          node --check scripts/test-x402-paid-operation.mjs

      - name: Validate target portfolio contract
        run: node scripts/test-x402-target-manifest.mjs

      - name: Validate x402 payment core
        run: node scripts/test-x402-payment-core.mjs

      - name: Validate paid-operation state machine
        run: node scripts/test-x402-paid-operation.mjs

      - name: Validate paid operation lifecycle
        run: node scripts/test-x402-paid-operation.mjs

      - name: Test official public upstreams
        run: node scripts/test-x402-rehost-core.mjs

      - name: Test vendor-intake decision integration
        run: node scripts/test-vendor-intake-gate-core.mjs
