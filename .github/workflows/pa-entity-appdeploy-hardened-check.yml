name: PA Entity AppDeploy hardened check

on:
  push:
    paths:
      - '.github/workflows/pa-entity-appdeploy-hardened-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify hardened AppDeploy wire behavior
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s'
          MAIN="$BASE/api/pa-business?q=OpenAI&limit=1"
          CHEAP="$BASE/api/pa-entity-one?q=OpenAI"

          check402 () {
            label="$1"; url="$2"
            echo "=== $label UNPAID ==="
            code=$(curl -sS -D /tmp/h -o /tmp/b -w '%{http_code}' "$url")
            echo "HTTP=$code"
            test "$code" = 402
            grep -qi '^payment-required:' /tmp/h
            jq '{error,x402Version,resource,accepts,extensions}' /tmp/b
          }

          check402 MAIN "$MAIN"
          check402 CHEAP "$CHEAP"

          echo '=== MAIN INVALID DECODED PAYMENT ==='
          SIG=$(printf '{"x402Version":2}' | base64 -w0)
          code=$(curl -sS -D /tmp/h -o /tmp/b -w '%{http_code}' -H "PAYMENT-SIGNATURE: $SIG" "$MAIN")
          echo "HTTP=$code"
          cat /tmp/b
          test "$code" = 402
          test "$(jq -r '.error' /tmp/b)" = invalid_payload

          echo
          echo '=== INVALID PAID QUERY BEFORE VERIFY ==='
          code=$(curl -sS -o /tmp/b -w '%{http_code}' -H "PAYMENT-SIGNATURE: $SIG" "$BASE/api/pa-business?q=A&limit=1")
          echo "HTTP=$code"
          cat /tmp/b
          test "$code" = 400

          echo
          echo '=== STRICT LIMIT ==='
          code=$(curl -sS -o /tmp/b -w '%{http_code}' -H "PAYMENT-SIGNATURE: $SIG" "$BASE/api/pa-business?q=OpenAI&limit=10garbage")
          echo "HTTP=$code"
          cat /tmp/b
          test "$code" = 400

          echo
          echo '=== POSITIVE BAZAAR EXAMPLE ==='
          curl -sS "$MAIN" -D /tmp/h -o /tmp/b || true
          HEADER=$(awk 'BEGIN{IGNORECASE=1}/^payment-required:/{print $2}' /tmp/h | tr -d '\r')
          node -e 'const h=process.argv[1]; const j=JSON.parse(Buffer.from(h,"base64").toString()); if(j.extensions?.bazaar?.info?.output?.example?.count!==1) process.exit(1); console.log(JSON.stringify(j.extensions.bazaar.info.output.example));' "$HEADER"
