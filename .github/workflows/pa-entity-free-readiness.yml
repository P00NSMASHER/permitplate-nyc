name: PA Entity free readiness evidence

on:
  push:
    paths:
      - '.github/workflows/pa-entity-free-readiness.yml'

jobs:
  paywitness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Discover Paywitness free self-list schema
        shell: bash
        run: |
          set +e
          for p in / /openapi.json /llms.txt /list; do
            echo "=== GET $p ==="
            curl -sS -i --max-time 15 "https://paywitness.ai$p" | head -c 20000
            echo
          done

          echo '=== OPTIONS /list ==='
          curl -sS -i --max-time 15 -X OPTIONS 'https://paywitness.ai/list' | head -c 12000
          echo

          echo '=== POST /list EMPTY SCHEMA PROBE ==='
          curl -sS -i --max-time 15 -X POST 'https://paywitness.ai/list'             -H 'content-type: application/json'             --data '{}' | head -c 16000
          echo
