name: PA Entity free readiness evidence

on:
  push:
    paths:
      - '.github/workflows/pa-entity-free-readiness.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Run free buyer-path diagnostics
        shell: bash
        run: |
          set -euo pipefail

          run_diag () {
            label="$1"
            endpoint="$2"
            query="$3"
            echo "=== DIAGNOSTIC $label ==="
            curl -sS -X POST 'https://ontarioprotocol.com/api/tools/agent-buyer-conversion-diagnostic'               -H 'content-type: application/json'               --data "$(jq -nc --arg endpoint "$endpoint" --arg query "$query" '{endpoint_url:$endpoint,buyer_query:$query,source:"seller_optimization"}')"               | tee "/tmp/$label.json"
            echo
          }

          run_diag cheap             'https://pa-entity-x402.floot.app/_api/pa-entity-one?q=OpenAI'             'look up one Pennsylvania company registration by business name'

          run_diag main             'https://pa-entity-x402.floot.app/_api/pa-business?q=OpenAI&limit=1'             'search the Pennsylvania business registry and return filing number registration type address and officers'

          echo '=== SUMMARY ==='
          python3 - <<'PY'
          import json
          for label in ('cheap','main'):
              d=json.load(open(f'/tmp/{label}.json'))
              print(label, json.dumps(d, indent=2)[:20000])
          PY
