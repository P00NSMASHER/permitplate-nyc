name: PA Entity cheap-route qualification

on:
  push:
    paths:
      - '.github/workflows/pa-entity-commercial-status.yml'

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify existing $0.001 best-match seller
        shell: bash
        run: |
          set +e
          E='https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s/api/pa-entity-one?q=OpenAI'

          echo '=== DIRECT 402 ==='
          curl -sS -D /tmp/h -o /tmp/b -w 'status=%{http_code} time=%{time_total} bytes=%{size_download}\n' "$E"
          grep -Ei '^(content-type|payment-required|cache-control|x402-price|x402-network|x402-pay-to):' /tmp/h || true
          cat /tmp/b

          echo
          echo '=== HEADER DECODE ==='
          python3 - <<'PY'
          import base64,json,re
          h=open('/tmp/h').read()
          m=re.search(r'(?im)^payment-required:\s*(\S+)',h)
          if not m:
            print('NO PAYMENT-REQUIRED')
            raise SystemExit(1)
          x=m.group(1); x += '='*((4-len(x)%4)%4)
          print(json.dumps(json.loads(base64.b64decode(x)),indent=2))
          PY

          echo
          echo '=== MARKET402 SELFTEST ==='
          curl -sS -X POST 'https://market402.com/selftest'             -H 'content-type: application/json'             --data "$(jq -nc --arg url "$E" '{url:$url}')" | jq .

          echo
          echo '=== CDP VALIDATE ==='
          curl -sS -X POST 'https://api.cdp.coinbase.com/platform/v2/x402/validate'             -H 'content-type: application/json'             --data "$(jq -nc --arg resource "$E" '{resource:$resource,method:"GET"}')" | jq .
