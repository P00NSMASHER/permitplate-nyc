name: PA Entity Market402 submission
# corrected resource field

on:
  push:
    paths:
      - '.github/workflows/pa-entity-commercial-status.yml'

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Submit seller with paid-probe opt-in
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT='https://pa-entity-x402.floot.app/_api/pa-business?q=OpenAI&limit=1'

          echo '=== SELFTEST ==='
          curl -sS -i -X POST 'https://market402.com/selftest'             -H 'content-type: application/json'             --data "$(jq -nc --arg url "$ENDPOINT" '{url:$url}')" | tee /tmp/selftest.txt

          echo
          echo '=== SUBMIT + PAID PROBE OPT-IN ==='
          curl -sS -i -X POST 'https://market402.com/submit'             -H 'content-type: application/json'             --data "$(jq -nc               --arg url "$ENDPOINT"               --argjson price 0.005               '{
                resource:$url,
                declared_price_usd:$price,
                paid_probe_optin:true,
                sample_input:{
                  method:"GET",
                  queryParams:{q:"OpenAI",limit:1}
                }
              }')" | tee /tmp/submit.txt

          echo
          echo '=== OPTIN ROSTER CHECK ==='
          curl -sS 'https://market402.com/optin.json' > /tmp/optin.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/optin.json'))
          needle='pa-entity-x402.floot.app'
          raw=json.dumps(d)
          print('contains=',needle in raw)
          if needle in raw:
            def walk(x,path=''):
              if isinstance(x,dict):
                if needle in json.dumps(x):
                  print(path,json.dumps(x,indent=2)[:12000])
                for k,v in x.items(): walk(v,path+'/'+str(k))
              elif isinstance(x,list):
                for i,v in enumerate(x): walk(v,path+'/'+str(i))
            walk(d)
          PY

          echo
          echo '=== OPERATOR READBACK ==='
          curl -sS -i 'https://market402.com/op/pa-entity-x402.floot.app.json' | head -c 12000
