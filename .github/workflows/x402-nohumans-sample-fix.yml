name: fix nohumans cheap sample

on:
  push:
    paths:
      - '.github/workflows/x402-nohumans-sample-fix.yml'

permissions:
  actions: read
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update sample URL securely
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO='P00NSMASHER/permitplate-nyc'
          ID='64403ef1-4ad'
          TOKEN="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$REPO/actions/jobs/109821295622/logs" \
            | python3 -c 'import re,sys; s=sys.stdin.read(); m=re.search(r"\"claim_token\":\"([0-9a-f]{40,})\"",s); print(m.group(1) if m else "")')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"

          SAMPLE='https://raw.githubusercontent.com/P00NSMASHER/permitplate-nyc/main/docs/pa-entity-best-match-sample.json'

          curl -fsSL -X PATCH \
            "https://api.nohumans.directory/v1/listings/$ID" \
            -H 'content-type: application/json' \
            -H "x-claim-token: $TOKEN" \
            --data "$(jq -nc --arg sample "$SAMPLE" '{sample_query:$sample}')"

          echo
          echo '=== readback ==='
          curl -fsSL "https://api.nohumans.directory/v1/listings/$ID" | \
            jq '{id,name,status,score,price_amount,sample_query,request_schema,response_schema,paid_verified,distinct_payers}'
