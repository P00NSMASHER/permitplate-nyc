name: test PA Entity hardened contract

on:
  push:
    paths:
      - '.github/workflows/test-pa-entity-contract.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run core and contract tests
        run: |
          npx -y tsx seller-hardening/pa-entity-core.test.ts
          npx -y tsx seller-hardening/contract.test.ts
