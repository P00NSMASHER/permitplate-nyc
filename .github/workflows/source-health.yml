name: PermitPlate public-source health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 11 * * *'
  push:
    branches:
      - main
    paths:
      - 'pipeline/**'
      - '.github/workflows/source-health.yml'

concurrency:
  group: permitplate-evidence-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-health:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Scan official public sources
        run: node pipeline/run-source-health.js source-health-result.json

      - name: Retain source observation receipt artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: permitplate-source-health-${{ github.sha }}-${{ github.run_id }}
          path: source-health-result.json
          if-no-files-found: warn
          retention-days: 30
