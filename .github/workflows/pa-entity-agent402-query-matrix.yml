name: PA Entity Agent402 cheap query matrix

on:
  push:
    paths:
      - '.github/workflows/pa-entity-agent402-query-matrix.yml'

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find buyer intents where cheap route ranks
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://pa-entity-x402.floot.app'
          CHEAP_ROUTE='/_api/pa-entity-one'
          queries=(
            'Pennsylvania company identity'
            'Pennsylvania legal entity lookup'
            'Pennsylvania company lookup'
            'Pennsylvania business best match'
            'best Pennsylvania company match'
            'Pennsylvania filing number lookup'
            'Pennsylvania vendor verification'
            'company identity Pennsylvania'
            'legal entity Pennsylvania'
            'Pennsylvania business registry best match'
            'find Pennsylvania company registration'
            'one Pennsylvania legal entity'
          )

          : > /tmp/matrix.ndjson
          for q in "${queries[@]}"; do
            curl -sS -G 'https://agent402.tools/api/route'               --data-urlencode "q=$q"               --data-urlencode 'include=external'               --data-urlencode 'top=25' > /tmp/r.json

            jq -c --arg q "$q" --arg seller "$ORIGIN" --arg route "$CHEAP_ROUTE" '
              . as $root
              | ($root.results // []) as $r
              | ([range(0; ($r|length)) | select($r[.]?.seller == $seller and $r[.]?.route == $route)] | .[0]) as $idx
              | {
                  query:$q,
                  found:($idx != null),
                  rank:(if $idx == null then null else ($idx+1) end),
                  matched:(if $idx == null then null else $r[$idx] | {
                    slug,name,price,score,why,routerDispatchEligible,routerDispatchReason,routerDispatchByChain
                  } end),
                  top3:[$r[0:3][] | {seller,slug,name,price,score,routerDispatchEligible,routerDispatchReason}]
                }' /tmp/r.json | tee -a /tmp/matrix.ndjson
          done

          echo '=== SORTED TARGET RANKS ==='
          jq -s 'sort_by(if .rank == null then 999 else .rank end, -(.matched.score // 0))' /tmp/matrix.ndjson

          echo '=== BEST ==='
          jq -s '[.[] | select(.found)] | sort_by(.rank, -(.matched.score // 0)) | .[0:8]' /tmp/matrix.ndjson
