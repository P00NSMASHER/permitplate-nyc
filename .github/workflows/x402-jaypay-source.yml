name: jaypay submit source capture

on:
  push:
    paths:
      - '.github/workflows/x402-jaypay-source.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Capture public submit page and scripts
        shell: bash
        run: |
          set -e
          OUT='x402-jaypay-source.txt'
          curl -fsSL 'https://402directory.com/submit' -o /tmp/page
          {
            echo '=== PAGE ==='
            cat /tmp/page
            echo
            echo '=== SCRIPTS ==='
          } > "$OUT"
          grep -oE '<script[^>]+src="[^"]+"' /tmp/page | sed -E 's/.*src="([^"]+)".*/\1/' | sort -u > /tmp/scripts || true
          cat /tmp/scripts >> "$OUT"
          while read -r src; do
            [ -z "$src" ] && continue
            case "$src" in
              http*) url="$src" ;;
              *) url="https://402directory.com$src" ;;
            esac
            echo >> "$OUT"
            echo "=== SCRIPT $url ===" >> "$OUT"
            curl -fsSL "$url" >> "$OUT" || true
          done < /tmp/scripts

      - name: Commit capture
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add x402-jaypay-source.txt
          git commit -m 'Capture jaypay submit source' || exit 0
          git push
