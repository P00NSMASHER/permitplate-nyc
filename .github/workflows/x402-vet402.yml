name: x402 vet402 check

on:
  push:
    paths:
      - '.github/workflows/x402-vet402.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check vet402 and current verifier state
        shell: bash
        run: |
          set +e
          ENDPOINT='https://pa-entity-x402.floot.app/_api/pa-business?q=OpenAI&limit=1'
          echo '=== vet402 resolve ==='
          curl -sS -i "https://vet402.com/api/v1/resolve?q=$(jq -rn --arg v "$ENDPOINT" '$v|@uri')" | tee /tmp/vet-resolve.txt

          RID=$(python3 - <<'PY'
          import json,re
          s=open('/tmp/vet-resolve.txt',errors='ignore').read()
          m=re.search(r'\{.*\}',s,re.S)
          if not m: print(''); raise SystemExit
          try:
              d=json.loads(m.group(0))
          except Exception:
              print(''); raise SystemExit
          print(d.get('resource_id') or d.get('resourceId') or d.get('id') or '')
          PY
          )

          echo
          echo "RESOURCE_ID=$RID"
          if [ -n "$RID" ]; then
            echo '=== vet402 decision ==='
            curl -sS -i "https://vet402.com/api/v1/resources/$RID/decision?role=payer"
            echo
            echo '=== vet402 observatory record ==='
            curl -sS -i "https://vet402.com/api/v1/resources/$RID"
          fi

          echo
          echo '=== nohumans current ==='
          curl -sS 'https://api.nohumans.directory/v1/listings/958fd262-287' | jq '{status,score,probe_count,probes_passed,probes_failed,consecutive_failures,paid_verified,distinct_payers,evidence_tier,last_probed_at_iso,next_check_by_iso,onchain_unique_payers_30d}'

          echo
          echo '=== Market402 operator check ==='
          curl -sS -i 'https://market402.com/op/pa-entity-x402.floot.app.json' | head -c 12000

          echo
          echo '=== Cinderwright duplicate/status check ==='
          curl -sS -i -X POST 'https://api.ideafactorylab.org/submit'             -H 'content-type: application/json'             --data '{"url":"https://pa-entity-x402.floot.app","name":"PA Entity Lookup x402","description":"Pennsylvania business registry and legal-entity enrichment by company name."}' | head -c 6000
