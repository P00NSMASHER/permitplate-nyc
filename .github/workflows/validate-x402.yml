name: Validate and register x402 seller

on:
  push:
    paths:
      - '.github/workflows/validate-x402.yml'

jobs:
  validate-register:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_URL: https://pa-entity-x402.floot.app
    steps:
      - name: Validate AgentCash discovery
        run: npx -y @agentcash/discovery@latest discover "$TARGET_URL"
      - name: Check paid endpoint
        run: npx -y @agentcash/discovery@latest check "$TARGET_URL/_api/pa-business"
      - name: Assert production discovery and 402
        shell: bash
        run: |
          set -euo pipefail
          spec="$(curl -fsS "$TARGET_URL/openapi.json")"
          printf '%s' "$spec" | grep -q '"x-payment-info"'
          status="$(curl -sS -o /tmp/body.txt -D /tmp/headers.txt -w '%{http_code}' "$TARGET_URL/_api/pa-business")"
          test "$status" = "402"
          grep -qi '^payment-required:' /tmp/headers.txt
      - name: Register origin on x402scan with SIWX
        run: >
          npx -y agentcash@latest fetch
          https://x402scan.com/api/x402/registry/register-origin
          -m POST
          -b '{"origin":"https://pa-entity-x402.floot.app"}'
