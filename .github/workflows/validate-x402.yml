name: Validate x402 discovery

on:
  push:
    paths:
      - '.github/workflows/validate-x402.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_URL: https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s
      FRONTEND_URL: https://pa-entity-lookup-x402-4fbm4s.v2.appdeploy.ai
    steps:
      - name: Check backend origin behavior
        shell: bash
        run: |
          set -euo pipefail
          echo '=== backend openapi ==='
          curl -sS -o /tmp/backend-openapi.txt -D - -w '\nSTATUS=%{http_code}\n' "$API_URL/openapi.json" || true
          head -c 600 /tmp/backend-openapi.txt || true
          echo
          echo '=== backend unpaid endpoint ==='
          curl -sS -o /tmp/backend-body.txt -D - -w '\nSTATUS=%{http_code}\n' "$API_URL/api/pa-business" || true
          cat /tmp/backend-body.txt || true
      - name: Check frontend same-origin escape hatch
        shell: bash
        run: |
          set -euo pipefail
          echo '=== frontend openapi ==='
          curl -sS -o /tmp/front-openapi.txt -D - -w '\nSTATUS=%{http_code}\n' "$FRONTEND_URL/openapi.json" || true
          head -c 600 /tmp/front-openapi.txt || true
          echo
          echo '=== frontend unpaid endpoint ==='
          curl -sS -o /tmp/front-body.txt -D - -w '\nSTATUS=%{http_code}\n' "$FRONTEND_URL/api/pa-business" || true
          head -c 1200 /tmp/front-body.txt || true
