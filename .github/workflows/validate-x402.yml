name: Verify external paid x402 call

on:
  push:
    paths:
      - '.github/workflows/validate-x402.yml'

jobs:
  paid-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARGET_URL: https://pa-entity-x402.floot.app
    steps:
      - name: Confirm discovery
        run: npx -y @agentcash/discovery@latest discover "$TARGET_URL"
      - name: Show buyer wallet balance
        run: npx -y agentcash@latest balance
      - name: Attempt real paid lookup
        shell: bash
        run: |
          set +e
          npx -y agentcash@latest fetch "$TARGET_URL/_api/pa-business?q=OpenAI&limit=1"
          code=$?
          echo "PAID_FETCH_EXIT=$code"
          exit 0
