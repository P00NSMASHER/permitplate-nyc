name: PA Entity AppDeploy live verification 2

on:
  push:
    paths:
      - '.github/workflows/verify-pa-entity-appdeploy2.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify live AppDeploy seller
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s'
          E="$BASE/api/pa-business?q=OpenAI&limit=1"

          check_status() {
            label="$1"; expected="$2"; shift 2
            code=$(curl -sS -D /tmp/h -o /tmp/b -w '%{http_code}' "$@")
            echo "=== $label ==="
            echo "status=$code"
            grep -Ei '^(content-type|cache-control|payment-required|payment-response|access-control|retry-after|x402-settled):' /tmp/h || true
            head -c 1200 /tmp/b || true
            echo
            test "$code" = "$expected"
          }

          check_status 'x402 canonical' 200 "$BASE/.well-known/x402"
          check_status 'x402 json alias' 200 "$BASE/.well-known/x402.json"
          check_status 'x402 services alias' 200 "$BASE/.well-known/x402-services.json"
          check_status 'openapi' 200 "$BASE/openapi.json"
          check_status 'unpaid paid-route challenge' 402 "$E"

          python3 - <<'PY'
          import base64,json,re
          h=open('/tmp/h').read()
          b=json.load(open('/tmp/b'))
          m=re.search(r'(?im)^payment-required:\s*(\S+)',h)
          assert m, 'missing PAYMENT-REQUIRED'
          raw=m.group(1)
          raw += '='*((4-len(raw)%4)%4)
          d=json.loads(base64.b64decode(raw).decode())
          a=d['accepts'][0]
          assert d['x402Version']==2
          assert a['network']=='eip155:8453'
          assert a['amount']=='5000'
          assert a['payTo'].lower()=='0x708f7b52b56eafd7fc1de65fc7752ed732914021'
          assert a['extra']['name']=='USD Coin'
          assert d['extensions']['bazaar']['info']['output']['example']['count']==1
          print('PAYMENT_CHALLENGE_PARITY=PASS')
          PY

          BAD=$(printf '{"x402Version":2}' | base64 -w0)
          check_status 'invalid decoded payment' 402 -H "PAYMENT-SIGNATURE: $BAD" "$E"
          grep -Eq '"error":"(invalid_payload|payment_verification_failed)"' /tmp/b

          check_status 'invalid paid query rejected before verifier' 400 -H "PAYMENT-SIGNATURE: $BAD" "$BASE/api/pa-business?q=A&limit=1"

          check_status 'OPTIONS CORS' 204 -X OPTIONS             -H 'Origin: https://buyer.example'             -H 'Access-Control-Request-Method: GET'             -H 'Access-Control-Request-Headers: payment-signature'             "$E"
          grep -Eqi '^access-control-allow-origin: \*' /tmp/h
          grep -Eqi '^access-control-allow-headers: .*payment-signature' /tmp/h

          check_status 'demo OpenAI' 200 "$BASE/api/demo?q=OpenAI"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/b'))
          assert d['count'] >= 1
          r=d['results'][0]
          assert 'creationDate' in r
          assert 'countyCode' in r
          assert 'principals' in r
          print('ENRICHED_SEARCH_SHAPE=PASS')
          PY

          echo '=== Agent402 refresh ==='
          payload=$(jq -nc --arg origin "$BASE" '{origin:$origin}')
          curl -sS -X POST 'https://agent402.tools/api/index/register'             -H 'content-type: application/json'             --data "$payload" | tee /tmp/agent402.json
          jq . /tmp/agent402.json
