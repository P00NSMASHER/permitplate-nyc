name: Test Floot vendor gate reviewer fixtures

on:
  push:
    branches: [main]
    paths:
      - 'docs/pa-entity-floot-release/vendor-intake-demo_GET.ts'
      - 'docs/pa-entity-floot-release/vendor-intake-demo_GET.schema.ts'
      - 'scripts/test-floot-vendor-gate-demo-wrapper.mjs'
      - 'scripts/test-vendor-intake-gate-core.mjs'
      - 'tests/test_vendor_fixture_ci_policy.py'
      - '.github/workflows/test-floot-vendor-gate-reviewer-fixtures.yml'
  pull_request:
    paths:
      - 'docs/pa-entity-floot-release/vendor-intake-demo_GET.ts'
      - 'docs/pa-entity-floot-release/vendor-intake-demo_GET.schema.ts'
      - 'scripts/test-floot-vendor-gate-demo-wrapper.mjs'
      - 'scripts/test-vendor-intake-gate-core.mjs'
      - 'tests/test_vendor_fixture_ci_policy.py'
      - '.github/workflows/test-floot-vendor-gate-reviewer-fixtures.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vendor-fixtures-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Verify source and workflow safety
        run: python3 -m unittest discover -s tests -p 'test_vendor_fixture_ci_policy.py' -v

      - name: Verify bounded free-review wrapper
        run: node scripts/test-floot-vendor-gate-demo-wrapper.mjs

      - name: Verify decision engine paths
        run: node scripts/test-vendor-intake-gate-core.mjs
