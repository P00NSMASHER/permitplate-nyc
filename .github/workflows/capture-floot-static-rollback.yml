name: Capture Floot static rollback baseline

on:
  push:
    branches: [main]
    paths:
      - 'scripts/capture-floot-static-rollback.mjs'
      - '.github/workflows/capture-floot-static-rollback.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: permitplate-main-receipt-writers
  cancel-in-progress: false

jobs:
  capture:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Admit only the exact current main commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          CURRENT="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test -n "$CURRENT" && test "$CURRENT" = "$EXPECTED_SHA" || { echo "Ref refused: current main has moved." >&2; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Capture public static rollback bytes
        env:
          REPORT_PATH: verification/floot-static-rollback-public-latest.json
        run: node scripts/capture-floot-static-rollback.mjs

      - name: Commit rollback receipt
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          RECEIPT='verification/floot-static-rollback-public-latest.json'
          cp "$RECEIPT" /tmp/floot-static-rollback-public-latest.json

          git fetch --no-tags origin main
          CURRENT="$(git rev-parse refs/remotes/origin/main)"
          test "$CURRENT" = "$EXPECTED_SHA" || { echo "Main advanced during capture." >&2; exit 1; }
          git reset --hard "$EXPECTED_SHA"
          cp /tmp/floot-static-rollback-public-latest.json "$RECEIPT"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RECEIPT"
          if git diff --cached --quiet; then
            echo 'Rollback receipt unchanged.'
            exit 0
          fi
          git commit -m 'verification: refresh Floot static rollback baseline'
          REMOTE="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          test "$REMOTE" = "$EXPECTED_SHA" || { echo "Main advanced; refusing receipt write." >&2; exit 1; }
          git push origin HEAD:main
