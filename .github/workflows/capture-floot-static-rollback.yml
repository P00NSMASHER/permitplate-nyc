name: Verify frozen Floot static rollback baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: permitplate-frozen-floot-baseline-verifier
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Admit exact current main
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          CURRENT="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test "$CURRENT" = "$EXPECTED_SHA" || { echo 'Source drift; refusing baseline verification' >&2; exit 1; }
      - name: Check out reviewed current source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require original historical blob, not a freshly recaptured file
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='af59379dd3bacc5966107b5ffdde6bce16a26936'
          ACTUAL="$(git hash-object verification/floot-static-rollback-public-latest.json)"
          test "$ACTUAL" = "$EXPECTED" || { echo 'Immutable historical baseline modified' >&2; exit 1; }
      - name: Select October 2026 patched Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Reject unpatched Node.js runtime
        run: |
          node --version
          node -e 'const [major,minor,patch]=process.versions.node.split(".").map(Number);if(major!==22 || minor<23 || (minor===23 && patch<4)) process.exit(1)'
      - name: Verify original baseline payloads without HTTP or credentials
        run: node scripts/test-floot-rollback-baseline.mjs
