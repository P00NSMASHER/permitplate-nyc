name: PA Entity PayAPI review status once

on:
  push:
    paths:
      - '.github/workflows/tmp-pa-entity-payapi-review-status.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check PayAPI public review/listing state
        shell: bash
        run: |
          set -euo pipefail

          echo '=== AGENT SEARCH NAME ==='
          curl -sS --get 'https://payapi.market/agent/search' \
            --data-urlencode 'q=PA Entity Lookup x402' | head -c 12000
          echo

          echo '=== AGENT SEARCH PENNSYLVANIA ==='
          curl -sS --get 'https://payapi.market/agent/search' \
            --data-urlencode 'q=Pennsylvania business registry' | head -c 12000
          echo

          echo '=== PROVIDER BY ID ==='
          for key in id provider_id; do
            echo "--- $key"
            code=$(curl -sS -o /tmp/provider.json -w '%{http_code}' --get 'https://payapi.market/api/get-provider' \
              --data-urlencode "$key=95c53b4e-fb07-42c5-996d-2b421a66744d")
            echo "HTTP_STATUS=$code"
            cat /tmp/provider.json | head -c 12000
            echo
          done

          echo '=== LISTING PAGE CANDIDATES ==='
          for path in \
            '/api/3b5351ff-4a2c-4ff9-911e-88c938486208' \
            '/agent/get?id=3b5351ff-4a2c-4ff9-911e-88c938486208'
          do
            echo "--- $path"
            code=$(curl -sS -o /tmp/item -w '%{http_code}' "https://payapi.market$path")
            echo "HTTP_STATUS=$code"
            head -c 12000 /tmp/item
            echo
          done
