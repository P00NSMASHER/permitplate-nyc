name: PA Entity Agent Bazaar listing once

on:
  push:
    paths:
      - '.github/workflows/pa-entity-agent-bazaar-once.yml'

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Submit manifest and verify listing
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST='https://pa-entity-x402.floot.app/.well-known/x402.json'

          echo '=== SUBMIT ==='
          HTTP=$(curl -sS -o /tmp/submit.json -w '%{http_code}' \
            -X POST 'https://bazaar.saylorinnovations.com/submit' \
            -H 'content-type: application/json' \
            --data '{"manifestUrl":"https://pa-entity-x402.floot.app/.well-known/x402.json"}')
          echo "HTTP_STATUS=$HTTP"
          cat /tmp/submit.json
          echo
          test "$HTTP" -ge 200
          test "$HTTP" -lt 300

          echo '=== SEARCH READBACK ==='
          curl -fsSL --get 'https://bazaar.saylorinnovations.com/discovery/search' \
            --data-urlencode 'urlSubstring=pa-entity-x402.floot.app' \
            --data-urlencode 'limit=50' > /tmp/search.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/search.json'))
          blob=json.dumps(d).lower()
          print(json.dumps(d,indent=2)[:24000])
          if 'pa-entity-x402.floot.app' not in blob:
              raise SystemExit('listing not present in readback')
          PY
