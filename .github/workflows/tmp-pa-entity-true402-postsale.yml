name: PA Entity true402 post-sale refresh
on:
  push:
    paths:
      - '.github/workflows/tmp-pa-entity-true402-postsale.yml'
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Refresh true402 seller reputation
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/r.json -w '%{http_code}'             -X POST 'https://true402.dev/api/v1/services'             -H 'content-type: application/json'             --data '{"url":"https://pa-entity-x402.floot.app"}')
          echo "HTTP=$code"
          cat /tmp/r.json | jq .
          test "$code" -ge 200
          test "$code" -lt 300
