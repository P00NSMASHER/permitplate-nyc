name: Refresh factory generated registry

on:
  push:
    branches:
      - x402-product-factory-bootstrap
    paths:
      - '.github/workflows/tmp-factory-refresh-generated.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: x402-product-factory-bootstrap
          fetch-depth: 0
      - name: Regenerate product module registry
        run: node factory/scripts/generate-product-module-registry.js
      - name: Commit generated registry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Factory Registry Refresh'
          git config user.email 'actions@users.noreply.github.com'
          git add factory/generated/product-modules.js
          if git diff --cached --quiet; then
            echo 'Generated registry already current.'
            exit 0
          fi
          git commit -m 'Refresh generated factory product modules'
          git push origin HEAD:x402-product-factory-bootstrap
