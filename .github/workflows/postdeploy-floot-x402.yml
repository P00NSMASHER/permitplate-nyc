name: Verify Floot post-deploy

on:
  workflow_dispatch:
    inputs:
      register_directories:
        description: After public verification is green, refresh Agent402, Market402, and 402 Index
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    name: Zero-spend Floot post-deploy verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Admit fixed origin and exact production main
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          CURRENT="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test -n "$CURRENT" && test "$CURRENT" = "$EXPECTED_SHA" || { echo "Stale or unauthorized production source." >&2; exit 1; }
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Use Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Verify public Floot release
        env:
          REGISTER_DIRECTORIES: '0'
          POSTDEPLOY_RECEIPT_PATH: floot-postdeploy-receipt.json
        run: node scripts/postdeploy-floot-x402.mjs

      - name: Upload post-deploy receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: floot-postdeploy-receipt
          path: floot-postdeploy-receipt.json
          if-no-files-found: warn

  register:
    name: Approved Floot marketplace registration
    needs: verify
    if: inputs.register_directories == true && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    environment: permitplate-directory-approval
    concurrency:
      group: permitplate-directory-mutations
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Admit fixed origin and exact production main
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          CURRENT="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test -n "$CURRENT" && test "$CURRENT" = "$EXPECTED_SHA" || { echo "Stale or unauthorized production source." >&2; exit 1; }
      - name: Check out approved main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Refresh directories only after successful verification
        env:
          REGISTER_DIRECTORIES: '1'
          POSTDEPLOY_RECEIPT_PATH: floot-directory-registration-receipt.json
        run: node scripts/postdeploy-floot-x402.mjs
      - name: Upload registration receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: floot-directory-registration-receipt
          path: floot-directory-registration-receipt.json
          if-no-files-found: warn
