name: PA Entity x402scan canonical register

on:
  push:
    paths:
      - '.github/workflows/tmp-pa-entity-x402scan-canonical-register.yml'

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Register production origin at canonical x402scan host
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://pa-entity-x402.floot.app'
          code=$(curl -sS -o /tmp/body -w '%{http_code}' -X POST 'https://www.x402scan.com/api/x402/registry/register-origin' \
            -H 'content-type: application/json' \
            --data "$(jq -nc --arg origin "$ORIGIN" '{origin:$origin}')")
          echo "HTTP_STATUS=$code"
          cat /tmp/body
          echo
