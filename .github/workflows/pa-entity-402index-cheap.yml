name: PA Entity 402Index cheap route

on:
  push:
    paths:
      - '.github/workflows/pa-entity-402index-cheap.yml'

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Register and read back cheap route
        shell: bash
        run: |
          set -euo pipefail
          URL='https://pa-entity-x402.floot.app/_api/pa-entity-one?q=OpenAI'

          echo '=== REGISTER ==='
          curl -sS -i -X POST 'https://402index.io/api/v1/register'             -H 'content-type: application/json'             --data "$(jq -nc               --arg url "$URL"               '{
                url:$url,
                name:"Pennsylvania Business Registry — Best Match",
                protocol:"x402",
                http_method:"GET",
                description:"Low-cost Pennsylvania company identity resolver by business name. Returns the single highest-ranked legal entity with filing number, registration type, creation date, registered address, county, and source-published principal/officer roles.",
                price_usd:0.001,
                payment_asset:"USDC",
                payment_network:"Base",
                category:"data/company",
                provider:"PA Entity Lookup x402"
              }')" | tee /tmp/register.txt

          echo
          echo '=== SEARCH READBACK ==='
          curl -sS -G 'https://402index.io/api/v1/services'             --data-urlencode 'q=Pennsylvania Business Registry Best Match'             --data-urlencode 'protocol=x402'             --data-urlencode 'max_price_usd=0.005'             --data-urlencode 'limit=20' | tee /tmp/search.json

          echo
          echo '=== TARGET MATCHES ==='
          jq --arg url "$URL" '[.. | objects | select((.url? // .endpoint? // "") == $url)]' /tmp/search.json
