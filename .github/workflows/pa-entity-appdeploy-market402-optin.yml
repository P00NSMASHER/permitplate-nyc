name: PA Entity AppDeploy Market402 paid probe opt-in

on:
  push:
    paths:
      - '.github/workflows/pa-entity-appdeploy-market402-optin.yml'

jobs:
  optin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Opt in hardened AppDeploy routes
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s'
          submit () {
            label="$1"
            resource="$2"
            query_json="$3"
            payload=$(jq -nc --arg resource "$resource" --argjson query "$query_json" '{resource:$resource,paid_probe_optin:true,max_probe_usd:0.01,sample_input:{method:"GET",queryParams:$query}}')
            echo "=== $label ==="
            curl -sS -X POST 'https://market402.com/submit' -H 'content-type: application/json' --data "$payload" | jq .
          }
          submit main "$BASE/api/pa-business?q=OpenAI&limit=1" '{"q":"OpenAI","limit":1}'
          submit cheap "$BASE/api/pa-entity-one?q=OpenAI" '{"q":"OpenAI"}'
