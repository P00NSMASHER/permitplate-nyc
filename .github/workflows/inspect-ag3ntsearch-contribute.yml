name: inspect ag3ntsearch contribution

on:
  push:
    paths:
      - '.github/workflows/inspect-ag3ntsearch-contribute.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read ag3ntsearch contribution schema and API
        shell: bash
        run: |
          set -euo pipefail
          for url in             'https://ag3ntsearch.com/contribution-schema.json'             'https://ag3ntsearch.fullyagentnativeapps.com/api/contributions'             'https://ag3ntsearch.com/outreach.json'             'https://ag3ntsearch.com/payments.json'
          do
            echo "=== $url ==="
            curl -sS -L --max-time 15 -D /tmp/h "$url" -o /tmp/b || true
            head -n 30 /tmp/h || true
            echo "--- body ---"
            head -c 50000 /tmp/b || true
            echo
          done
