name: inspect ag3ntsearch contribution

on:
  push:
    paths:
      - '.github/workflows/inspect-ag3ntsearch-contribute.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read FANA signing docs
        shell: bash
        run: |
          set -euo pipefail
          for url in             'https://fullyagentnativeapps.com/llms.txt'             'https://fullyagentnativeapps.com/.well-known/agent.json'             'https://fullyagentnativeapps.com/api'             'https://fullyagentnativeapps.com/docs'             'https://ag3ntsearch.fullyagentnativeapps.com/llms.txt'
          do
            echo "=== $url ==="
            curl -sS -L --max-time 15 -D /tmp/h "$url" -o /tmp/b || true
            head -n 25 /tmp/h || true
            echo "--- auth/signing matches ---"
            grep -Ein -C 4 'ag3nt-req|ed25519|signature|public.?key|x-ag3nt|bech32|nonce|timestamp' /tmp/b | head -n 300 || true
            echo "--- body start ---"
            head -c 25000 /tmp/b || true
            echo
          done
