name: x402 acquisition status

on:
  push:
    paths:
      - '.github/workflows/x402-acquisition.yml'

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check verification queues and propagation
        shell: bash
        run: |
          set +e

          echo '=== Market402 operator ==='
          curl -sS -i 'https://market402.com/op/pa-entity-x402.floot.app'
          echo
          echo '=== Market402 badge ==='
          curl -sS -i 'https://market402.com/badge/pa-entity-x402.floot.app'

          echo
          echo '=== Market402 operators search ==='
          curl -sS 'https://market402.com/operators.json'             | jq '[.operators[]? | select((.domain // .operator // .name // "" | tostring) | contains("pa-entity-x402"))]'

          echo
          echo '=== Cinderwright submission paths ==='
          for u in             'https://api.ideafactorylab.org/submissions/sub_1790757996876'             'https://api.ideafactorylab.org/submit/sub_1790757996876'             'https://api.ideafactorylab.org/status/sub_1790757996876'             'https://api.ideafactorylab.org/submission/sub_1790757996876'
          do
            echo "--- $u"
            curl -sS -i "$u" | head -80
          done

          echo
          echo '=== SwarmBazaar / InferenceView provider search ==='
          for u in             'https://inferenceview.com/api/providers?q=pa-entity-x402&limit=20'             'https://inferenceview.com/api/providers?q=Pennsylvania%20business%20registry&limit=20'             'https://swarmbazaar.com/api/providers?q=pa-entity-x402&limit=20'
          do
            echo "--- $u"
            curl -sS -i "$u" | head -120
          done

          echo
          echo '=== x402-list search ==='
          for u in             'https://x402-list.com/api/services?q=pa-entity-x402'             'https://x402-list.com/api/search?q=pa-entity-x402'             'https://x402-list.com/services?search=pa-entity-x402'
          do
            echo "--- $u"
            curl -sS -i "$u" | head -80
          done
