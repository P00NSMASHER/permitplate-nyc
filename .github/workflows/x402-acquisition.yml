name: x402 acquisition batch

on:
  push:
    paths:
      - '.github/workflows/x402-acquisition.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate seller against CDP x402
        shell: bash
        run: |
          set +e
          RESOURCE='https://pa-entity-x402.floot.app/_api/pa-business?q=OpenAI&limit=1'

          echo '=== CDP x402 validate ==='
          curl -sS -i -X POST 'https://api.cdp.coinbase.com/platform/v2/x402/validate' \
            -H 'content-type: application/json' \
            --data "$(jq -nc --arg resource "$RESOURCE" '{resource:$resource,method:"GET"}')" | tee /tmp/cdp-validate.txt

          echo
          echo '=== CDP facilitator root ==='
          curl -sS -i 'https://api.cdp.coinbase.com/platform/v2/x402' | head -c 8000

          echo
          echo '=== Live seller check ==='
          curl -sS -o /tmp/body -D /tmp/headers -w 'status=%{http_code} latency=%{time_total}\n' "$RESOURCE"
          grep -i '^payment-required:' /tmp/headers | head -1 | cut -c1-200
          head -c 600 /tmp/body
