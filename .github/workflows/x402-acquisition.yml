name: x402 acquisition batch

on:
  push:
    paths:
      - '.github/workflows/x402-acquisition.yml'

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Submit to free discovery APIs
        shell: bash
        run: |
          set +e
          RESULT='x402-acquisition-results.txt'
          : > "$RESULT"

          ENDPOINT='https://pa-entity-x402.floot.app/_api/pa-business?q=OpenAI&limit=1'
          ORIGIN='https://pa-entity-x402.floot.app'
          NAME='PA Entity Lookup x402'
          DESC='Company identity and legal-entity enrichment for Pennsylvania businesses by company name. Returns filing number, registration type, registered address, city, ZIP, and county for vendor verification, due diligence, and lead enrichment.'

          post_json () {
            label="$1"
            url="$2"
            payload="$3"
            echo "=== $label ===" | tee -a "$RESULT"
            curl -sS -D /tmp/h -o /tmp/b -X POST "$url"               -H 'content-type: application/json'               --data "$payload"
            code=$(awk 'toupper($1) ~ /^HTTP\// {c=$2} END{print c}' /tmp/h)
            echo "HTTP $code" | tee -a "$RESULT"
            cat /tmp/b | tee -a "$RESULT"
            echo | tee -a "$RESULT"
            echo | tee -a "$RESULT"
          }

          echo "Run UTC: $(date -u +%FT%TZ)" >> "$RESULT"
          echo "Endpoint: $ENDPOINT" >> "$RESULT"
          echo >> "$RESULT"

          post_json 'agent-tools.cloud url/type'             'https://agent-tools.cloud/api/v1/submit'             "$(jq -nc --arg url "$ENDPOINT" --arg name "$NAME" --arg description "$DESC"               '{type:"x402",url:$url,name:$name,description:$description}')"

          post_json 'agent-tools.cloud endpoint/kind'             'https://agent-tools.cloud/api/v1/submit'             "$(jq -nc --arg endpoint "$ENDPOINT" --arg title "$NAME" --arg description "$DESC"               '{kind:"x402",endpoint:$endpoint,title:$title,description:$description}')"

          post_json 'agent-tools.cloud minimal'             'https://agent-tools.cloud/api/v1/submit'             "$(jq -nc --arg url "$ENDPOINT" '{type:"x402",url:$url}')"

          post_json 'cinderwright origin/name'             'https://api.ideafactorylab.org/submit'             "$(jq -nc --arg url "$ORIGIN" --arg name "$NAME" --arg description "$DESC"               '{url:$url,name:$name,description:$description}')"

          post_json 'cinderwright endpoint/type'             'https://api.ideafactorylab.org/submit'             "$(jq -nc --arg url "$ENDPOINT" --arg name "$NAME" --arg description "$DESC"               '{url:$url,name:$name,description:$description,type:"x402"}')"

          post_json 'x402Scout endpoint'             'https://x402scout.com/register'             "$(jq -nc --arg url "$ENDPOINT" --arg name "$NAME" --arg description "$DESC"               '{url:$url,name:$name,description:$description}')"

          echo '=== live readbacks ===' >> "$RESULT"
          for url in             'https://agent402.tools/api/index/search?q=Pennsylvania%20business%20registry'             'https://402index.io/api/v1/services?q=Pennsylvania%20business%20registry&protocol=x402&limit=10'             'https://api.x402dash.com/v1/liveness?endpoint=https%3A%2F%2Fpa-entity-x402.floot.app%2F_api%2Fpa-business%3Fq%3DOpenAI%26limit%3D1'             'https://api.nohumans.directory/v1/listings/958fd262-287'             'https://true402.dev/api/v1/services/ca9c2ed8-930c-4d55-920c-f87a858bb045'
          do
            echo "--- $url ---" >> "$RESULT"
            curl -sS --max-time 30 "$url" >> "$RESULT"
            echo >> "$RESULT"
            echo >> "$RESULT"
          done

      - name: Verify and distribute $0.001 best-match SKU
        shell: bash
        run: |
          set -euo pipefail
          RESULT='x402-acquisition-results.txt'
          BASE='https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s'
          CHEAP="$BASE/api/pa-entity-one?q=OpenAI"
          FULL="$BASE/api/pa-business?q=OpenAI&limit=1"
          PAYTO='0x708f7b52b56eafd7fc1de65fc7752ed732914021'
          NAME='PA Entity Best Match x402'
          DESC='Low-friction Pennsylvania company identity lookup by business name. Returns one best-ranked legal-entity registry record with filing number, registration type, registered address, city, ZIP, and county for $0.001 USDC.'

          probe () {
            label="$1"; url="$2"; expected_amount="$3"; expected_price="$4"
            headers="$(mktemp)"; body="$(mktemp)"
            status="$(curl -sS -D "$headers" -o "$body" -w '%{http_code}' "$url")"
            echo "=== $label ===" | tee -a "$RESULT"
            echo "HTTP $status" | tee -a "$RESULT"
            grep -iE '^(payment-required|x402-price|x402-network|x402-pay-to):' "$headers" | tee -a "$RESULT" || true
            cat "$body" | tee -a "$RESULT"; echo | tee -a "$RESULT"
            test "$status" = "402"
            python3 - "$headers" "$expected_amount" "$expected_price" <<'PY' | tee -a "$RESULT"
          import sys,re,base64,json
          p,amount,price=sys.argv[1:]
          h=open(p,encoding='utf-8',errors='ignore').read()
          m=re.search(r'(?im)^payment-required:\s*([^\r\n]+)',h)
          assert m, 'missing PAYMENT-REQUIRED'
          raw=m.group(1).strip().replace('-','+').replace('_','/')
          raw += '='*((4-len(raw)%4)%4)
          doc=json.loads(base64.b64decode(raw))
          accept=doc['accepts'][0]
          assert str(accept['amount']) == amount, (accept['amount'],amount)
          assert accept['network'] == 'eip155:8453'
          assert accept['extra']['name'] == 'USD Coin', accept['extra']
          ph=re.search(r'(?im)^x402-price:\s*([^\r\n]+)',h)
          assert ph and ph.group(1).strip()==price, (ph.group(1).strip() if ph else None,price)
          print(json.dumps({'resource':doc['resource']['url'],'amount':accept['amount'],'network':accept['network'],'tokenDomain':accept['extra']},indent=2))
          PY
            rm -f "$headers" "$body"
            echo | tee -a "$RESULT"
          }

          probe 'cheap best match' "$CHEAP" '1000' '$0.001'
          probe 'existing multi-result preserved' "$FULL" '5000' '$0.005'

          echo '=== Market402 selftest ===' | tee -a "$RESULT"
          curl -sS -X POST 'https://market402.com/selftest' -H 'content-type: application/json' \
            --data "$(jq -nc --arg url "$CHEAP" '{url:$url}')" | tee /tmp/market-self.json | tee -a "$RESULT"
          echo | tee -a "$RESULT"
          jq -e '.summary.verdict=="spec_compliant"' /tmp/market-self.json >/dev/null

          set +e
          post () {
            label="$1"; url="$2"; payload="$3"
            echo "=== $label ===" | tee -a "$RESULT"
            curl -sS -w '\nHTTP_STATUS=%{http_code}\n' -X POST "$url" -H 'content-type: application/json' --data "$payload" | tee -a "$RESULT"
            echo | tee -a "$RESULT"
          }

          post 'Market402 submit cheap SKU' 'https://market402.com/submit' \
            "$(jq -nc --arg resource "$CHEAP" '{resource:$resource}')"

          post 'x402dash submit cheap SKU' 'https://api.x402dash.com/v1/register' \
            "$(jq -nc --arg url "$CHEAP" --arg name "$NAME" --arg description "$DESC" '{url:$url,name:$name,description:$description,category:"data-enrichment",tags:["pennsylvania","company-identity","legal-entity","business-registry","best-match","low-cost"]}')"

          post 'x402 Arena submit cheap SKU' 'https://core.x402arena.gg/register' \
            "$(jq -nc --arg endpoint "$CHEAP" --arg description "$DESC" --arg walletAddress "$PAYTO" '{name:"pa-entity-best-match",endpoint:$endpoint,niche:"company-enrichment",description:$description,walletAddress:$walletAddress,method:"GET",resourceType:"http",inputSchema:{type:"object",properties:{q:{type:"string",description:"Pennsylvania business name or distinctive fragment",minLength:2}},required:["q"]},outputSchema:{type:"object",properties:{query:{type:"string"},found:{type:"boolean"},match:{type:["object","null"]},source:{type:"string"},paid:{type:"boolean"}},required:["query","found","match","source","paid"]}}')"

          post 'nohumans submit cheap SKU' 'https://api.nohumans.directory/v1/listings' \
            "$(jq -nc --arg endpoint "$CHEAP" --arg description "$DESC" '{name:"PA Entity Best Match x402",description:$description,endpoint_url:$endpoint,category:"data.company",price_amount:0.001,price_currency:"USDC",chains:["base"],sample_query:$endpoint,request_schema:{type:"object",required:["q"],properties:{q:{type:"string",minLength:2,example:"OpenAI",description:"Pennsylvania business name or distinctive fragment"}}},response_schema:{type:"object",required:["query","found","match","source","paid"],properties:{query:{type:"string"},found:{type:"boolean"},match:{type:["object","null"]},source:{type:"string"},paid:{type:"boolean"}}}}')"

          post '402 Index submit cheap SKU' 'https://402index.io/api/v1/register' \
            "$(jq -nc --arg url "$CHEAP" --arg name "$NAME" --arg description "$DESC" '{url:$url,name:$name,protocol:"x402",http_method:"GET",description:$description,price_usd:0.001,payment_asset:"USDC",payment_network:"Base",category:"data/company"}')"

          post 'Cinderwright submit cheap SKU' 'https://api.ideafactorylab.org/submit' \
            "$(jq -nc --arg url "$CHEAP" --arg name "$NAME" --arg description "$DESC" '{url:$url,name:$name,description:$description,type:"x402"}')"

      - name: Commit acquisition evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add x402-acquisition-results.txt
          git commit -m 'Record x402 acquisition results' || exit 0
          git push

# x402-body-compatible
