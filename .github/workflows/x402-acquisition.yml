name: x402 acquisition batch

on:
  push:
    paths:
      - '.github/workflows/x402-acquisition.yml'

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Register with x402Scout and verify discovery
        shell: bash
        run: |
          set +e
          ENDPOINT='https://pa-entity-x402.floot.app/_api/pa-business?q=OpenAI&limit=1'
          NAME='PA Entity Lookup x402'
          DESC='Company identity and legal-entity enrichment for Pennsylvania businesses by company name. Returns filing number, registration type, registered address, city, ZIP, and county for vendor verification, due diligence, and lead enrichment.'

          echo '=== x402Scout register ==='
          curl -sS -i -X POST 'https://x402scout.com/register' \
            -H 'content-type: application/json' \
            --data "$(jq -nc --arg name "$NAME" --arg url "$ENDPOINT" --arg description "$DESC" '{name:$name,url:$url,price_usd:0.005,category:"data",description:$description,network:"base-mainnet"}')"

          echo
          echo '=== x402Scout discovery lookup ==='
          curl -sS 'https://x402scout.com/.well-known/x402-discovery' | \
            jq --arg needle 'pa-entity-x402.floot.app' '.. | objects | select((.url? // .endpoint? // .resource? // "") | contains($needle))' | head -c 16000

          echo
          echo '=== Agent402 seller search ==='
          curl -sS 'https://agent402.tools/api/services?search=Pennsylvania%20business%20registry' | head -c 14000

          echo
          echo '=== nohumans buyer-style search ==='
          curl -sS 'https://nohumans.directory/v1/discover?q=Pennsylvania%20business%20registry&limit=20' | \
            jq '.results[] | select(.endpoint_url | contains("pa-entity-x402.floot.app")) | {id,name,status,score,category,price_amount,paid_verified,evidence_tier,endpoint_url}'
