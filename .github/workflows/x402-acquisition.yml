name: x402 trust status

on:
  push:
    paths:
      - '.github/workflows/x402-acquisition.yml'

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read external buyer trust state
        shell: bash
        run: |
          set +e
          HOST='pa-entity-x402.floot.app'
          ENDPOINT='https://pa-entity-x402.floot.app/_api/pa-business?q=OpenAI&limit=1'

          echo '=== Market402 operator ==='
          curl -sS -i --max-time 20 "https://market402.com/op/$HOST"
          echo
          echo '=== Market402 badge ==='
          curl -sS -i --max-time 20 "https://market402.com/badge/$HOST"
          echo
          echo '=== Market402 operator JSON ==='
          curl -sS -i --max-time 20 "https://market402.com/op/$HOST.json"

          echo
          echo '=== nohumans ==='
          curl -sS --max-time 20 'https://api.nohumans.directory/v1/listings/958fd262-287'

          echo
          echo '=== true402 ==='
          curl -sS --max-time 20 'https://true402.dev/api/v1/services/ca9c2ed8-930c-4d55-920c-f87a858bb045'

          echo
          echo '=== x402dash ==='
          curl -sS -G --max-time 20 'https://api.x402dash.com/v1/liveness' --data-urlencode "endpoint=$ENDPOINT"

          echo
          echo '=== 402 Index search ==='
          curl -sS -G --max-time 20 'https://402index.io/api/v1/services' --data-urlencode 'q=Pennsylvania business registry' --data-urlencode 'protocol=x402' --data-urlencode 'limit=10'

          echo
          echo '=== Cinderwright status guesses ==='
          for u in             'https://api.ideafactorylab.org/submission/sub_1790757996876'             'https://api.ideafactorylab.org/status/sub_1790757996876'             'https://api.ideafactorylab.org/submissions/sub_1790757996876'
          do
            echo "-- $u"
            curl -sS -i --max-time 10 "$u"
            echo
          done
