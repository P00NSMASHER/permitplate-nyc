name: x402 acquisition diagnostics

on:
  push:
    paths:
      - '.github/workflows/x402-acquisition.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Measure buyer discovery and blocked channels
        shell: bash
        run: |
          set +e
          echo '=== Agent402 seller record ==='
          curl -sS 'https://agent402.tools/api/index?seller=pa-entity-x402.floot.app'
          echo

          for q in             'Pennsylvania business registry'             'company identity Pennsylvania'             'legal entity enrichment Pennsylvania'             'vendor verification Pennsylvania'
          do
            echo
            echo "=== Agent402 find: $q ==="
            curl -sS -G 'https://agent402.tools/api/find' --data-urlencode "q=$q"
            echo
            echo "=== Agent402 route quote: $q ==="
            curl -sS -G 'https://agent402.tools/api/route' --data-urlencode "q=$q" --data-urlencode 'include=external'
          done

          echo
          echo '=== nohumans current listing ==='
          curl -sS 'https://api.nohumans.directory/v1/listings/958fd262-287'

          echo
          echo '=== PayAPI submit-listing empty schema probe ==='
          curl -sS -i -X POST 'https://payapi.market/api/submit-listing'             -H 'content-type: application/json'             --data '{}'

          echo
          echo '=== PayAPI submit-listing partial schema probe ==='
          curl -sS -i -X POST 'https://payapi.market/api/submit-listing'             -H 'content-type: application/json'             --data '{"provider":{"name":"PA Entity Lookup x402"},"api":{"base_url":"https://pa-entity-x402.floot.app"}}'
