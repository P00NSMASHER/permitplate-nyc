name: x402 rail diagnostics

on:
  push:
    paths:
      - '.github/workflows/x402-acquisition.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect PayAI supported rails
        shell: bash
        run: |
          set +e
          echo '=== PayAI supported ==='
          curl -sS -i 'https://facilitator.payai.network/supported'
          echo
          echo '=== PayAI Bazaar current wallet ==='
          curl -sS -G 'https://facilitator.payai.network/discovery/resources'             --data-urlencode 'payTo=0x708f7b52b56eafd7fc1de65fc7752ed732914021'             --data-urlencode 'limit=100'
