name: x402 acquisition batch

on:
  push:
    paths:
      - '.github/workflows/x402-acquisition.yml'

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Expand free buyer discovery
        shell: bash
        run: |
          set +e
          ENDPOINT='https://pa-entity-x402.floot.app/_api/pa-business?q=OpenAI&limit=1'
          ORIGIN='https://pa-entity-x402.floot.app'
          NAME='PA Entity Lookup x402'
          DESC='Company identity and legal-entity enrichment for Pennsylvania businesses by company name. Returns filing number, registration type, registered address, city, ZIP, and county for vendor verification, due diligence, and lead enrichment.'

          echo '=== agent-tools.cloud pre-search ==='
          curl -sS -G 'https://agent-tools.cloud/x402' --data-urlencode 'q=pa-entity-x402.floot.app' | grep -o -m1 'pa-entity-x402[^"< ]*' || true

          echo
          echo '=== agent-tools.cloud submit with project URL contact ==='
          curl -sS -i -X POST 'https://agent-tools.cloud/api/v1/submit'             -H 'content-type: application/json'             --data "$(jq -nc               --arg url "$ENDPOINT"               --arg name "$NAME"               --arg description "$DESC"               --arg contact "$ORIGIN"               '{type:"x402",url:$url,name:$name,description:$description,contact:$contact}')"

          echo
          echo '=== agent-tools.cloud post-search ==='
          curl -sS -G 'https://agent-tools.cloud/x402' --data-urlencode 'q=pa-entity-x402.floot.app' | grep -o -m1 'pa-entity-x402[^"< ]*' || true

          echo
          echo '=== x402Scout discovery read ==='
          curl -sS -i --max-time 20 'https://x402scout.com/.well-known/x402-discovery'

          echo
          echo '=== x402Scout register candidate ==='
          curl -sS -i --max-time 25 -X POST 'https://x402scout.com/register'             -H 'content-type: application/json'             --data "$(jq -nc               --arg url "$ENDPOINT"               --arg name "$NAME"               --arg description "$DESC"               '{url:$url,name:$name,category:"Data",description:$description}')"

          echo
          echo '=== x402Scout search/readback ==='
          curl -sS -i --max-time 20 -G 'https://x402scout.com/discover'             --data-urlencode 'query=Pennsylvania business registry'
