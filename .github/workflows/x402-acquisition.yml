name: x402 buyer-surface diagnostics

on:
  push:
    paths:
      - '.github/workflows/x402-acquisition.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect buyer-side discovery surfaces
        shell: bash
        run: |
          set +e
          ORIGIN='https://pa-entity-x402.floot.app'
          ENDPOINT='https://pa-entity-x402.floot.app/_api/pa-business?q=OpenAI&limit=1'

          echo '=== Agent402 exact-domain find ==='
          curl -sS -G 'https://agent402.tools/api/find'             --data-urlencode 'q=pa-entity-x402.floot.app'             --data-urlencode 'include=external'             --data-urlencode 'top=50' | jq .

          echo
          echo '=== Agent402 buyer-intent find ==='
          curl -sS -G 'https://agent402.tools/api/find'             --data-urlencode 'q=Pennsylvania business registry company identity legal entity'             --data-urlencode 'include=external'             --data-urlencode 'top=50' | jq .

          echo
          echo '=== x402.direct newest first page ==='
          curl -sS 'https://x402.direct/api/services?sort=newest&limit=100&page=1' -o /tmp/x402direct.json
          grep -oi -m3 'pa-entity-x402[^" ]*' /tmp/x402direct.json || true
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/x402direct.json'))
          rows=x.get('services') or x.get('data') or x.get('items') or []
          hits=[r for r in rows if 'pa-entity-x402.floot.app' in json.dumps(r)]
          print(json.dumps(hits[:5],indent=2))
          PY

          echo
          echo '=== Agentic Market route discovery ==='
          curl -sS 'https://agentic.market/about' -o /tmp/agentic.html
          grep -oE '<script[^>]+src="[^"]+"' /tmp/agentic.html | head -30

          python3 - <<'PY'
          import re, urllib.request, urllib.parse
          html=open('/tmp/agentic.html',encoding='utf-8',errors='ignore').read()
          srcs=re.findall(r'<script[^>]+src="([^"]+)"',html)
          seen=set()
          for src in srcs[:50]:
              url=urllib.parse.urljoin('https://agentic.market/about',src)
              try:
                  txt=urllib.request.urlopen(url,timeout=15).read().decode('utf-8','ignore')
              except Exception:
                  continue
              hits=sorted(set(re.findall(r'[/]api[/][A-Za-z0-9_./?=&:{}-]+',txt)))
              hits=[h for h in hits if any(k in h.lower() for k in ['validate','submit','service','seller','endpoint','register'])]
              if hits:
                  print(url)
                  for h in hits[:80]:
                      if h not in seen:
                          print(' ',h); seen.add(h)
          PY
