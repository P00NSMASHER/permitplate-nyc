name: x402 trust-state diagnostics

on:
  push:
    paths:
      - '.github/workflows/x402-acquisition.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read trust and routing state
        shell: bash
        run: |
          set +e
          ORIGIN='https://pa-entity-x402.floot.app'
          ENDPOINT='https://pa-entity-x402.floot.app/_api/pa-business?q=OpenAI&limit=1'

          echo '=== Agent402 route exact origin ==='
          curl -sS -G 'https://agent402.tools/api/route'             --data-urlencode "q=$ORIGIN"             --data-urlencode 'include=external' | jq .

          echo
          echo '=== Agent402 route buyer intent ==='
          curl -sS -G 'https://agent402.tools/api/route'             --data-urlencode 'q=Pennsylvania business registry company identity legal entity enrichment'             --data-urlencode 'include=external' | jq .

          echo
          echo '=== Market402 live badge ==='
          curl -sS -i 'https://market402.com/badge/pa-entity-x402.floot.app'

          echo
          echo '=== Market402 operator json ==='
          curl -sS -i 'https://market402.com/op/pa-entity-x402.floot.app.json'

          echo
          echo '=== nohumans listing snapshot ==='
          curl -sS 'https://api.nohumans.directory/v1/listings/958fd262-287' | jq '{
            status,score,probe_count,probes_passed,consecutive_failures,last_ok_at_iso,
            last_probed_at_iso,next_check_by_iso,paid_verified,paid_verified_at,
            distinct_payers,onchain_tx_count_30d,onchain_unique_payers_30d,
            evidence_tier,evidence_note,paid_depth
          }'

          echo
          echo '=== true402 listing snapshot ==='
          curl -sS 'https://true402.dev/api/v1/services/ca9c2ed8-930c-4d55-920c-f87a858bb045' | jq .
