name: x402 acquisition batch

on:
  push:
    paths:
      - '.github/workflows/x402-acquisition.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect jaypay directory submission form
        shell: bash
        run: |
          set +e
          curl -sS 'https://402directory.com/submit' -o /tmp/submit.html
          echo '=== FORM / ACTION / API REFERENCES ==='
          grep -Ein -C 3 '<form|action=|fetch\(|/api/|submit' /tmp/submit.html | head -c 30000

          echo
          echo '=== SCRIPT SOURCES ==='
          grep -Eo '<script[^>]+src="[^"]+"' /tmp/submit.html | head -30

          echo
          echo '=== PAGE SIZE ==='
          wc -c /tmp/submit.html
