permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('permitplate-curated-policy-pr-{0}', github.event.pull_request.number) || format('permitplate-private-state-{0}', vars.PERMITPLATE_STATE_REPO) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact event source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Test actual paid product with offline fixtures
        run: node pipeline/curated-product.test.js
      - name: Verify no-send NYC internal production score boundary
        run: node pipeline/nyc-v4-internal-production-scoring.test.js
      - name: Verify private V4 workbench source links and safe exports
        run: node pipeline/nyc-v4-review-workbench.test.js
      - name: Verify independent early-source discovery remains review-only
        run: node pipeline/independent-source-review.test.js
      - name: Verify full DOB scope and conflicting building identifiers
        run: node pipeline/construction-scope-evidence.test.js
      - name: Verify NYC borough million BIN placeholders are not real conflicts
        run: node pipeline/nyc-million-bin-real-case.test.js
      - name: Verify separate full-scope DOB diagnostic does not inspect scoring holdout
        run: node pipeline/construction-validation-panel.test.js
      - name: Keep ambiguous DOB variants and quarantine only proven unused scope
        run: node pipeline/dob-source-collisions.test.js
      - name: Verify premise-root grouped construction reviewer and reserved audit separation
        run: node pipeline/construction-blind-diagnostic.test.js
      - name: Verify first-observation history across repeated scans
        run: node pipeline/independent-source-history.test.js
      - name: Reject unsupported DOB/SLA/CAMIS identity bridges
        run: node pipeline/identity-bridge-review.test.js
      - name: Verify script-free private workbench and CSV sanitation
        run: node pipeline/identity-review-workbench.test.js
      - name: Preserve stable identity triage history
        run: node pipeline/identity-triage-history.test.js
      - name: Verify legacy identity disk-proof compatibility
        run: node pipeline/identity-receipt-recovery.test.js
      - name: Verify post-refresh launch admission offline
        run: python3 -m unittest discover -s tests -p 'test_launch_refresh_sequence.py' -v
      - name: Verify workflow policy
        run: python3 -m unittest discover -s tests -p 'test_curated_workflow_policy.py' -v

  refresh-private-curated-research:
    needs: policy
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STATE_REPO: ${{ vars.PERMITPLATE_STATE_REPO }}
      PRIVATE_DIR: ${{ github.workspace }}/.private-state
    steps:
      - name: Check out exact admitted public source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Admit exact current main before private credential
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          current="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          test -n "$current" && test "$current" = "$GITHUB_SHA" || {
            echo "Stale or non-main source refused before private credentials." >&2
            exit 1
          }
      - name: Set up pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Require dedicated private durable state
        env:
          GH_TOKEN: ${{ secrets.PERMITPLATE_STATE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STATE_REPO" && test -n "${GH_TOKEN:-}"
          test "$STATE_REPO" != "$GITHUB_REPOSITORY"
          test "$(gh api "repos/$STATE_REPO" --jq '.visibility')" = "private"
      - name: Check out private state without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ vars.PERMITPLATE_STATE_REPO }}
          token: ${{ secrets.PERMITPLATE_STATE_TOKEN }}
          ref: main
          path: .private-state
          fetch-depth: 1
          persist-credentials: false
      - name: Refresh current official research in private state
        run: |
          node pipeline/run-curated-research.js \
            "$PRIVATE_DIR/state/curated-research-ledger.json" \
            "$PRIVATE_DIR/state/curated-current-graph.json"
      - name: Recheck exact public main after collection
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          current_public="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          test -n "$current_public" && test "$current_public" = "$GITHUB_SHA" || {
            echo "Public main advanced during collection. No private state commit." >&2
            exit 1
          }
      - name: Commit only private research state
        shell: bash
        run: |
          set -euo pipefail
          git -C "$PRIVATE_DIR" config user.name "PermitPlate Curated Research"
          git -C "$PRIVATE_DIR" config user.email "actions@users.noreply.github.com"
          git -C "$PRIVATE_DIR" add -- state/curated-research-ledger.json state/curated-current-graph.json state/curated-baseline-anchor.json state/nyc-v4-internal-scores.json state/nyc-v4-review-workbench-receipt.json state/nyc-v4-review-workbench.csv state/nyc-v4-review-workbench.html state/independent-source-review.json state/independent-source-history.json state/identity-bridge-review.json state/identity-triage-history.json state/identity-bridge-review.csv state/identity-bridge-review.html state/construction-validation-panel.json state/construction-validation-panel.csv state/construction-validation-summary.md state/construction-blind-reviewer.json state/construction-reserved-audit.json state/construction-blind-manifest.json research/construction-frozen-reference-v1
          if git -C "$PRIVATE_DIR" diff --cached --quiet; then
            echo "No private research changes."
            exit 0
          fi
          git -C "$PRIVATE_DIR" commit -m "state: advance curated research from verified source graph ($GITHUB_RUN_ID)"
      - name: Publish private state with scoped credentials
        env:
          GH_TOKEN: ${{ secrets.PERMITPLATE_STATE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          current_public="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          test -n "$current_public" && test "$current_public" = "$GITHUB_SHA" || {
            echo "Public main advanced before publication. Private state held." >&2
            exit 1
          }
          gh auth setup-git
          remote_head="$(git -C "$PRIVATE_DIR" ls-remote origin refs/heads/main | cut -f1)"
          current_parent="$(git -C "$PRIVATE_DIR" rev-parse HEAD^ 2>/dev/null || true)"
          if [ "$remote_head" = "$(git -C "$PRIVATE_DIR" rev-parse HEAD)" ]; then
            echo "No private state push needed."
            exit 0
          fi
          test "$remote_head" = "$current_parent" || {
            echo "Private state moved; refusing nonserial writer." >&2
            exit 1
          }
          git -C "$PRIVATE_DIR" push origin HEAD:main

