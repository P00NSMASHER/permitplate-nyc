name: PA Entity Apiosk federated endpoint trace

on:
  push:
    paths:
      - '.github/workflows/tmp-pa-entity-apiosk-endpoint-trace.yml'

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect provider-page federated link targets
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://apiosk.com/providers/' -o /tmp/providers.html
          python3 - <<'PY'
          import re, html
          s=open('/tmp/providers.html',errors='ignore').read()
          for needle in ['List your x402 API','Already speak x402','dashboard.apiosk.com','without an account','Paste your discovery URL']:
              print(f'=== {needle} ===')
              low=s.lower(); n=needle.lower(); start=0; shown=0
              while shown < 20:
                  i=low.find(n,start)
                  if i<0: break
                  frag=s[max(0,i-1500):min(len(s),i+2500)]
                  print(frag)
                  print('\n---\n')
                  start=i+len(n); shown+=1

          print('=== DASHBOARD HREFS ===')
          for m in re.finditer(r'<a\b[^>]*href=["\x27]([^"\x27]+)["\x27][^>]*>(.*?)</a>',s,re.I|re.S):
              href=m.group(1)
              text=re.sub(r'<[^>]+>',' ',m.group(2))
              text=html.unescape(re.sub(r'\s+',' ',text)).strip()
              if 'apiosk' in href.lower() or 'x402' in text.lower() or 'federat' in text.lower():
                  print(repr(href), '=>', repr(text[:300]))
          PY
