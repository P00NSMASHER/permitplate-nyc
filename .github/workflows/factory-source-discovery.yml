name: Factory live source discovery

on:
  push:
    branches:
      - x402-product-factory-bootstrap
    paths:
      - '.github/workflows/factory-source-discovery.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect live component payloads
        shell: bash
        run: |
          set -euo pipefail
          echo '=== CENSUS SUPPLIED ==='
          curl -fsSL --get 'https://api-v2.appdeploy.ai/app/us-census-address-geocoder-x402-23mj4x/api/demo'             --data-urlencode 'address=600 North Second Street, Suite 401, Harrisburg, PA 17101' | jq .
          echo '=== CENSUS REGISTRY ==='
          curl -fsSL --get 'https://api-v2.appdeploy.ai/app/us-census-address-geocoder-x402-23mj4x/api/demo'             --data-urlencode 'address=600 North Second Street, Suite 401, Harrisburg, PA, 17101' | jq .
          echo '=== RDAP ==='
          curl -fsSL --get 'https://api-v2.appdeploy.ai/app/domain-rdap-lookup-x402-spdfnq/api/demo'             --data-urlencode 'domain=openai.com' | jq .
