name: PA Entity production verification

on:
  workflow_dispatch:
    inputs:
      origin:
        description: Production origin
        required: false
        default: https://pa-entity-x402.floot.app
      register_directories:
        description: Explicitly authorize external x402scan and Agent402 registration
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: permitplate-directory-mutations
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Admit fixed origin and exact production main
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          CURRENT="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test -n "$CURRENT" && test "$CURRENT" = "$EXPECTED_SHA" || { echo "Stale or unauthorized production source." >&2; exit 1; }
      - name: Require fixed production origin
        env:
          ORIGIN: ${{ inputs.origin }}
        run: test "$ORIGIN" = 'https://pa-entity-x402.floot.app'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select October 2026 patched Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Reject unpatched Node.js runtime
        run: |
          node --version
          node -e 'const [major,minor,patch]=process.versions.node.split(".").map(Number);if(major!==22 || minor<23 || (minor===23 && patch<4)) process.exit(1)'
      - name: Verify production externally
        run: node scripts/verify-pa-entity-production.mjs "$ORIGIN"
        env:
          ORIGIN: ${{ inputs.origin }}

      - name: Require both AgentCash paid routes
        shell: bash
        env:
          ORIGIN: ${{ inputs.origin }}
        run: |
          set -euo pipefail
          npx -y @agentcash/discovery@latest discover "$ORIGIN" | tee /tmp/agentcash.txt
          grep -E '/_api/pa-business.*0\.005000.*\[x402\]' /tmp/agentcash.txt
          grep -E '/_api/pa-entity-one.*0\.001000.*\[x402\]' /tmp/agentcash.txt

  register:
    name: Explicitly approved production directory registration
    needs: verify
    if: inputs.register_directories == true && github.ref == 'refs/heads/main'
    environment: permitplate-directory-approval
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Admit fixed origin and exact production main
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          CURRENT="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test -n "$CURRENT" && test "$CURRENT" = "$EXPECTED_SHA" || { echo "Stale or unauthorized production source." >&2; exit 1; }
      - name: Require fixed production origin
        env:
          ORIGIN: ${{ inputs.origin }}
        run: test "$ORIGIN" = 'https://pa-entity-x402.floot.app'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Refresh x402scan origin
        shell: bash
        env:
          ORIGIN: ${{ inputs.origin }}
        run: |
          set -euo pipefail
          curl -fsS -X POST 'https://x402scan.com/api/x402/registry/register-origin'             -H 'content-type: application/json'             --data "$(jq -nc --arg origin "$ORIGIN" '{origin:$origin}')"             | tee /tmp/x402scan.json
          jq . /tmp/x402scan.json

      - name: Refresh Agent402 and require healthy crawl
        shell: bash
        env:
          ORIGIN: ${{ inputs.origin }}
        run: |
          set -euo pipefail
          curl -fsS -X POST 'https://agent402.tools/api/index/register'             -H 'content-type: application/json'             --data "$(jq -nc --arg origin "$ORIGIN" '{origin:$origin}')"             | tee /tmp/agent402-register.json
          jq . /tmp/agent402-register.json || cat /tmp/agent402-register.json

          SELLER=$(python3 - <<'PY'
          import os, urllib.parse
          print(urllib.parse.urlparse(os.environ['ORIGIN']).netloc)
          PY
          )

          ok=0
          for attempt in 1 2 3 4; do
            echo "Agent402 readback attempt $attempt"
            curl -fsS -G 'https://agent402.tools/api/index'               --data-urlencode "seller=$SELLER"               > /tmp/agent402-index.json
            cat /tmp/agent402-index.json
            if python3 - <<'PY'
          import json,sys
          data=json.load(open('/tmp/agent402-index.json'))
          raw=json.dumps(data).lower()
          if 'crawl_failed' in raw:
              raise SystemExit(1)

          records=[]
          def walk(x):
              if isinstance(x,dict):
                  if any(k in x for k in ('health','routable','seller','origin','route')):
                      records.append(x)
                  for v in x.values(): walk(v)
              elif isinstance(x,list):
                  for v in x: walk(v)
          walk(data)

          health_values=[]
          for r in records:
              h=r.get('health')
              if isinstance(h,(int,float)):
                  health_values.append(h)
          if health_values and max(health_values) <= 0:
              raise SystemExit(1)
          print('AGENT402_CRAWL_HEALTHY=true')
          PY
            then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
