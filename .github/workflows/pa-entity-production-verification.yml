name: PA Entity production verification

on:
  workflow_dispatch:
    inputs:
      origin:
        description: Production origin
        required: false
        default: https://pa-entity-x402.floot.app

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify production externally
        run: node scripts/verify-pa-entity-production.mjs "${{ inputs.origin }}"
