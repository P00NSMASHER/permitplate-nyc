name: PA Entity PayAPI free listing submission

on:
  push:
    paths:
      - '.github/workflows/tmp-pa-entity-payapi-form-trace.yml'

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Submit PA Entity to PayAPI Market free review
        shell: bash
        env:
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          COMMIT_JSON=$(curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GH_REPOSITORY/commits/$GH_SHA")
          CONTACT_NAME=$(printf '%s' "$COMMIT_JSON" | jq -r '.commit.author.name // .commit.committer.name // empty')
          CONTACT_EMAIL=$(printf '%s' "$COMMIT_JSON" | jq -r '.commit.author.email // .commit.committer.email // empty')

          test -n "$CONTACT_NAME"
          test -n "$CONTACT_EMAIL"

          PAYLOAD=$(jq -nc \
            --arg contact_name "$CONTACT_NAME" \
            --arg contact_email "$CONTACT_EMAIL" \
            '{
              provider:{
                name:$contact_name,
                email:$contact_email,
                company_name:"PA Entity Lookup x402",
                wallet_address:"0x708f7b52b56eafd7fc1de65fc7752ed732914021",
                solana_payto:""
              },
              api:{
                name:"PA Entity Lookup x402",
                description:"Pennsylvania business-registry entity resolution: $0.001 single best match or $0.005 enriched multi-result search with filing, creation-date, address and officer data.",
                category:"Verification",
                base_url:"https://pa-entity-x402.floot.app",
                mcp_endpoint:"",
                paid_route_url:"https://pa-entity-x402.floot.app/_api/pa-entity-one?q=OpenAI",
                paid_route_method:"GET",
                paid_route_example_body:"",
                paid_route_quote_usdc:"0.001",
                endpoints_count:"2",
                tools_count:"0",
                price_min:"0.001",
                price_max:"0.005"
              },
              tier:"free"
            }')

          HTTP=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X POST 'https://payapi.market/api/submit-listing' \
            -H 'content-type: application/json' \
            --data "$PAYLOAD")

          echo "HTTP_STATUS=$HTTP"

          python3 - <<'PY'
          import json
          p='/tmp/resp.json'
          try:
              d=json.load(open(p))
          except Exception:
              print(open(p,errors='ignore').read()[:6000])
              raise SystemExit

          SENSITIVE={'email','name'}
          def redact(x,parent=None):
              if isinstance(x,dict):
                  out={}
                  for k,v in x.items():
                      if k.lower()=='email':
                          out[k]='[redacted]'
                      elif parent=='provider' and k.lower()=='name':
                          out[k]='[redacted]'
                      else:
                          out[k]=redact(v,k)
                  return out
              if isinstance(x,list):
                  return [redact(v,parent) for v in x]
              return x
          print(json.dumps(redact(d),indent=2)[:12000])
          PY

          test "$HTTP" -ge 200
          test "$HTTP" -lt 300
