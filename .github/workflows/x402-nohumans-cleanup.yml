name: nohumans cheap listing cleanup

on:
  push:
    paths:
      - '.github/workflows/x402-nohumans-cleanup.yml'

permissions:
  actions: read
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep canonical cheap listing, add free demo, delist duplicate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          REPO='P00NSMASHER/permitplate-nyc'
          KEEP_ID='64403ef1-4ad'
          DUP_ID='5e30bb82-69c'
          DEMO='https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s/api/demo?q=OpenAI'

          fetch_log () {
            job="$1"
            curl -fsSL               -H "Authorization: Bearer $GH_TOKEN"               -H 'Accept: application/vnd.github+json'               "https://api.github.com/repos/$REPO/actions/jobs/$job/logs"
          }

          KEEP_TOKEN="$(fetch_log 109821295622 | python3 -c 'import re,sys; s=sys.stdin.read(); m=re.search(r"\"claim_token\":\"([0-9a-f]{40,})\"",s); print(m.group(1) if m else "")')"
          DUP_TOKEN="$(fetch_log 109821827674 | python3 -c 'import re,sys; s=sys.stdin.read(); vals=re.findall(r"\"claim_token\":\"([0-9a-f]{40,})\"",s); print(vals[0] if vals else "")')"

          test -n "$KEEP_TOKEN"
          test -n "$DUP_TOKEN"
          echo "::add-mask::$KEEP_TOKEN"
          echo "::add-mask::$DUP_TOKEN"

          echo '=== update canonical listing with free live demo ==='
          curl -fsSL -X PATCH             "https://api.nohumans.directory/v1/listings/$KEEP_ID"             -H 'content-type: application/json'             -H "x-claim-token: $KEEP_TOKEN"             --data "$(jq -nc --arg sample "$DEMO" '{sample_query:$sample}')"

          echo
          echo '=== delist duplicate ==='
          curl -fsSL -X DELETE             "https://api.nohumans.directory/v1/listings/$DUP_ID"             -H "x-claim-token: $DUP_TOKEN"

          echo
          echo '=== canonical readback ==='
          curl -fsSL "https://api.nohumans.directory/v1/listings/$KEEP_ID"             | jq '{id,name,status,score,probe_count,probes_passed,consecutive_failures,has_sample,sample_query,paid_verified,distinct_payers,onchain_tx_count_30d,onchain_unique_payers_30d,onchain_volume_usd_30d,next_check_by_iso}'

          echo '=== duplicate readback ==='
          curl -fsSL "https://api.nohumans.directory/v1/listings/$DUP_ID"             | jq '{id,status,delisted_reason,history_status:.status_changed_at_iso}'
