name: strengthen nohumans cheap response schema

on:
  push:
    paths:
      - '.github/workflows/x402-nohumans-schema.yml'

permissions:
  actions: read
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish field-level request and response schemas
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO='P00NSMASHER/permitplate-nyc'
          ID='64403ef1-4ad'
          TOKEN="$(curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$REPO/actions/jobs/109821295622/logs"             | python3 -c 'import re,sys; s=sys.stdin.read(); m=re.search(r"\"claim_token\":\"([0-9a-f]{40,})\"",s); print(m.group(1) if m else "")')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"

          jq -n '{
            request_schema:{
              type:"object",
              additionalProperties:false,
              required:["q"],
              properties:{
                q:{
                  type:"string",
                  minLength:2,
                  example:"OpenAI",
                  description:"Pennsylvania business name or distinctive name fragment"
                }
              }
            },
            response_schema:{
              type:"object",
              additionalProperties:false,
              required:["query","found","match","source","paid"],
              properties:{
                query:{type:"string"},
                found:{type:"boolean"},
                match:{
                  type:["object","null"],
                  additionalProperties:false,
                  properties:{
                    businessName:{type:["string","null"]},
                    filingNumber:{type:["string","null"]},
                    registrationType:{type:["string","null"]},
                    address1:{type:["string","null"]},
                    address2:{type:["string","null"]},
                    city:{type:["string","null"]},
                    state:{type:["string","null"]},
                    zip:{type:["string","null"]},
                    county:{type:["string","null"]}
                  },
                  required:["businessName","filingNumber","registrationType","address1","address2","city","state","zip","county"]
                },
                source:{type:"string"},
                paid:{type:"boolean",const:true}
              }
            }
          }' > /tmp/body.json

          curl -fsSL -X PATCH             "https://api.nohumans.directory/v1/listings/$ID"             -H 'content-type: application/json'             -H "x-claim-token: $TOKEN"             --data-binary @/tmp/body.json

          echo
          curl -fsSL "https://api.nohumans.directory/v1/listings/$ID"             | jq '{id,name,status,score,has_sample,request_schema,response_schema,paid_verified,distinct_payers}'
