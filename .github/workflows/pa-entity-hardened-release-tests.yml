name: PA Entity hardened release tests
# run endpoint and discovery regressions

on:
  push:
    paths:
      - '.github/workflows/pa-entity-hardened-release-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run hardened seller regressions
        run: npx -y tsx@latest scripts/test-pa-entity-floot-release.mts
      - name: Run discovery fixture regressions
        run: node scripts/test-pa-entity-discovery-fixtures.mjs
