name: Factory product CI

on:
  push:
    branches:
      - x402-product-factory-bootstrap
    paths:
      - 'factory/product-registry.json'
      - 'factory/MIGRATION_MANIFEST.json'
      - 'factory/products/**'
      - 'factory/packages/**'
      - 'factory/scripts/**'
      - 'factory/runtime/**'
      - '.github/workflows/factory-pa-vendor-gate-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Test Product 002 PA Vendor Intake Gate
        run: node --test factory/products/pa-vendor-gate/decision.test.js

      - name: Test Product 003 decision policy
        run: node --test factory/products/pa-vendor-identity-match/decision.test.js
      - name: Test Product 003 service composition
        run: node --test factory/products/pa-vendor-identity-match/service.test.js
      - name: Test concrete PA Census RDAP adapters
        run: node --test factory/packages/sources/appdeploy-public.test.js
      - name: Test Product 003 HTTP handler
        run: node --test factory/products/pa-vendor-identity-match/http-handler.test.js
      - name: Test shared x402 payment flow
        run: node --test factory/packages/x402/payment.test.js
      - name: Test Product 003 paid x402 handler
        run: node --test factory/products/pa-vendor-identity-match/paid-handler.test.js
      - name: Test Product 003 discovery metadata
        run: node --test factory/products/pa-vendor-identity-match/metadata.test.js
      - name: Run Product 003 release gate
        run: node factory/scripts/validate-product-003.js

      - name: Test Product 004 decision policy
        run: node --test factory/products/pa-business-address-match/decision.test.js
      - name: Test Product 004 service composition
        run: node --test factory/products/pa-business-address-match/service.test.js
      - name: Test Product 004 paid x402 handler
        run: node --test factory/products/pa-business-address-match/paid-handler.test.js
      - name: Test Product 004 discovery metadata
        run: node --test factory/products/pa-business-address-match/metadata.test.js
      - name: Run Product 004 release gate
        run: node factory/scripts/validate-product-004.js

      - name: Test Product 005 decision policy
        run: node --test factory/products/pa-business-domain-match/decision.test.js
      - name: Test Product 005 service composition
        run: node --test factory/products/pa-business-domain-match/service.test.js
      - name: Test Product 005 paid x402 handler
        run: node --test factory/products/pa-business-domain-match/paid-handler.test.js
      - name: Test Product 005 discovery metadata
        run: node --test factory/products/pa-business-domain-match/metadata.test.js
      - name: Run Product 005 release gate
        run: node factory/scripts/validate-product-005.js

      - name: Test direct SEC EDGAR adapter
        run: node --test factory/packages/sources/sec-filings.test.js
      - name: Test Product 006 freshness decision
        run: node --test factory/products/sec-filing-freshness/decision.test.js
      - name: Test Product 006 service composition
        run: node --test factory/products/sec-filing-freshness/service.test.js
      - name: Test Product 006 paid x402 handler
        run: node --test factory/products/sec-filing-freshness/paid-handler.test.js
      - name: Test Product 006 discovery metadata
        run: node --test factory/products/sec-filing-freshness/metadata.test.js
      - name: Run Product 006 release gate
        run: node factory/scripts/validate-product-006.js

      - name: Test Product 013 SEC identity decision
        run: node --test factory/products/sec-company-identity-match/decision.test.js
      - name: Test Product 013 SEC identity service
        run: node --test factory/products/sec-company-identity-match/service.test.js
      - name: Test Product 013 paid x402 handler
        run: node --test factory/products/sec-company-identity-match/paid-handler.test.js
      - name: Test Product 013 discovery metadata
        run: node --test factory/products/sec-company-identity-match/metadata.test.js
      - name: Run Product 013 release gate
        run: node factory/scripts/validate-product-013.js

      - name: Test Product 007 domain-age decision
        run: node --test factory/products/domain-registration-age/decision.test.js
      - name: Test Product 007 domain-age service
        run: node --test factory/products/domain-registration-age/service.test.js
      - name: Test Product 007 paid x402 handler
        run: node --test factory/products/domain-registration-age/paid-handler.test.js
      - name: Test Product 007 discovery metadata
        run: node --test factory/products/domain-registration-age/metadata.test.js
      - name: Run Product 007 release gate
        run: node factory/scripts/validate-product-007.js

      - name: Test Treasury Fiscal Data adapter
        run: node --test factory/packages/sources/treasury-average-rates.test.js
      - name: Test Product 008 Treasury threshold decision
        run: node --test factory/products/treasury-average-rate-threshold/decision.test.js
      - name: Test Product 008 Treasury threshold service
        run: node --test factory/products/treasury-average-rate-threshold/service.test.js
      - name: Test Product 008 paid x402 handler
        run: node --test factory/products/treasury-average-rate-threshold/paid-handler.test.js
      - name: Test Product 008 discovery metadata
        run: node --test factory/products/treasury-average-rate-threshold/metadata.test.js
      - name: Run Product 008 release gate
        run: node factory/scripts/validate-product-008.js


      - name: Test OFAC direct source adapter
        run: node --test factory/packages/sources/ofac-name-screen.test.js
      - name: Test Product 009 OFAC review decision
        run: node --test factory/products/ofac-name-review-gate/decision.test.js
      - name: Test Product 009 OFAC review service
        run: node --test factory/products/ofac-name-review-gate/service.test.js
      - name: Test Product 009 paid x402 handler
        run: node --test factory/products/ofac-name-review-gate/paid-handler.test.js
      - name: Test Product 009 discovery metadata
        run: node --test factory/products/ofac-name-review-gate/metadata.test.js

      - name: Test Product 010 formation-age decision
        run: node --test factory/products/pa-business-formation-age/decision.test.js
      - name: Test Product 010 formation-age service
        run: node --test factory/products/pa-business-formation-age/service.test.js
      - name: Test Product 010 paid x402 handler
        run: node --test factory/products/pa-business-formation-age/paid-handler.test.js
      - name: Test Product 010 discovery metadata
        run: node --test factory/products/pa-business-formation-age/metadata.test.js
      - name: Run Product 010 release gate
        run: node factory/scripts/validate-product-010.js

      - name: Test Product 011 expiration decision
        run: node --test factory/products/domain-expiration-horizon/decision.test.js
      - name: Test Product 011 expiration service
        run: node --test factory/products/domain-expiration-horizon/service.test.js
      - name: Test Product 011 paid x402 handler
        run: node --test factory/products/domain-expiration-horizon/paid-handler.test.js
      - name: Test Product 011 discovery metadata
        run: node --test factory/products/domain-expiration-horizon/metadata.test.js
      - name: Run Product 011 release gate
        run: node factory/scripts/validate-product-011.js

      - name: Validate factory product registry
        run: node factory/scripts/validate-registry.js
      - name: Validate migration manifest classification
        run: node factory/scripts/validate-migration-manifest.js
      - name: Test compiled discovery surfaces
        run: node --test factory/packages/discovery/generator.test.js
      - name: Test deterministic deployment bundle
        run: node --test factory/packages/discovery/bundle.test.js
      - name: Dry-run deployment bundle writer
        run: node factory/scripts/write-deployment-bundle.js https://candidate.example /tmp/x402-factory-bundle
      - name: Validate compiled discovery surfaces
        run: node factory/scripts/validate-discovery.js
      - name: Test factory release-bundle generator
        run: node --test factory/scripts/build-release-bundle.test.js
      - name: Build staging release bundle
        run: node factory/scripts/build-release-bundle.js /tmp/x402-factory-bundle https://candidate.example
      - name: Run Product 009 release gate
        run: node factory/scripts/validate-product-009.js
      - name: Test Product 012 last-changed decision
        run: node --test factory/products/domain-last-changed-recency/decision.test.js
      - name: Test Product 012 last-changed service
        run: node --test factory/products/domain-last-changed-recency/service.test.js
      - name: Test Product 012 paid x402 handler
        run: node --test factory/products/domain-last-changed-recency/paid-handler.test.js
      - name: Test Product 012 discovery metadata
        run: node --test factory/products/domain-last-changed-recency/metadata.test.js
      - name: Run Product 012 release gate
        run: node factory/scripts/validate-product-012.js
      - name: Test portable factory runtime composition
        run: node --test factory/runtime/create-runtime.test.js
      - name: Test deployment prerequisite preflight
        run: node --test factory/runtime/deployment-preflight.test.js
      - name: Test AppDeploy runtime bridge
        run: node --test factory/runtime/appdeploy-bridge.test.js
      - name: Enforce no nested seller-owned AppDeploy calls
        run: node --test factory/scripts/validate-no-nested-seller-calls.test.js
      - name: Test unified deploy-candidate validator
        run: node --test factory/runtime/validate-deploy-candidate.test.js
      - name: Run structural deploy-candidate preflight
        env:
          SEC_USER_AGENT: x402-product-factory-ci/1.0 ci@example.com
          PUBLIC_API_BASE: https://candidate.example
        run: node factory/runtime/validate-deploy-candidate.js
      - name: Test Product 014 Treasury change decision
        run: node --test factory/products/treasury-average-rate-change/decision.test.js
      - name: Test Product 014 Treasury change service
        run: node --test factory/products/treasury-average-rate-change/service.test.js
      - name: Test Product 014 paid x402 handler
        run: node --test factory/products/treasury-average-rate-change/paid-handler.test.js
      - name: Test Product 014 discovery metadata
        run: node --test factory/products/treasury-average-rate-change/metadata.test.js
