name: PA Entity marketplace red team

on:
  push:
    paths:
      - '.github/workflows/pa-entity-market-redteam.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Marketplace state sweep
        shell: bash
        run: |
          set +e
          echo '=== nohumans current ==='
          curl -sS -i 'https://api.nohumans.directory/v1/listings/958fd262-287' | head -c 16000
          echo
          echo '=== nohumans old id ==='
          curl -sS -i 'https://api.nohumans.directory/v1/listings/64403ef1-4ad' | head -c 16000
          echo
          echo '=== true402 ==='
          curl -sS -i 'https://true402.dev/api/v1/services/ca9c2ed8-930c-4d55-920c-f87a858bb045' | head -c 16000
          echo
          echo '=== 402 Index ==='
          curl -sS -i 'https://402index.io/api/v1/services/2a92dcd4-206a-42ad-b6e5-e457635bb75a' | head -c 16000
          echo
          echo '=== Agent402 ==='
          curl -sS -i 'https://agent402.tools/api/index?seller=pa-entity-x402.floot.app' | head -c 22000
          echo
          echo '=== Market402 ==='
          curl -sS -i 'https://market402.com/op/pa-entity-x402.floot.app.json' | head -c 16000
          echo
          echo '=== PayAI stats ==='
          ENC=$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote('https://pa-entity-x402.floot.app/_api/pa-business', safe=''))
          PY
          )
          curl -sS -i "https://facilitator.payai.network/discovery/resources/$ENC/stats" | head -c 12000
