name: PA Entity AppDeploy buyer routing

on:
  push:
    paths:
      - '.github/workflows/pa-entity-appdeploy-routing.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check buyer routing and settlement stats
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s'
          RESOURCE="$BASE/api/pa-business"

          for q in             'Pennsylvania business registry'             'company identity Pennsylvania'             'vendor verification Pennsylvania'
          do
            echo "=== Agent402 route: $q ==="
            curl -sS -G 'https://agent402.tools/api/route'               --data-urlencode "q=$q"               --data-urlencode 'include=external' | tee /tmp/route.json
            python3 - "$BASE" <<'PY'
          import json,sys
          base=sys.argv[1]
          d=json.load(open('/tmp/route.json'))
          s=json.dumps(d)
          print('PA_APPDEPLOY_PRESENT=', base in s)
          if base in s:
              def walk(x):
                  if isinstance(x,dict):
                      if base in json.dumps(x):
                          print(json.dumps(x,indent=2)[:12000])
                      for v in x.values(): walk(v)
                  elif isinstance(x,list):
                      for v in x: walk(v)
              walk(d)
          PY
          done

          echo '=== PayAI stats ==='
          ENC=$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote('https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s/api/pa-business', safe=''))
          PY
          )
          curl -sS "https://facilitator.payai.network/discovery/resources/$ENC/stats" | jq .
