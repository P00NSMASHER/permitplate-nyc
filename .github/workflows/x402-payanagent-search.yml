name: check PayanAgent ingestion

on:
  push:
    paths:
      - '.github/workflows/x402-payanagent-search.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Search public PayanAgent catalog
        shell: bash
        run: |
          set -euo pipefail
          for Q in             'Pennsylvania business entity'             'company identity Pennsylvania'             'PA Entity Best Match'             'api-v2.appdeploy.ai'
          do
            echo "=== $Q ==="
            curl -sS -G 'https://payanagent.com/api/v1/offers'               --data-urlencode "q=$Q"               --data-urlencode 'limit=50' | jq '.offers[] | {id:._id,title,description,priceUsd,buyUrl,source,externalUrl,category,tags}' || true
          done
