name: PayanAgent demand scan

on:
  push:
    paths:
      - '.github/workflows/x402-payan-readback.yml'

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Search open buyer requests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          qs=[
            'Pennsylvania',
            'business registry',
            'company identity',
            'legal entity',
            'vendor verification',
            'company enrichment',
            'filing number',
            'registered address',
            'due diligence',
            'KYB'
          ]
          for q in qs:
              url='https://payanagent.com/api/v1/requests?'+urllib.parse.urlencode({
                  'status':'open','q':q,'limit':50
              })
              print('\n===',q,'===')
              try:
                  with urllib.request.urlopen(url,timeout=30) as r:
                      raw=r.read().decode()
                      print('HTTP',r.status,'LEN',len(raw))
                  data=json.loads(raw)
                  rows=data.get('requests', data if isinstance(data,list) else [])
                  print('COUNT',len(rows))
                  for x in rows[:20]:
                      print(json.dumps(x,indent=2)[:5000])
              except Exception as e:
                  print('ERROR',repr(e))
          PY
