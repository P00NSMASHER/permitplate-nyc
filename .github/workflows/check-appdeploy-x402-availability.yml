name: Check AppDeploy x402 availability

on:
  push:
    paths:
      - 'scripts/check-appdeploy-x402-availability.mjs'
      - '.github/workflows/check-appdeploy-x402-availability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-appdeploy-x402-availability.mjs
