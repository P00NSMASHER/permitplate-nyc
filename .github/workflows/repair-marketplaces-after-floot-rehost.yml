name: Repair marketplaces after Floot rehost

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: permitplate-directory-mutations
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == 'refs/heads/main'
    environment: permitplate-directory-approval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Admit fixed origin and exact production main
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          CURRENT="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test -n "$CURRENT" && test "$CURRENT" = "$EXPECTED_SHA" || { echo "Stale or unauthorized production source." >&2; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Repair zero-spend marketplace listings
        env:
          REPORT_PATH: marketplace-post-floot-rehost.json
        run: node scripts/repair-marketplaces-after-floot-rehost.mjs

      - name: Upload repair receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: marketplace-post-floot-rehost
          path: marketplace-post-floot-rehost.json
          if-no-files-found: warn
