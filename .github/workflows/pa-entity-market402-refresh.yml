name: PA Entity marketplace repair

on:
  push:
    paths:
      - '.github/workflows/pa-entity-market402-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Refresh zero-spend vendor-gate listings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          python3 - <<'PY'
          import base64
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          GATE = (
              'https://api-v2.appdeploy.ai/app/'
              'pa-entity-lookup-x402-4fbm4s/api/vendor-intake-gate'
              '?name=OpenAI%20OpCo'
              '&address=600%20North%20Second%20Street%2C%20Suite%20401%2C%20Harrisburg%2C%20PA%2017101'
              '&domain=openai.com'
          )

          def request(url, method='GET', payload=None, timeout=30):
              body = None
              headers = {
                  'accept': 'application/json',
                  'user-agent': 'permitplate-x402-marketplace-repair/1.0',
              }
              if payload is not None:
                  body = json.dumps(payload).encode()
                  headers['content-type'] = 'application/json'
              req = urllib.request.Request(
                  url, data=body, headers=headers, method=method
              )
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as res:
                      raw = res.read().decode('utf-8', errors='replace')
                      try:
                          parsed = json.loads(raw)
                      except Exception:
                          parsed = raw
                      return {
                          'ok': True,
                          'status': res.status,
                          'url': url,
                          'headers': dict(res.headers.items()),
                          'data': parsed,
                      }
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode('utf-8', errors='replace')
                  try:
                      parsed = json.loads(raw)
                  except Exception:
                      parsed = raw
                  return {
                      'ok': False,
                      'status': exc.code,
                      'url': url,
                      'headers': dict(exc.headers.items()),
                      'data': parsed,
                      'error': str(exc),
                  }
              except Exception as exc:
                  return {
                      'ok': False,
                      'status': None,
                      'url': url,
                      'data': None,
                      'error': repr(exc),
                  }

          checked_at = datetime.now(timezone.utc).isoformat()

          # Re-submit the composed decision tool. These calls do not attach a
          # wallet/payment; they are directory registration/spec-test actions.
          market_submit = request(
              'https://market402.com/submit',
              'POST',
              {'resource': GATE, 'declared_price_usd': 0.02},
          )
          market_selftest = request(
              'https://market402.com/selftest',
              'POST',
              {'url': GATE},
          )

          index_register = request(
              'https://402index.io/api/v1/register',
              'POST',
              {
                  'url': GATE,
                  'name': 'Pennsylvania Vendor Intake Decision Gate',
                  'protocol': 'x402',
                  'http_method': 'GET',
                  'description': (
                      'Fail-closed agent-loop vendor intake decision for '
                      'Pennsylvania vendors using PA registry identity, Census '
                      'address consistency, OFAC candidate-name screening, and '
                      'authoritative RDAP domain evidence. Returns proceed or '
                      'human_review with typed evidence and explicit review triggers.'
                  ),
                  'price_usd': 0.02,
                  'payment_asset': 'USDC',
                  'payment_network': 'Base',
                  'category': 'business/vendor-verification',
                  'provider': 'P00NSMASHER',
              },
          )

          # Give the directory a brief chance to expose the registration, then
          # read public buyer-facing indexes. Absence here is informative but
          # does not make the product unhealthy.
          time.sleep(3)

          q = urllib.parse.quote('Pennsylvania Vendor Intake')
          market_search = request('https://market402.com/search.json?q=' + q)
          market_index = request('https://market402.com/index.json')
          index_search = request(
              'https://402index.io/api/v1/services?'
              + urllib.parse.urlencode({
                  'q': 'Pennsylvania Vendor Intake',
                  'protocol': 'x402',
                  'limit': 50,
              })
          )

          # Capture the live unpaid x402 challenge without paying.
          gate_probe = request(GATE)
          payment_required = None
          header_value = None
          for key, value in (gate_probe.get('headers') or {}).items():
              if key.lower() == 'payment-required':
                  header_value = value
                  break
          if header_value:
              try:
                  normalized = header_value + '=' * (-len(header_value) % 4)
                  payment_required = json.loads(
                      base64.b64decode(normalized).decode('utf-8')
                  )
              except Exception as exc:
                  payment_required = {'decode_error': repr(exc)}

          def find_matches(value, needles, path=''):
              hits = []
              if isinstance(value, dict):
                  blob = json.dumps(value, sort_keys=True).lower()
                  if any(n.lower() in blob for n in needles):
                      hits.append({'path': path or '/', 'record': value})
                  for key, child in value.items():
                      hits.extend(
                          find_matches(child, needles, path + '/' + str(key))
                      )
              elif isinstance(value, list):
                  for i, child in enumerate(value):
                      hits.extend(
                          find_matches(child, needles, path + '/' + str(i))
                      )
              return hits

          needles = [
              'vendor-intake-gate',
              'Pennsylvania Vendor Intake Decision Gate',
              'pa-entity-lookup-x402-4fbm4s',
          ]

          receipt = {
              'checked_at': checked_at,
              'mode': 'zero_spend_directory_repair',
              'target': GATE,
              'market402': {
                  'submit': market_submit,
                  'selftest': market_selftest,
                  'search': {
                      **{k: v for k, v in market_search.items() if k != 'data'},
                      'matches': find_matches(
                          market_search.get('data'), needles
                      )[:50]
                      if market_search.get('data') is not None
                      else [],
                  },
                  'index': {
                      **{k: v for k, v in market_index.items() if k != 'data'},
                      'matches': find_matches(
                          market_index.get('data'), needles
                      )[:50]
                      if market_index.get('data') is not None
                      else [],
                  },
              },
              '402index': {
                  'register': index_register,
                  'search': {
                      **{k: v for k, v in index_search.items() if k != 'data'},
                      'matches': find_matches(
                          index_search.get('data'), needles
                      )[:50]
                      if index_search.get('data') is not None
                      else [],
                  },
              },
              'live_unpaid_challenge': {
                  'http_status': gate_probe.get('status'),
                  'body': gate_probe.get('data'),
                  'payment_required': payment_required,
              },
              'accounting_note': (
                  'Directory submissions, self-tests, unpaid probes, and '
                  'registrations are not revenue and must never be counted as buyers.'
              ),
          }

          with open(
              'verification/vendor-gate-marketplace-repair-latest.json',
              'w',
              encoding='utf-8',
          ) as handle:
              json.dump(receipt, handle, indent=2, sort_keys=True)
              handle.write('\n')

          print(json.dumps({
              'checked_at': checked_at,
              'market_submit_status': market_submit.get('status'),
              'market_selftest_status': market_selftest.get('status'),
              'market_search_matches': len(
                  receipt['market402']['search']['matches']
              ),
              'market_index_matches': len(
                  receipt['market402']['index']['matches']
              ),
              'index_register_status': index_register.get('status'),
              'index_search_matches': len(
                  receipt['402index']['search']['matches']
              ),
              'gate_http_status': gate_probe.get('status'),
          }, indent=2, sort_keys=True))
          PY

      - name: Commit marketplace repair receipt
        shell: bash
        run: |
          set -euo pipefail
          RECEIPT='verification/vendor-gate-marketplace-repair-latest.json'
          cp "$RECEIPT" /tmp/vendor-gate-marketplace-repair-latest.json

          git fetch origin main
          git reset --hard origin/main
          cp /tmp/vendor-gate-marketplace-repair-latest.json "$RECEIPT"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RECEIPT"
          if git diff --cached --quiet; then
            echo 'Marketplace repair receipt unchanged.'
            exit 0
          fi
          git commit -m 'chore: refresh vendor-gate marketplace repair receipt'
          git push origin HEAD:main
