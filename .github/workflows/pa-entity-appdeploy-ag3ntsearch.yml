name: submit PA Entity AppDeploy mirror to ag3ntsearch review

on:
  push:
    paths:
      - '.github/workflows/pa-entity-appdeploy-ag3ntsearch.yml'

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit truthful signed AppDeploy contribution
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';

          const endpoint = 'https://ag3ntsearch.fullyagentnativeapps.com/api/contributions';
          const path = '/api/contributions';
          const observedAt = new Date().toISOString();
          const origin = 'https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s';
          const best = origin + '/api/pa-entity-one?q=OpenAI';

          const payload = {
            schema: 'ag3ntsearch.contribution_intent/v1',
            target_name: 'PA Entity Lookup x402 — AppDeploy mirror',
            target_url: origin,
            suggested_category: ['x402','pay-per-call','data','business-registry','company-identity'],
            reference_task: 'With only a funded Base USDC wallet and no account or API key, call GET ' + best + ', satisfy the x402 v2 challenge for 0.001 USDC, and receive one Pennsylvania Department of State business-registry result.',
            claim: 'This hardened public mirror advertises a keyless x402 v2 Base USDC best-match route priced at 0.001 USDC. Its unpaid endpoint and canonical discovery manifest are public. Agent402 currently crawls this origin successfully and ranks the best-match route first for Pennsylvania business-registry buyer intents. This is a nomination for independent re-execution, not a claim that ag3ntsearch has paid or verified it.',
            evidence: [
              {
                kind: 'http_observation',
                at: observedAt,
                source: origin + '/.well-known/x402',
                summary: 'Canonical x402 discovery is public and advertises the hardened Pennsylvania business-registry routes on Base USDC.'
              },
              {
                kind: 'http_observation',
                at: observedAt,
                source: best,
                summary: 'Unpaid GET returns an x402 v2 payment challenge for the 0.001 USDC best-match route rather than registry data.'
              },
              {
                kind: 'http_observation',
                at: observedAt,
                source: origin + '/openapi.json',
                summary: 'OpenAPI documents the best-match route, structured registry response, and account-free HTTP GET input.'
              }
            ],
            source_checked_at: observedAt,
            max_age_days: 7,
            transcript_url: 'https://github.com/P00NSMASHER/permitplate-nyc/blob/main/PA_ENTITY_LOOKUP_X402.md'
          };

          const body = JSON.stringify(payload);
          const bodyHash = crypto.createHash('sha256').update(body).digest('hex');
          const nonce = `${Date.now()}.${crypto.randomBytes(8).toString('hex')}`;
          const canonical = ['ag3nt-req:v1','POST',path,bodyHash,nonce].join('\n');

          const { publicKey, privateKey } = crypto.generateKeyPairSync('ed25519');
          const spki = publicKey.export({format:'der', type:'spki'});
          const rawPub = Buffer.from(spki).subarray(-32);
          const sig = crypto.sign(null, Buffer.from(canonical, 'utf8'), privateKey);

          const res = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'x-agent-pub': rawPub.toString('base64'),
              'x-agent-nonce': nonce,
              'x-agent-sig': sig.toString('base64')
            },
            body
          });

          const text = await res.text();
          console.log('HTTP_STATUS=' + res.status);
          console.log(text);
          if (![200,201,202].includes(res.status)) process.exitCode = 1;
          NODE
