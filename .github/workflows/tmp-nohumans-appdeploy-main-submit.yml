name: submit PA Entity AppDeploy enriched route to nohumans

on:
  push:
    paths:
      - '.github/workflows/tmp-nohumans-appdeploy-main-submit.yml'

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit enriched route without payment
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s'
          ENDPOINT="$BASE/api/pa-business?q=OpenAI&limit=1"

          curl -fsSL --max-time 25 "$BASE/openapi.json" -o /tmp/openapi.json

          RESPONSE_SCHEMA=$(jq -c '.paths["/api/pa-business"].get.responses["200"].content["application/json"].schema' /tmp/openapi.json)
          REQUEST_SCHEMA=$(jq -nc '{
            type:"object",
            additionalProperties:false,
            required:["q"],
            properties:{
              q:{type:"string",minLength:2,maxLength:120,example:"OpenAI",description:"Pennsylvania business name or distinctive name fragment"},
              limit:{type:"integer",minimum:1,maximum:25,default:10,example:1,description:"Maximum results to return"}
            }
          }')

          PAYLOAD=$(jq -nc             --arg name 'Pennsylvania Business Registry — Enriched Search x402'             --arg description 'Pennsylvania business registry and company identity search by company name. Returns ranked legal-entity records with filing number, registration type, creation date, registered address, county, and source-published principal/officer roles for vendor/customer verification, due diligence, entity resolution, and lead enrichment.'             --arg endpoint "$ENDPOINT"             --arg category 'data.company'             --argjson price 0.005             --arg sample "$ENDPOINT"             --argjson request "$REQUEST_SCHEMA"             --argjson response "$RESPONSE_SCHEMA"             '{name:$name,description:$description,endpoint_url:$endpoint,category:$category,price_amount:$price,chains:["base"],sample_query:$sample,request_schema:$request,response_schema:$response}')

          code=$(curl -sS --max-time 30 -o /tmp/out -w '%{http_code}'             -X POST 'https://api.nohumans.directory/v1/listings'             -H 'content-type: application/json'             --data "$PAYLOAD")

          echo "HTTP=$code"
          if [ "$code" = "201" ] || [ "$code" = "200" ]; then
            TOKEN=$(jq -r '.claim_token // empty' /tmp/out)
            [ -z "$TOKEN" ] || echo "::add-mask::$TOKEN"
            jq 'del(.claim_token) | {id,name,endpoint_url,status,score,price_amount,chains,paid_verified,distinct_payers,sample_query,request_schema,response_schema}' /tmp/out
          elif [ "$code" = "402" ]; then
            echo 'FREE_ALLOWANCE_EXHAUSTED=true'
            jq '{error,price,currency,network,payTo,detail,message}' /tmp/out 2>/dev/null || cat /tmp/out
            exit 0
          else
            cat /tmp/out
            exit 1
          fi
