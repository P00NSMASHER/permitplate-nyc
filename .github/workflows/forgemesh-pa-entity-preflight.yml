name: ForgeMesh PA Entity preflight

on:
  pull_request:
    paths:
      - 'verification/forgemesh-pa-entity-seller.json'
      - '.github/workflows/forgemesh-pa-entity-preflight.yml'
      - 'tests/test_forgemesh_workflow_policy.py'
  push:
    branches:
      - main
    paths:
      - 'verification/forgemesh-pa-entity-seller.json'
      - '.github/workflows/forgemesh-pa-entity-preflight.yml'
      - 'tests/test_forgemesh_workflow_policy.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forgemesh-pa-entity-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact candidate without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Reject branch-controlled writers and mutable validators
        run: python3 -m unittest discover -s tests -p 'test_forgemesh_workflow_policy.py' -v

  validate:
    needs: policy
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORGEMESH_VALIDATOR_SHA: 257348bbc78d1e8077957fba1bdb0a57dc4cf97e
    steps:
      - name: Check out exact admitted source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Admit exact current main before external code
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "ForgeMesh validation requires main."; exit 1; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "Checked-out source is not the event SHA."; exit 1; }
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test -n "$remote_main" || { echo "Unable to resolve current main."; exit 1; }
          test "$GITHUB_SHA" = "$remote_main" || { echo "Event SHA is not exact current main."; exit 1; }

      - name: Fetch immutable ForgeMesh validator
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/x402-verified
          git -C /tmp/x402-verified remote add origin https://github.com/forgemeshlabs/x402-verified.git
          git -C /tmp/x402-verified fetch --depth 1 origin "$FORGEMESH_VALIDATOR_SHA"
          test "$(git -C /tmp/x402-verified rev-parse FETCH_HEAD)" = "$FORGEMESH_VALIDATOR_SHA"
          git -C /tmp/x402-verified checkout --detach "$FORGEMESH_VALIDATOR_SHA"

      - name: Select October 2026 patched Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Reject unpatched Node.js runtime
        run: |
          node --version
          node -e 'const [major,minor,patch]=process.versions.node.split(".").map(Number);if(major!==22 || minor<23 || (minor===23 && patch<4)) process.exit(1)'

      - name: Install pinned-validator dependencies
        working-directory: /tmp/x402-verified
        run: npm ci

      - name: Validate prepared PA seller record
        shell: bash
        run: |
          set -euo pipefail
          cp verification/forgemesh-pa-entity-seller.json /tmp/x402-verified/sellers/pa-entity-lookup-x402.json
          cd /tmp/x402-verified
          node scripts/validate.js --slug pa-entity-lookup-x402 --out /tmp/forgemesh-preflight.md
          {
            echo '# ForgeMesh PA Entity preflight'
            echo
            echo "- PermitPlate source: \`$GITHUB_SHA\`"
            echo "- ForgeMesh validator: \`$FORGEMESH_VALIDATOR_SHA\`"
            echo
            cat /tmp/forgemesh-preflight.md
          } > "$GITHUB_WORKSPACE/verification/forgemesh-pa-entity-preflight-latest.md"

      - name: Retain immutable source-bound receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: forgemesh-pa-entity-preflight-${{ github.sha }}
          path: verification/forgemesh-pa-entity-preflight-latest.md
          if-no-files-found: error
          retention-days: 30
