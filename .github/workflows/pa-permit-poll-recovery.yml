name: PermitPlate PA missed provider poll recovery

# The existing intake is the ONLY Stripe reader/private-state writer. This
# workflow has no Stripe secrets, customer communications, or recurring timer.
on:
  workflow_run:
    workflows: ["PermitPlate PA independent order watchdog"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/pa-permit-poll-recovery.yml'
      - 'pipeline/pa-permit-poll-recovery.py'
      - 'tests/test_pa_permit_poll_recovery.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pa-permit-poll-recovery.yml'
      - 'pipeline/pa-permit-poll-recovery.py'
      - 'tests/test_pa_permit_poll_recovery.py'

# No PR can request a workflow dispatch or read a Stripe credential.
permissions:
  contents: read

concurrency:
  group: permitplate-pa-provider-stale-recovery
  cancel-in-progress: false

jobs:
  recovery-policy:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out immutable candidate without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Use pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prove bounded first-party poll recovery and adverse cases
        run: python -m unittest discover -s tests -p 'test_pa_permit_poll_recovery.py' -v

  recover:
    permissions:
      contents: read
      actions: write
    if: >-
      vars.PERMITPLATE_PA_ORDER_INTAKE_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out exact protected main without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Independently reject forged recovery requests and replay loops
        run: python -m unittest discover -s tests -p 'test_pa_permit_poll_recovery.py' -v

      - name: Read main and GitHub-native provider/workflow evidence
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'P00NSMASHER/permitplate-nyc'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          current="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          test -n "$current" && test "$current" = "$GITHUB_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pa-permit-watchdog.yml/runs?per_page=100" > "$RUNNER_TEMP/pa-watchdog-history.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pa-permit-intake.yml/runs?per_page=100" > "$RUNNER_TEMP/pa-intake-history.json"
          python pipeline/pa-permit-poll-recovery.py \
            --event "$GITHUB_EVENT_NAME" \
            --sha "$GITHUB_SHA" \
            --trigger "$GITHUB_EVENT_PATH" \
            --watchdogs "$RUNNER_TEMP/pa-watchdog-history.json" \
            --intakes "$RUNNER_TEMP/pa-intake-history.json"

      - name: Dispatch existing READ-ONLY provider poll once when verified missing
        if: steps.gate.outputs.recover == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          test -n "$current" && test "$current" = "$GITHUB_SHA"
          gh workflow run pa-permit-intake.yml --ref main
          echo 'Requested one existing PA read-only intake. No provider success or customer delivery claimed.' >> "$GITHUB_STEP_SUMMARY"
