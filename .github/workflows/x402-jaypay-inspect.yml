name: x402 jaypay form inspect

on:
  push:
    paths:
      - '.github/workflows/x402-jaypay-inspect.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public submit form implementation
        shell: bash
        run: |
          set +e
          OUT='x402-jaypay-inspect.txt'
          : > "$OUT"
          curl -sS 'https://402directory.com/submit' -o /tmp/page.html
          echo '=== FORM CONTEXT ===' >> "$OUT"
          grep -ioE '.{0,160}(form|submit|api/)[^<]{0,220}' /tmp/page.html | head -80 >> "$OUT" || true
          echo >> "$OUT"
          echo '=== SCRIPT SOURCES ===' >> "$OUT"
          grep -oE '<script[^>]+src="[^"]+"' /tmp/page.html | sed -E 's/.*src="([^"]+)".*/\1/' | sort -u | tee /tmp/scripts >> "$OUT"
          echo >> "$OUT"
          echo '=== API STRINGS IN CHUNKS ===' >> "$OUT"
          while read -r src; do
            [[ -z "$src" ]] && continue
            if [[ "$src" == http* ]]; then url="$src"; else url="https://402directory.com$src"; fi
            curl -sS --max-time 20 "$url" -o /tmp/chunk || continue
            hits=$(grep -oE '[/]api[/][A-Za-z0-9_./?=&:%{}-]+' /tmp/chunk | sort -u | grep -Ei 'submit|director|listing|service|api' | head -80)
            if [[ -n "$hits" ]]; then
              echo "--- $url" >> "$OUT"
              echo "$hits" >> "$OUT"
            fi
            grep -oE '.{0,160}(submit[^"]{0,80}|fetch\([^)]{0,220}|axios[^;]{0,220}).{0,160}' /tmp/chunk | grep -Ei 'submit|api' | head -40 >> "$OUT" || true
          done < /tmp/scripts

      - name: Commit inspection
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add x402-jaypay-inspect.txt
          git commit -m 'Inspect jaypay x402 directory submission form' || exit 0
          git push
