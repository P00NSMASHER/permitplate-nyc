name: PA Entity first-settlement status

on:
  push:
    paths:
      - '.github/workflows/pa-entity-first-settlement-status.yml'

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Refresh independent verifier intake
        shell: bash
        run: |
          set +e
          MAIN='https://pa-entity-x402.floot.app/_api/pa-business?q=OpenAI&limit=1'
          CHEAP='https://pa-entity-x402.floot.app/_api/pa-entity-one?q=OpenAI'

          echo '=== NOHUMANS MAIN ==='
          curl -sS 'https://api.nohumans.directory/v1/listings/958fd262-287' | jq '{
            id,name,status,score,probe_count,probes_passed,probes_failed,consecutive_failures,
            last_probed_at_iso,next_check_by_iso,paid_verified,distinct_payers,evidence_tier,
            evidence_note,onchain_tx_count_30d,onchain_unique_payers_30d,onchain_volume_usd_30d
          }'

          echo '=== NOHUMANS SECOND KNOWN LISTING ==='
          curl -sS -i 'https://api.nohumans.directory/v1/listings/9f2f7a33-cb2' | head -c 16000
          echo

          for spec in "main|$MAIN" "best-match|$CHEAP"; do
            label="${spec%%|*}"
            url="${spec#*|}"
            echo "=== MARKET402 SELFTEST $label ==="
            curl -sS -X POST 'https://market402.com/selftest'               -H 'content-type: application/json'               --data "$(jq -nc --arg resource "$url" '{resource:$resource,url:$resource}')" | tee "/tmp/self-$label.json"
            echo

            echo "=== MARKET402 SUBMIT $label ==="
            curl -sS -i -X POST 'https://market402.com/submit'               -H 'content-type: application/json'               --data "$(jq -nc --arg resource "$url" '{resource:$resource}')" | head -c 12000
            echo
          done

          echo '=== MARKET402 OPERATOR READBACK ==='
          curl -sS -i 'https://market402.com/op/pa-entity-x402.floot.app.json' | head -c 12000
          echo

          echo '=== PAYAI STATS ==='
          curl -sS 'https://facilitator.payai.network/discovery/resources/https%3A%2F%2Fpa-entity-x402.floot.app%2F_api%2Fpa-business/stats'
          echo
