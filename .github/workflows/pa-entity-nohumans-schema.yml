name: inspect PA Entity nohumans schema

on:
  push:
    paths:
      - '.github/workflows/pa-entity-nohumans-schema.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare nohumans schema to live cheap-route contract
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://pa-entity-x402.floot.app'
          curl -fsSL --max-time 20 'https://api.nohumans.directory/v1/listings/9f2f7a33-cb2' > /tmp/listing.json
          curl -fsSL --max-time 20 "$ORIGIN/openapi.json" > /tmp/openapi.json
          curl -sS --max-time 20 -D /tmp/h -o /tmp/b "$ORIGIN/_api/pa-entity-one?q=OpenAI"
          
          echo '=== NOHUMANS RESPONSE SCHEMA ==='
          jq '.response_schema' /tmp/listing.json
          echo '=== LIVE OPENAPI SUCCESS SCHEMA ==='
          jq '.paths["/_api/pa-entity-one"].get.responses["200"].content["application/json"] | {example,schema}' /tmp/openapi.json
          echo '=== LIVE CHALLENGE EXAMPLE ==='
          python3 - <<'PY'
          import base64,json,re
          h=open('/tmp/h').read()
          b=json.load(open('/tmp/b'))
          m=re.search(r'(?im)^payment-required:\s*(\S+)',h)
          if not m:
              raise SystemExit('missing PAYMENT-REQUIRED')
          raw=m.group(1).replace('-','+').replace('_','/')
          raw += '='*((4-len(raw)%4)%4)
          d=json.loads(base64.b64decode(raw))
          print(json.dumps({
            'status_body_keys': sorted(b.keys()),
            'resource': d.get('resource'),
            'bazaar_example': (((d.get('extensions') or {}).get('bazaar') or {}).get('info') or {}).get('output',{}).get('example')
          },indent=2))
          PY
