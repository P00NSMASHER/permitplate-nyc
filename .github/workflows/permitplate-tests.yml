name: PermitPlate deterministic regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify bounded x402 directory receipts (offline)
        run: python3 -m unittest discover -s tests -p 'test_pa_entity_directory_bounding.py'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify public deployment boundary
        run: node build-site.test.js

      - name: Verify GitHub Pages checkout and conversion constraints
        run: node pipeline/public-conversion.test.js

      - name: Verify retired legacy offers stay denylisted
        run: node operations/legacy-offer-retirement.test.js

      - name: Run model regression
        run: node model-v7.test.js

      - name: Run delivery verifier regression
        run: node operations/delivery-verifier.test.js

      - name: Run source observation regression
        run: node operations/socrata-observer.test.js

      - name: Run NYC source adapter regression
        run: node pipeline/source-adapters.test.js

      - name: Verify review-only unlinked DOB and SLA research
        run: node pipeline/independent-source-review.test.js

      - name: Verify complete official DOB scope and property-identity checks
        run: node pipeline/construction-scope-evidence.test.js

      - name: Verify official NYC million-BIN placeholder treatment
        run: node pipeline/nyc-million-bin-real-case.test.js

      - name: Verify independent source-rich DOB validation without calibration reuse
        run: node pipeline/construction-validation-panel.test.js

      - name: Verify separate blind construction scope review and reserved audit partition
        run: node pipeline/construction-blind-diagnostic.test.js

      - name: Verify persistent early-source history and dedupe
        run: node pipeline/independent-source-history.test.js

      - name: Verify conservative source identity review
        run: node pipeline/identity-bridge-review.test.js

      - name: Verify private identity CSV and HTML workbench safety
        run: node pipeline/identity-review-workbench.test.js

      - name: Verify stable identity triage history and fail-closed migration
        run: node pipeline/identity-triage-history.test.js

      - name: Verify legacy private identity receipt readback and strict recovery
        run: node pipeline/identity-receipt-recovery.test.js

      - name: Verify conservative cross-source identity review
        run: node pipeline/identity-bridge-review.test.js

      - name: Run ProjectSignal corroboration regression
        run: node pipeline/project-signal.test.js

      - name: Run end-to-end engine regression
        run: node pipeline/engine.test.js

      - name: Run Socrata reader regression
        run: node pipeline/socrata-reader.test.js

      - name: Run candidate graph regression
        run: node pipeline/candidate-builder.test.js

      - name: Run graph-bound subscriber delivery canary
        run: node pipeline/delivery-plan.test.js

      - name: Run persistent detection ledger regression
        run: node pipeline/detection-ledger.test.js

      - name: Run detection-to-delivery candidate package canary
        run: node pipeline/candidate-package.test.js

      - name: Run persistent opportunity ledger regression
        run: node pipeline/opportunity-ledger.test.js

      - name: Verify private operational state boundary
        run: node pipeline/private-state-boundary.test.js

      - name: Run subscriber profile contract regression
        run: node pipeline/subscriber-profile.test.js

      - name: Run subscriber artifact no-send regression
        run: node pipeline/subscriber-artifact.test.js

      - name: Run Stripe subscriber adapter regression
        run: node pipeline/stripe-subscriber.test.js

      - name: Run private first-subscriber intake regression
        run: node pipeline/run-subscriber-intake.test.js


      - name: Run private sheet mapping regression
        run: node pipeline/private-sheet-mapping.test.js

      - name: Run customer digest renderer regression
        run: node pipeline/customer-message.test.js

      - name: Run explicit transport authorization regression
        run: node pipeline/transport-authorization.test.js

      - name: Run provider reconciliation regression
        run: node pipeline/provider-reconciliation.test.js

      - name: Verify real Pennsylvania source cases without inventing a customer or permit approval
        run: node pipeline/pa-real-official-evidence.test.js

      - name: Verify PA Permit Pack payment intake, source review, delivery and dedupe
        run: node pipeline/pa-permit-orders.test.js
      - name: Verify payment/refund/dispute clearance before PA private reports
        run: node pipeline/pa-permit-financial-readback.test.js
      - name: Verify PA private case operator transaction and no-clobber publication
        run: node pipeline/pa-permit-case-transaction.test.js
      - name: Verify PA private operations health and provider readback reliability
        run: node pipeline/pa-permit-health.test.js

      - name: Verify independent PA heartbeat watchdog and private output
        run: node pipeline/pa-permit-watchdog.test.js

      - name: Enforce PA watchdog main-only read and no-send policy
        run: python3 -m unittest discover -s tests -p 'test_pa_permit_watchdog_policy.py' -v

      - name: Enforce PA private order workflow credential and no-send boundaries
        run: python3 -m unittest discover -s tests -p 'test_pa_permit_intake_policy.py' -v

      - name: Verify private Stripe intake heartbeat is not treated as commercial proof
        run: node pipeline/stripe-intake-readiness.test.js

      - name: Run launch readiness controller regression
        run: node pipeline/launch-readiness.test.js

      - name: Run founder-curated paid offer regression
        run: node pipeline/founder-curated-offer.test.js

      - name: Verify private curated product acceptance gates
        run: node pipeline/curated-production-readiness.test.js

      - name: Verify real curated research and subscriber fulfillment
        run: node pipeline/curated-product.test.js
      - name: Verify Stripe-only private paid subscriber onboarding
        run: node pipeline/curated-stripe-onboarding.test.js

      - name: Verify opt-in Stripe credential policy
        run: python3 -m unittest discover -s tests -p 'test_stripe_onboarding_policy.py' -v


      - name: Verify private material-event customer delivery
        run: node pipeline/curated-material-events.test.js

      - name: Verify category-source evidence for paid leads
        run: node pipeline/category-evidence.test.js

      - name: Verify private curated research workflow policy
        run: python3 -m unittest discover -s tests -p 'test_curated_workflow_policy.py' -v

      - name: Run commercial fit receipt regression
        run: node pipeline/commercial-fit.test.js

      - name: Run versioned scoring and receipt regression
        run: node pipeline/scoring.test.js

      - name: Run current-evidence shadow scoring regression
        run: node pipeline/shadow-scoring-v3.test.js

      - name: Run adversarial scoring invariants
        run: node pipeline/scoring-invariants.test.js

      - name: Run 47-case historical shadow scoring replay
        run: node pipeline/historical-shadow-score-benchmark.test.js

      - name: Run controlled scoring promotion policy regression
        run: node pipeline/scoring-policy.test.js
