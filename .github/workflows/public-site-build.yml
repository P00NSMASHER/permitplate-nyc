name: PermitPlate GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build-site.js'
      - 'build-site.test.js'
      - '404.html'
      - 'apple-touch-icon.png'
      - 'case-study.html'
      - 'case-study.css'
      - 'case-study.js'
      - 'samples/**'
      - 'favicon.svg'
      - 'field-notes.html'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'methodology.html'
      - 'og-card.png'
      - 'permit-pack.html'
      - 'privacy.html'
      - 'refunds.html'
      - 'release-manifest.json'
      - 'robots.txt'
      - 'sample.html'
      - 'site.css'
      - 'site.js'
      - 'trial.html'
      - 'trial-request.js'
      - 'start.html'
      - 'sitemap.xml'
      - 'terms.html'
      - 'welcome.html'
      - 'assets/**'
      - '.github/workflows/public-site-build.yml'

permissions:
  contents: read

concurrency:
  group: permitplate-github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Admit only the exact current main commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          CURRENT="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test -n "$CURRENT" && test "$CURRENT" = "$EXPECTED_SHA" || { echo "Ref refused: current main has moved." >&2; exit 1; }
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'

      - name: Enforce October 2026 patched Node.js baseline
        run: |
          node --version
          node -e 'const [major,minor,patch]=process.versions.node.split(".").map(Number);if(major!==22 || minor<23 || (minor===23 && patch<4)) process.exit(1)'

      - name: Verify public deployment boundary
        run: node build-site.test.js

      - name: Build exact public artifact
        run: node build-site.js
        env:
          COMMIT_REF: ${{ github.sha }}
          CONTEXT: github-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist/

      - name: Recheck exact main immediately before publication
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CURRENT="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test -n "$CURRENT" && test "$CURRENT" = "$EXPECTED_SHA" || { echo "Main advanced: do not deploy stale source." >&2; exit 1; }
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

      - name: Verify live commit and artifact fingerprint
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          expected="dist/build-info.json"
          rm -f live-build-info.json
          for attempt in {1..12}; do
            if curl -fsSL "${PAGE_URL%/}/build-info.json?commit=${EXPECTED_COMMIT}&attempt=${attempt}" -o live-build-info.tmp; then
              if EXPECTED_COMMIT="${EXPECTED_COMMIT}" node - <<'NODE'
          const fs=require('fs');
          const expected=JSON.parse(fs.readFileSync('dist/build-info.json','utf8'));
          const live=JSON.parse(fs.readFileSync('live-build-info.tmp','utf8'));
          if(live.sourceCommit!==process.env.EXPECTED_COMMIT) process.exit(1);
          if(live.sourceCommit!==expected.sourceCommit) process.exit(1);
          if(live.publicSourceFingerprint!==expected.publicSourceFingerprint) process.exit(1);
          NODE
              then
                mv live-build-info.tmp live-build-info.json
                exit 0
              fi
            fi
            sleep 5
          done
          echo "GitHub Pages live build identity did not match the deployed artifact." >&2
          exit 1

      - name: Retain live deployment identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: permitplate-github-pages-identity-${{ github.sha }}
          path: |
            dist/build-info.json
            live-build-info.json
          if-no-files-found: warn
          retention-days: 30
