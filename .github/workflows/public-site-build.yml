name: PermitPlate public site build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build-site.js'
      - 'build-site.test.js'
      - 'netlify.toml'
      - '404.html'
      - '_headers'
      - '_redirects'
      - 'apple-touch-icon.png'
      - 'favicon.svg'
      - 'index.html'
      - 'manifest.webmanifest'
      - 'methodology.html'
      - 'og-card.png'
      - 'privacy.html'
      - 'refunds.html'
      - 'release-manifest.json'
      - 'robots.txt'
      - 'sample.html'
      - 'site.css'
      - 'site.js'
      - 'sitemap.xml'
      - 'terms.html'
      - '.github/workflows/public-site-build.yml'

permissions:
  contents: read

jobs:
  public-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify deployment boundary
        run: node build-site.test.js

      - name: Build public site
        run: node build-site.js
        env:
          COMMIT_REF: ${{ github.sha }}
          CONTEXT: production-candidate

      - name: Upload deploy-ready public site
        uses: actions/upload-artifact@v4
        with:
          name: permitplate-public-site-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
