name: PA Entity red team

on:
  push:
    paths:
      - '.github/workflows/pa-entity-red-team.yml'

jobs:
  bypass:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Payment bypass and accidental free-route probes
        shell: bash
        run: |
          set +e
          ORIGIN='https://pa-entity-x402.floot.app'
          E="$ORIGIN/_api/pa-business"

          probe () {
            echo "=== $1 ==="; shift
            curl -sS --max-time 10 -D /tmp/h -o /tmp/b -w 'status=%{http_code} time=%{time_total} bytes=%{size_download}\n' "$@" || true
            grep -Ei '^(content-type|payment-required|payment-response|x402-settled|x-floot-status|location|cache-control):' /tmp/h || true
            head -c 600 /tmp/b; echo; echo
          }

          probe 'possible demo route' "$ORIGIN/_api/demo?q=OpenAI"
          probe 'possible single-match route' "$ORIGIN/_api/pa-entity-one?q=OpenAI"
          probe 'legacy API route' "$ORIGIN/api/pa-business?q=OpenAI&limit=1"
          probe 'trailing slash' "$E/?q=OpenAI&limit=1"
          probe 'paid=true query spoof' "$E?q=OpenAI&limit=1&paid=true"
          probe 'settled query spoof' "$E?q=OpenAI&limit=1&x402-settled=true"
          probe 'settled header spoof' -H 'x402-settled: true' "$E?q=OpenAI&limit=1"
          probe 'payment response spoof' -H 'PAYMENT-RESPONSE: eyJzdWNjZXNzIjp0cnVlfQ==' "$E?q=OpenAI&limit=1"
          probe 'authorization spoof' -H 'Authorization: Bearer paid' "$E?q=OpenAI&limit=1"
          probe 'method override spoof' -X POST -H 'X-HTTP-Method-Override: GET' "$E?q=OpenAI&limit=1"
          probe 'HEAD request' -I "$E?q=OpenAI&limit=1"
          probe 'internal floot status spoof' -H 'x-floot-status: 200' "$E?q=OpenAI&limit=1"
          probe 'range request' -H 'Range: bytes=0-99' "$E?q=OpenAI&limit=1"
          probe 'security.txt' "$ORIGIN/.well-known/security.txt"
