name: Test Floot rehost endpoints

on:
  push:
    paths:
      - 'docs/pa-entity-floot-release/*_GET.ts'
      - 'docs/pa-entity-floot-release/*_GET.schema.ts'
      - 'scripts/test-floot-rehost-raw-endpoints.mts'
      - 'scripts/test-floot-vendor-gate-release.mts'
      - 'scripts/test-floot-vendor-gate-demo-wrapper.mjs'
      - 'docs/pa-entity-floot-recovery/**'
      - 'recovery/floot-target-manifest.json'
      - 'recovery/x402-portfolio-target.json'
      - 'scripts/validate-floot-recovery-bundle.mjs'
      - 'scripts/test-floot-recovery-discovery.mjs'
      - 'scripts/verify-pa-entity-floot-patches.mjs'
      - 'scripts/test-floot-release-payment-invariants.mjs'
      - 'scripts/postdeploy-floot-x402.mjs'
      - 'scripts/test-postdeploy-floot-guard.mjs'
      - '.github/workflows/postdeploy-floot-x402.yml'
      - '.github/workflows/test-floot-rehost-endpoints.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Floot raw rehost endpoint tests
        run: npx -y tsx scripts/test-floot-rehost-raw-endpoints.mts

      - name: Run Floot vendor gate paid-flow tests
        run: npx -y tsx scripts/test-floot-vendor-gate-release.mts

      - name: Verify bounded free reviewer wrapper
        run: node scripts/test-floot-vendor-gate-demo-wrapper.mjs

      - name: Validate eight-resource recovery discovery bundle
        run: node scripts/validate-floot-recovery-bundle.mjs

      - name: Verify recovery discovery documents
        run: node scripts/test-floot-recovery-discovery.mjs

      - name: Verify atomic Floot patches match tested release files
        run: node scripts/verify-pa-entity-floot-patches.mjs

      - name: Verify payment-safety invariants across all paid routes
        run: node scripts/test-floot-release-payment-invariants.mjs

      - name: Verify post-deploy zero-spend guard
        run: node scripts/test-postdeploy-floot-guard.mjs

      - name: Publish success commit status
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='x402/floot-release' \
            -f description='Floot 8-route release bundle passed'

      - name: Publish failure commit status
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='x402/floot-release' \
            -f description='Floot 8-route release bundle failed'
