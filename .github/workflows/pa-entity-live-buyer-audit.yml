name: PA Entity live buyer audit

on:
  push:
    paths:
      - '.github/workflows/pa-entity-live-buyer-audit.yml'

jobs:
  routing:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Audit cheap-route discovery and buyer routing
        shell: bash
        run: |
          set +e

          echo '=== NOHUMANS FLOOT CHEAP LISTING ==='
          curl -sS -i 'https://nohumans.directory/v1/listings/9f2f7a33-cb2' | head -c 16000
          echo

          echo '=== NOHUMANS APPDEPLOY CHEAP LISTING ==='
          curl -sS -i 'https://nohumans.directory/v1/listings/64403ef1-4ad' | head -c 16000
          echo

          echo '=== AGENT402 ROUTING RETRIES ==='
          for q in             'Pennsylvania business registry'             'Pennsylvania business registry filing number'             'Pennsylvania company identity lookup'             'Pennsylvania legal entity lookup'             'resolve Pennsylvania company name'
          do
            echo "--- QUERY: $q"
            for attempt in 1 2 3 4; do
              body=$(curl -sS --get 'https://agent402.tools/api/route'                 --data-urlencode "q=$q"                 --data-urlencode 'include=external')
              echo "$body" | head -c 24000
              echo
              if ! echo "$body" | grep -q '"server is busy"'; then break; fi
              sleep 2
            done
          done

          echo '=== 402 INDEX CHEAP SEARCH ==='
          for q in             'Pennsylvania business registry'             'Pennsylvania company identity'             'Pennsylvania legal entity'
          do
            echo "--- QUERY: $q"
            curl -sS --get 'https://www.402index.io/api/search'               --data-urlencode "q=$q"               --data-urlencode 'limit=20' | head -c 20000
            echo
          done
