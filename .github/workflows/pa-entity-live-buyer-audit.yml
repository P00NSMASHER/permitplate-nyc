name: PA Entity live buyer audit

on:
  push:
    paths:
      - '.github/workflows/pa-entity-live-buyer-audit.yml'

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Finish best-match marketplace coverage
        shell: bash
        run: |
          set +e
          BEST='https://pa-entity-x402.floot.app/_api/pa-entity-one?q=OpenAI'

          echo '=== MARKET402 SUBMIT CORRECTED ==='
          curl -sS -i -X POST 'https://market402.com/submit'             -H 'content-type: application/json'             --data "$(jq -nc --arg resource "$BEST" '{resource:$resource}')" | head -c 14000

          echo
          echo '=== NOHUMANS BEST LISTING ==='
          curl -sS 'https://nohumans.directory/v1/listings/9f2f7a33-cb2' | jq .

          echo
          echo '=== 402 INDEX BEST READBACK ==='
          curl -sS 'https://402index.io/api/v1/services/07c46db0-c899-4475-8a1b-2a789021eeff' | jq .
