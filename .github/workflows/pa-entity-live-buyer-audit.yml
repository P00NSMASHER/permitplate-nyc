name: PA Entity live buyer audit

on:
  push:
    paths:
      - '.github/workflows/pa-entity-live-buyer-audit.yml'

jobs:
  vet402:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check vet402 independent measurement
        shell: bash
        run: |
          set -euo pipefail

          check_url () {
            label="$1"
            target="$2"
            echo "=== RESOLVE $label ==="
            curl -sS --get 'https://vet402.com/api/v1/resolve'               --data-urlencode "q=$target" | tee "/tmp/$label.json"
            echo

            RID=$(python3 - "$label" <<'PY'
          import json,sys
          p='/tmp/'+sys.argv[1]+'.json'
          d=json.load(open(p))
          r=d.get('resource') or {}
          print(r.get('resource_id') or '')
          PY
            )

            OID=$(python3 - "$label" <<'PY'
          import json,sys
          p='/tmp/'+sys.argv[1]+'.json'
          d=json.load(open(p))
          r=d.get('resource') or {}
          print(r.get('observatory_id') or '')
          PY
            )

            echo "RESOURCE_ID=$RID OBSERVATORY_ID=$OID"

            if [ -n "$RID" ]; then
              echo "--- DECISION $label"
              curl -sS "https://vet402.com/api/v1/resources/$RID/decision?role=payer&amount_usd=0.01&max_per_tx_usd=0.01" | tee "/tmp/$label-decision.json"
              echo
              echo "--- RESOURCE $label"
              curl -sS "https://vet402.com/api/v1/resources/$RID"
              echo
            fi

            if [ -n "$OID" ]; then
              echo "--- PURCHASES $label"
              curl -sS "https://vet402.com/api/v1/observatory/endpoints/$OID/purchases"
              echo
            fi
          }

          check_url flootcheap 'https://pa-entity-x402.floot.app/_api/pa-entity-one?q=OpenAI'
          check_url flootmain 'https://pa-entity-x402.floot.app/_api/pa-business?q=OpenAI&limit=1'
          check_url appdeploycheap 'https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s/api/pa-entity-one?q=OpenAI'
