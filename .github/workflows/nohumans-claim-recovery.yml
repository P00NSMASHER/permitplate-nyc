name: Recover nohumans claim token

on:
  push:
    paths:
      - '.github/workflows/nohumans-claim-recovery.yml'

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read claim recovery instructions
        shell: bash
        run: |
          set -e
          curl -sS -i 'https://api.nohumans.directory/v1/listings/958fd262-287/claim'
