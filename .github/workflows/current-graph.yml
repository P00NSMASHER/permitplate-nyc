name: PermitPlate current graph replay

on:
  workflow_dispatch:
  schedule:
    - cron: '37 11 * * *'
  push:
    branches:
      - main
    paths:
      - 'pipeline/**'
      - 'model-v7.js'
      - '.github/workflows/current-graph.yml'

concurrency:
  group: permitplate-evidence-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  current-graph:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'

      - name: Build current evidence graph
        run: node pipeline/run-current-graph.js current-graph-result.json

      - name: Retain current graph artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: permitplate-current-graph-${{ github.sha }}-${{ github.run_id }}
          path: current-graph-result.json
          if-no-files-found: warn
          retention-days: 30
