name: Verify x402 portfolio

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Zero-spend buyer-style verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify unpaid x402 challenges
        run: node scripts/verify-x402-portfolio.mjs
