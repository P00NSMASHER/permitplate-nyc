name: Verify x402 portfolio

on:
  workflow_dispatch:
    inputs:
      expected_floot_resources:
        description: Expected resource count in pa-entity-x402.floot.app/.well-known/x402
        required: true
        default: '2'
  push:
    paths:
      - '.github/workflows/verify-x402-portfolio.yml'

permissions:
  contents: read

jobs:
  verify:
    name: Zero-spend buyer-style verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify host-independent rehost core
        run: node scripts/test-x402-rehost-core.mjs

      - name: Verify host-independent vendor gate decision core
        run: node scripts/test-vendor-intake-gate-core.mjs

      - name: Verify unpaid x402 challenges, decision fixtures, and directory observations
        env:
          EXPECTED_FLOOT_RESOURCES: ${{ inputs.expected_floot_resources || '2' }}
          REPORT_PATH: x402-verification-report.json
        run: node scripts/verify-x402-portfolio.mjs

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x402-verification-report
          path: x402-verification-report.json
          if-no-files-found: warn
