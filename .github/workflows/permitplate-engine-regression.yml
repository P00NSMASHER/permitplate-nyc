name: PermitPlate engine regression

on:
  push:
    branches:
      - portfolio/project-signal-foundation
  pull_request:
    paths:
      - "engine/**"
      - "docs/PROJECT_SIGNAL_FOUNDATION.md"
      - "docs/DETERMINISTIC_FALLBACK_SNAPSHOT.md"
      - ".github/workflows/permitplate-engine-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check
        run: |
          node --check engine/corroboration.js
          node --check engine/subscriber_feed.js
          node --check engine/production_policy.js

      - name: Run engine tests
        run: node --test engine/*.test.js
