name: PA Entity Market402 paid probe opt-in

on:
  push:
    paths:
      - '.github/workflows/pa-entity-market402-optin.yml'

jobs:
  optin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Opt in PA Entity routes to Market402 paid probes
        shell: bash
        run: |
          set -euo pipefail
          submit () {
            label="$1"
            resource="$2"
            query_json="$3"
            echo "=== OPT IN $label ==="
            payload=$(jq -nc               --arg resource "$resource"               --argjson query "$query_json"               '{resource:$resource,paid_probe_optin:true,max_probe_usd:0.01,sample_input:{method:"GET",queryParams:$query}}')
            echo "$payload" | jq .
            curl -sS -i -X POST 'https://market402.com/submit'               -H 'content-type: application/json'               --data "$payload" | tee "/tmp/$label.txt"
            echo
          }

          submit main             'https://pa-entity-x402.floot.app/_api/pa-business?q=OpenAI&limit=1'             '{"q":"OpenAI","limit":1}'

          submit cheap             'https://pa-entity-x402.floot.app/_api/pa-entity-one?q=OpenAI'             '{"q":"OpenAI"}'

          echo '=== OPTIN ROSTER MATCHES ==='
          curl -sS 'https://market402.com/optin.json' |             jq '[.optin[] | select(.resource|contains("pa-entity-x402.floot.app"))]'
