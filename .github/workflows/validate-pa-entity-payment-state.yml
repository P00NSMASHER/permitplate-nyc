name: validate consolidated PA Entity payment state

on:
  push:
    paths:
      - '.github/workflows/validate-pa-entity-payment-state.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Run consolidated payment-state tests
        run: node --test tests/pa-entity-payment-state.test.mjs
