name: inspect PA Entity nohumans claim flow

on:
  push:
    paths:
      - '.github/workflows/pa-entity-nohumans-claim-inspect.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read claim instructions
        shell: bash
        run: |
          set -euo pipefail
          for id in 64403ef1-4ad 958fd262-287 9f2f7a33-cb2; do
            echo "=== $id ==="
            curl -sS -i "https://api.nohumans.directory/v1/listings/$id/claim" | head -c 16000
            echo
          done
