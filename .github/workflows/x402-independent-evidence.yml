name: x402 buyer status

on:
  push:
    paths:
      - '.github/workflows/x402-independent-evidence.yml'

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read buyer-verification gates
        shell: bash
        run: |
          set +e

          echo '=== nohumans ==='
          curl -sS --max-time 20 'https://api.nohumans.directory/v1/listings/958fd262-287'             | jq '{status,score,probe_count,probes_passed,consecutive_failures,last_ok_at_iso,last_probed_at_iso,next_check_by_iso,paid_verified,distinct_payers,onchain_tx_count_30d,onchain_unique_payers_30d,evidence_tier,evidence_note}'

          echo
          echo '=== Market402 ==='
          curl -sS --max-time 20 'https://market402.com/op/pa-entity-x402.floot.app.json'
          echo
          curl -sS --max-time 20 'https://market402.com/badge/pa-entity-x402.floot.app'

          echo
          echo '=== true402 ==='
          curl -sS --max-time 20 'https://true402.dev/api/v1/services/ca9c2ed8-930c-4d55-920c-f87a858bb045'             | jq '{reputation}'

          echo
          echo '=== x402 Arena ==='
          curl -sS --max-time 20 'https://core.x402arena.gg/agents'             | jq '.agents[]? | select(.agentId=="pa-entity-lookup")'
          curl -sS --max-time 20 'https://core.x402arena.gg/leaderboard'             | jq '.leaderboard[]? | select(.agentId=="pa-entity-lookup")'
