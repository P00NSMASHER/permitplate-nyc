name: PA Entity directory status
# refresh-marker: vendor-gate-readonly-snapshot-2026-10-02

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pa-entity-directory-status.yml'
      - 'tests/test_pa_entity_directory_status_workflow_policy.py'
  pull_request:
    paths:
      - '.github/workflows/pa-entity-directory-status.yml'
      - 'tests/test_pa_entity_directory_status_workflow_policy.py'
  workflow_dispatch:

permissions: {}

# Only one latest-receipt writer may commit to main at a time.
concurrency:
  group: pa-entity-directory-status-main
  cancel-in-progress: false

jobs:
  policy:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out exact candidate without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Reject stale-main and persisted-credential writers
        run: python3 -m unittest discover -s tests -p 'test_pa_entity_directory_status_workflow_policy.py' -v

  check:
    needs: policy
    # Never write a branch-triggered or branch-dispatched snapshot onto main.
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out exact admitted main source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Admit exact current main before external collection
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main' || { echo 'Directory status requires main.'; exit 1; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo 'Checked-out source is not the event SHA.'; exit 1; }
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test -n "$remote_main" || { echo 'Unable to resolve current main.'; exit 1; }
          test "$GITHUB_SHA" = "$remote_main" || { echo 'Event SHA is not exact current main.'; exit 1; }

      - name: Capture zero-spend directory snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          python3 - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from scripts.pa_entity_directory_bounding import (
              MAX_RESPONSE_BYTES,
              OversizedDirectoryResponse,
              assert_snapshot_size,
              find_matching_dicts,
              load_bounded_json,
          )

          APP = 'https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s'
          FLOOT = 'https://pa-entity-x402.floot.app'
          VENDOR = APP + '/api/vendor-intake-gate'
          MAIN = FLOOT + '/_api/pa-business'
          CHEAP = FLOOT + '/_api/pa-entity-one'
          PAYTO = '0x708f7b52b56eafd7fc1de65fc7752ed732914021'
          USDC = '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'

          def fetch_json(url, timeout=25):
              req = urllib.request.Request(
                  url,
                  headers={
                      'accept': 'application/json',
                      'user-agent': 'permitplate-x402-readonly-verifier/1.0',
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as res:
                      try:
                          data = load_bounded_json(res)
                      except OversizedDirectoryResponse:
                          # Source is unverified, NOT a verified negative match.
                          return {
                              'ok': False,
                              'status': res.status,
                              'url': url,
                              'error': 'response_too_large',
                              'response_byte_limit': MAX_RESPONSE_BYTES,
                          }
                      return {
                          'ok': True,
                          'status': res.status,
                          'url': url,
                          'data': data,
                      }
              except Exception as exc:
                  status = getattr(exc, 'code', None)
                  body = None
                  try:
                      body = exc.read(4000).decode('utf-8', errors='replace')
                  except Exception:
                      pass
                  return {
                      'ok': False,
                      'status': status,
                      'url': url,
                      'error': str(exc),
                      'body': body,
                  }

          def query_url(base, params):
              return base + '?' + urllib.parse.urlencode(params)

          checked_at = datetime.now(timezone.utc).isoformat()
          snapshot = {
              'checked_at': checked_at,
              'mode': 'read_only_zero_spend',
              'evidence_schema': 'bounded-v1',
              'evidence_note': (
                  'Directory matches retain selected direct fields only. '
                  'Oversized upstream responses remain unverified, not absent.'
              ),
              'attribution_rule': (
                  'Do not count shared-wallet payer fields, probes, self-tests, '
                  'registrations, or seller-funded activity as endpoint revenue.'
              ),
              'targets': {
                  'vendor_gate': VENDOR,
                  'pa_best_match': CHEAP,
                  'pa_enriched_search': MAIN,
              },
          }

          # 402 Index: exact vendor record plus buyer-style searches.
          vendor_402_id = '0d49cbe9-4a47-42fa-9654-1c79090035e4'
          idx_queries = [
              'Pennsylvania Vendor Intake Decision Gate',
              'Pennsylvania vendor intake',
              'Pennsylvania business registry',
              'vendor verification Pennsylvania',
              'company identity Pennsylvania',
          ]
          idx = {
              'vendor_service': fetch_json(
                  'https://402index.io/api/v1/services/' + vendor_402_id
              ),
              'queries': {},
          }
          for q in idx_queries:
              result = fetch_json(
                  query_url(
                      'https://402index.io/api/v1/services',
                      {'q': q, 'protocol': 'x402', 'limit': 50},
                  )
              )
              if result.get('ok'):
                  rows = (
                      result['data'].get('services')
                      or result['data'].get('results')
                      or result['data'].get('data')
                      or []
                  )
                  ours = []
                  for rank, row in enumerate(rows, 1):
                      blob = json.dumps(row).lower()
                      if (
                          'pa-entity-x402.floot.app' in blob
                          or 'pa-entity-lookup-x402-4fbm4s' in blob
                          or 'vendor-intake-gate' in blob
                      ):
                          ours.append({'rank': rank, 'record': row})
                  result['ours'] = ours
                  result['returned'] = len(rows)
              idx['queries'][q] = result
          snapshot['402index'] = idx

          # nohumans: known raw listings + vendor-gate discovery query.
          snapshot['nohumans'] = {
              'enriched_listing': fetch_json(
                  'https://api.nohumans.directory/v1/listings/958fd262-287'
              ),
              'best_match_listing': fetch_json(
                  'https://api.nohumans.directory/v1/listings/9f2f7a33-cb2'
              ),
              'vendor_discovery': fetch_json(
                  query_url(
                      'https://api.nohumans.directory/v1/discover',
                      {'q': 'Pennsylvania Vendor Intake'},
                  )
              ),
          }

          # PayAI resource statistics. Missing vendor record is informative and non-fatal.
          snapshot['payai'] = {}
          for key, resource in {
              'enriched': MAIN,
              'best_match': CHEAP,
              'vendor_gate': VENDOR,
          }.items():
              encoded = urllib.parse.quote(resource, safe='')
              snapshot['payai'][key] = fetch_json(
                  'https://facilitator.payai.network/discovery/resources/'
                  + encoded
                  + '/stats'
              )

          # Market402 public measured index/search.
          market_operators = fetch_json('https://market402.com/operators.json')
          market_index = fetch_json('https://market402.com/index.json')
          market_search = fetch_json(
              query_url(
                  'https://market402.com/search.json',
                  {'q': 'Pennsylvania Vendor Intake'},
              )
          )
          snapshot['market402'] = {
              'operators': {
                  **{k: v for k, v in market_operators.items() if k != 'data'},
                  'matches': find_matching_dicts(
                      market_operators.get('data'),
                      ['pa-entity-lookup-x402-4fbm4s', 'vendor-intake-gate'],
                  )[:50]
                  if market_operators.get('ok')
                  else [],
              },
              'index': {
                  **{k: v for k, v in market_index.items() if k != 'data'},
                  'matches': find_matching_dicts(
                      market_index.get('data'),
                      ['pa-entity-lookup-x402-4fbm4s', 'vendor-intake-gate'],
                  )[:50]
                  if market_index.get('ok')
                  else [],
              },
              'vendor_search': market_search,
          }

          # Agent402 current seller readback only. Do not re-register until Floot
          # advertises the consolidated portfolio after its quota reset.
          snapshot['agent402'] = {
              'seller': fetch_json(
                  query_url(
                      'https://agent402.tools/api/index',
                      {'seller': 'pa-entity-x402.floot.app'},
                  )
              )
          }

          # Base USDC transfer history for the payout wallet. This is wallet-level
          # evidence only; correlate amounts/times carefully and never assume a
          # transfer belongs to one endpoint without resource-level evidence too.
          onchain = fetch_json(
              query_url(
                  'https://base.blockscout.com/api',
                  {
                      'module': 'account',
                      'action': 'tokentx',
                      'address': PAYTO,
                      'contractaddress': USDC,
                      'page': 1,
                      'offset': 50,
                      'sort': 'desc',
                  },
              )
          )
          incoming = []
          if onchain.get('ok'):
              rows = onchain.get('data', {}).get('result') or []
              for row in rows:
                  if str(row.get('to', '')).lower() != PAYTO.lower():
                      continue
                  try:
                      decimals = int(row.get('tokenDecimal') or 6)
                      amount = int(row.get('value') or 0) / (10 ** decimals)
                  except Exception:
                      amount = None
                  incoming.append({
                      'hash': row.get('hash'),
                      'from': row.get('from'),
                      'to': row.get('to'),
                      'amount_usdc': amount,
                      'timeStamp': row.get('timeStamp'),
                      'confirmations': row.get('confirmations'),
                      'tokenSymbol': row.get('tokenSymbol'),
                  })
          snapshot['onchain_base_usdc'] = {
              **{k: v for k, v in onchain.items() if k != 'data'},
              'incoming': incoming,
              'note': (
                  'Wallet-level evidence only. Compare with resource-specific '
                  'facilitator stats before attributing a settlement.'
              ),
          }

          with open(
              'verification/pa-entity-directory-status-latest.json',
              'w',
              encoding='utf-8',
          ) as handle:
              json.dump(snapshot, handle, indent=2, sort_keys=True)
              handle.write('\n')

          # Prevent a runaway public Git blob even if a provider changes shape.
          receipt_size = assert_snapshot_size(
              'verification/pa-entity-directory-status-latest.json'
          )

          print(json.dumps({
              'receipt_bytes': receipt_size,
              'checked_at': checked_at,
              '402index_vendor_ok': idx['vendor_service'].get('ok'),
              'nohumans_vendor_search_ok': snapshot['nohumans']['vendor_discovery'].get('ok'),
              'market402_index_ok': market_index.get('ok'),
              'market402_search_ok': market_search.get('ok'),
              'agent402_seller_ok': snapshot['agent402']['seller'].get('ok'),
          }, indent=2, sort_keys=True))
          PY

      - name: Commit refreshed receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SNAPSHOT='verification/pa-entity-directory-status-latest.json'

          # Refuse to transplant a receipt collected by older source onto a
          # newer main commit. A later run can safely recollect if main moves.
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test -n "$remote_main" || { echo 'Unable to resolve current main.'; exit 1; }
          test "$GITHUB_SHA" = "$remote_main" || { echo 'Main moved during collection.'; exit 1; }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SNAPSHOT"
          if git diff --cached --quiet; then
            echo 'Directory receipt unchanged.'
            exit 0
          fi
          git commit -m 'chore: refresh PA x402 directory status'
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test "$GITHUB_SHA" = "$remote_main" || { echo 'Main moved before push.'; exit 1; }
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' \
            push origin HEAD:refs/heads/main
