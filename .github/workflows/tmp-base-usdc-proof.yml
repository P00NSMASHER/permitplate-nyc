name: inspect PA Entity payout wallet proof

on:
  push:
    paths:
      - '.github/workflows/tmp-base-usdc-proof.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public Base USDC transfer history
        shell: bash
        run: |
          set -euo pipefail
          WALLET='0x708f7b52b56eafd7fc1de65fc7752ed732914021'
          USDC='0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'
          URL="https://base.blockscout.com/api/v2/addresses/$WALLET/token-transfers?type=ERC-20"
          curl -fsSL --max-time 30 "$URL" -o /tmp/transfers.json
          jq --arg wallet "$WALLET" --arg usdc "$USDC" '
            [
              .items[]
              | select((.token.address // "" | ascii_downcase) == ($usdc|ascii_downcase))
              | {
                  timestamp,
                  tx_hash,
                  from:(.from.hash // .from),
                  to:(.to.hash // .to),
                  total,
                  token_symbol:(.token.symbol // null),
                  token_decimals:(.token.decimals // null),
                  direction:(if ((.to.hash // .to // "")|ascii_downcase)==($wallet|ascii_downcase) then "in" else "out" end)
                }
            ]' /tmp/transfers.json
