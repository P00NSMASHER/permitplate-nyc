name: PA Entity x402dash dual-route check

on:
  push:
    paths:
      - '.github/workflows/tmp-pa-entity-x402dash-dual.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ensure both PA Entity routes are indexed
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.x402dash.com'
          CHEAP='https://pa-entity-x402.floot.app/_api/pa-entity-one?q=OpenAI'
          MAIN='https://pa-entity-x402.floot.app/_api/pa-business?q=OpenAI&limit=1'

          echo '=== CURRENT MATCHES ==='
          curl -fsSL --get "$API/v1/endpoints"             --data-urlencode 'limit=200'             --data-urlencode 'q=pa-entity-x402.floot.app' > /tmp/list.json
          cat /tmp/list.json | head -c 20000
          echo

          HAS_MAIN=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/list.json'))
          blob=json.dumps(d)
          print('1' if '/_api/pa-business' in blob else '0')
          PY
          )

          if [ "$HAS_MAIN" = "0" ]; then
            echo '=== REGISTER ENRICHED ==='
            curl -sS -i -X POST "$API/v1/register"               -H 'content-type: application/json'               --data "$(jq -nc                 --arg url "$MAIN"                 --arg name 'Pennsylvania Business Registry — Entity Lookup x402'                 --arg description 'Enriched Pennsylvania business-registry entity lookup with filing, address, officer and creation-date evidence.'                 --arg category 'Verification'                 '{url:$url,name:$name,description:$description,category:$category,tags:["Pennsylvania","business registry","KYB","verification","x402"]}')"               | head -c 16000
            echo
          else
            echo 'ENRICHED_ALREADY_PRESENT=true'
          fi

          echo '=== LIVENESS CHEAP ==='
          curl -fsSL --get "$API/v1/liveness" --data-urlencode "endpoint=$CHEAP" | head -c 16000
          echo

          echo '=== LIVENESS ENRICHED ==='
          curl -fsSL --get "$API/v1/liveness" --data-urlencode "endpoint=$MAIN" | head -c 16000
          echo
