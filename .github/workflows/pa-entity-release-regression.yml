name: PA Entity x402 release regression

on:
  push:
    paths:
      - 'docs/pa-entity-floot-release/**'
      - 'scripts/test-pa-entity-floot-release.mts'
      - 'scripts/test-pa-entity-best-match-release.mts'
      - 'scripts/test-pa-entity-discovery-fixtures.mjs'
      - 'scripts/verify-pa-entity-floot-patches.mjs'
      - 'PA_ENTITY_SKILL.md'
      - 'x402-manifest.json'
      - '.github/workflows/pa-entity-release-regression.yml'
  pull_request:
    paths:
      - 'docs/pa-entity-floot-release/**'
      - 'scripts/test-pa-entity-floot-release.mts'
      - 'scripts/test-pa-entity-best-match-release.mts'
      - 'scripts/test-pa-entity-discovery-fixtures.mjs'
      - 'scripts/verify-pa-entity-floot-patches.mjs'
      - 'PA_ENTITY_SKILL.md'
      - 'x402-manifest.json'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Test payment and settlement recovery
        run: npx -y tsx@latest scripts/test-pa-entity-floot-release.mts
      - name: Test $0.001 best-match payment and ranking
        run: npx -y tsx@latest scripts/test-pa-entity-best-match-release.mts
      - name: Test discovery fixture parity
        run: node scripts/test-pa-entity-discovery-fixtures.mjs
      - name: Verify atomic Floot patch parity
        run: node scripts/verify-pa-entity-floot-patches.mjs
