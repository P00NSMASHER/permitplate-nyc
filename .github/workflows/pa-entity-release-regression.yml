name: PA Entity x402 release regression

on:
  push:
    paths:
      - 'docs/pa-entity-floot-release/**'
      - 'scripts/test-pa-entity-floot-release.mts'
      - 'scripts/test-pa-entity-best-match-release.mts'
      - 'scripts/test-pa-entity-discovery-fixtures.mjs'
      - 'scripts/verify-pa-entity-floot-patches.mjs'
      - 'scripts/verify-pa-vendor-gate.mjs'
      - 'scripts/test-floot-vendor-gate-release.mts'
      - 'scripts/test-floot-rehost-raw-endpoints.mts'
      - 'PA_ENTITY_SKILL.md'
      - 'x402-manifest.json'
      - '.github/workflows/pa-entity-release-regression.yml'
  pull_request:
    paths:
      - 'docs/pa-entity-floot-release/**'
      - 'scripts/test-pa-entity-floot-release.mts'
      - 'scripts/test-pa-entity-best-match-release.mts'
      - 'scripts/test-pa-entity-discovery-fixtures.mjs'
      - 'scripts/verify-pa-entity-floot-patches.mjs'
      - 'scripts/verify-pa-vendor-gate.mjs'
      - 'scripts/test-floot-vendor-gate-release.mts'
      - 'scripts/test-floot-rehost-raw-endpoints.mts'
      - 'PA_ENTITY_SKILL.md'
      - 'x402-manifest.json'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Select October 2026 patched Node.js runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - name: Reject unpatched Node.js runtime
        run: |
          node --version
          node -e 'const [major,minor,patch]=process.versions.node.split(".").map(Number);if(major!==22 || minor<23 || (minor===23 && patch<4)) process.exit(1)'
      - name: Test payment and settlement recovery
        run: npx -y tsx@latest scripts/test-pa-entity-floot-release.mts
      - name: Test $0.001 best-match payment and ranking
        run: npx -y tsx@latest scripts/test-pa-entity-best-match-release.mts
      - name: Test discovery fixture parity
        run: node scripts/test-pa-entity-discovery-fixtures.mjs
      - name: Verify atomic Floot patch parity
        run: node scripts/verify-pa-entity-floot-patches.mjs
      - name: Test staged Floot-native vendor gate
        run: npx -y tsx@latest scripts/test-floot-vendor-gate-release.mts
      - name: Test staged Floot-native raw rehost endpoints
        run: npx -y tsx@latest scripts/test-floot-rehost-raw-endpoints.mts
      - name: Record current AppDeploy vendor-gate hosting status
        if: always()
        continue-on-error: true
        run: node scripts/verify-pa-vendor-gate.mjs
