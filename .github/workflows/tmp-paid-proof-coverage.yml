name: trace ag3ntsearch contribution status

on:
  push:
    paths:
      - '.github/workflows/tmp-paid-proof-coverage.yml'

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect ag3ntsearch public app and contribution status paths
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ag3ntsearch.fullyagentnativeapps.com'
          mkdir -p /tmp/ag3nt
          curl -sS -L --max-time 25 "$BASE/" -o /tmp/ag3nt/index.html || true
          echo '=== ROOT STATUS ==='
          curl -sS -I -L --max-time 25 "$BASE/" | head -40 || true

          python3 - <<'PY'
          import re,urllib.parse,subprocess,pathlib
          base='https://ag3ntsearch.fullyagentnativeapps.com'
          p=pathlib.Path('/tmp/ag3nt/index.html')
          html=p.read_text(errors='ignore') if p.exists() else ''
          urls=[]
          for src in re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)["\x27]',html,re.I):
              u=urllib.parse.urljoin(base+'/',src)
              if u not in urls: urls.append(u)
          print('SCRIPT_COUNT',len(urls))
          chunks=[]
          for i,u in enumerate(urls[:80]):
              out=pathlib.Path(f'/tmp/ag3nt/s{i}.js')
              if subprocess.run(['curl','-fsSL','--max-time','20',u,'-o',str(out)]).returncode==0:
                  s=out.read_text(errors='ignore'); chunks.append(s)
          s='\n'.join(chunks)
          low=s.lower()
          for needle in ['received_unreviewed','contribution:','contribution','review intake','status_url','audit.json']:
              print('===',needle,'===')
              start=0; shown=0
              while shown<12:
                  i=low.find(needle.lower(),start)
                  if i<0: break
                  print(s[max(0,i-1200):min(len(s),i+2600)].replace('\n',' ')[:3800])
                  print('---')
                  start=i+len(needle); shown+=1
          print('=== URL CANDIDATES ===')
          vals=set()
          for pat in [r'/[A-Za-z0-9._~!$&()*+,;=:@%/?-]{1,180}(?:contribut|review|audit|status)[A-Za-z0-9._~!$&()*+,;=:@%/?-]{0,180}',
                      r'https?://[^"\x27\s<>]{1,260}']:
              vals.update(m.group(0) for m in re.finditer(pat,s,re.I))
          for v in sorted(vals):
              if any(k in v.lower() for k in ['contribut','review','audit','status','ag3ntsearch']):
                  print(v)
          PY

          echo '=== LIKELY RECEIPT PATHS ==='
          for id in             '244eccd0-c9ce-43da-af59-a541dde5f632'             '90ea1a5d-f6db-4ee9-969e-47c072985e7a'
          do
            for path in               "/api/contributions/$id"               "/api/contribution/$id"               "/contributions/$id"               "/contribution/$id"               "/api/status/$id"
            do
              code=$(curl -sS --max-time 15 -o /tmp/body -w '%{http_code}' "$BASE$path" || true)
              echo "$code $path"
              if [ "$code" != "404" ] && [ "$code" != "000" ]; then head -c 3000 /tmp/body; echo; fi
            done
          done
