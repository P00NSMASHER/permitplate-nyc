name: PA Entity nohumans cheap inspect

on:
  push:
    paths:
      - '.github/workflows/pa-entity-nohumans-cheap-submit.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect existing cheap listing and claim path
        shell: bash
        run: |
          set -euo pipefail
          ID='9f2f7a33-cb2'

          echo '=== LISTING ==='
          curl -sS "https://nohumans.directory/v1/listings/$ID" | jq .

          echo
          echo '=== CLAIM INSTRUCTIONS ==='
          curl -sS -i "https://nohumans.directory/v1/listings/$ID/claim" | head -c 20000

          echo
          echo '=== DISCOVER EXACT ==='
          curl -sS -G 'https://nohumans.directory/v1/discover'             --data-urlencode 'q=Pennsylvania business registry best match company identity'             --data-urlencode 'limit=50' |             jq --arg id "$ID" '{
              position: ([.results[]?.id] | index($id) | if . == null then null else . + 1 end),
              listing: ([.results[]? | select(.id == $id)] | first),
              returned: (.results | length)
            }'
