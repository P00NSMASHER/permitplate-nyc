name: PermitPlate detection ledger

on:
  workflow_dispatch:
  schedule:
    - cron: '7 13 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/detection-ledger.yml'

permissions:
  contents: write

jobs:
  detection-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Advance detection ledger from complete live graph
        run: node pipeline/run-detection-ledger.js state/detection-ledger.json pipeline/detection-ledger-run-result.json

      - name: Build scored opportunity packages for customer-eligible detections
        run: node pipeline/run-opportunity-packages.js pipeline/detection-ledger-run-result.json pipeline/opportunity-packages-result.json

      - name: Commit detection state only after package success
        run: |
          if git diff --quiet -- state/detection-ledger.json; then
            echo "Detection ledger unchanged."
            exit 0
          fi
          git config user.name "PermitPlate Detection Bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/detection-ledger.json
          git commit -m "state: advance PermitPlate detection ledger [skip ci]"
          git push

      - name: Retain detection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: permitplate-detection-ledger
          path: |
            pipeline/detection-ledger-run-result.json
            pipeline/opportunity-packages-result.json
          if-no-files-found: warn
          retention-days: 30
