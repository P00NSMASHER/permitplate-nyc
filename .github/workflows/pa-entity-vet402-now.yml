name: PA Entity vet402 catalog check

on:
  push:
    paths:
      - '.github/workflows/pa-entity-vet402-now.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve both routes and inspect measurement state
        shell: bash
        run: |
          set -euo pipefail

          check () {
            label="$1"
            url="$2"
            echo "=== $label RESOLVE ==="
            curl -sS -G 'https://vet402.com/api/v1/resolve'               --data-urlencode "q=$url" | tee "/tmp/$label.json" | jq .

            RID=$(jq -r '.resource.resource_id // empty' "/tmp/$label.json")
            OID=$(jq -r '.resource.observatory_id // empty' "/tmp/$label.json")
            echo "RID=$RID OID=$OID"
            if [ -n "$RID" ]; then
              echo "=== $label DECISION ==="
              curl -sS "https://vet402.com/api/v1/resources/$RID/decision?role=payer&caller_dialect=v2" | jq .
            fi
            if [ -n "$OID" ]; then
              echo "=== $label FACTS ==="
              curl -sS "https://vet402.com/api/v1/observatory/endpoints/$OID/facts" | jq .
              echo "=== $label PURCHASES ==="
              curl -sS "https://vet402.com/api/v1/observatory/endpoints/$OID/purchases" | jq .
            fi
          }

          check main 'https://pa-entity-x402.floot.app/_api/pa-business?q=OpenAI&limit=1'
          check cheap 'https://pa-entity-x402.floot.app/_api/pa-entity-one?q=OpenAI'
