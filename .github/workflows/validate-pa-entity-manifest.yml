name: validate PA Entity manifest

on:
  push:
    paths:
      - '.github/workflows/validate-pa-entity-manifest.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate against Agent402 parser
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/MikeyPetrillo/Agent402.git /tmp/agent402
          cp x402-manifest.json /tmp/agent402/pa-entity-manifest.json
          cd /tmp/agent402
          npm ci --ignore-scripts --no-audit --no-fund
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { normaliseManifestTools } from './src/x402-index.js';

          const origin = 'https://pa-entity-x402.floot.app';
          const manifest = JSON.parse(fs.readFileSync('./pa-entity-manifest.json', 'utf8'));
          const tools = normaliseManifestTools(manifest, origin);
          console.log(JSON.stringify(tools, null, 2));

          if (tools.length !== 1) throw new Error('expected exactly one tool');
          const t = tools[0];
          const checks = {
            route: t.route === '/_api/pa-business',
            network: t.networks?.includes('eip155:8453'),
            payTo: t.payToByNetwork?.['eip155:8453'] === '0x708f7b52b56eafd7fc1de65fc7752ed732914021',
            price: Number(String(t.price).replace('$','')) === 0.005,
            domain: t.evmDomainByNetwork?.['eip155:8453']?.name === 'USD Coin',
            provenance: t.provenance === 'manifest',
          };
          console.log('CHECKS', JSON.stringify(checks));
          if (Object.values(checks).some(v => !v)) throw new Error('manifest parser compatibility check failed');
          console.log('AGENT402_MANIFEST_COMPATIBLE=true');
          NODE
