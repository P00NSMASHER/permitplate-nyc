name: PA Entity revenue snapshot

on:
  push:
    paths:
      - '.github/workflows/pa-entity-revenue-snapshot.yml'

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read resource-specific settlement evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.parse, subprocess
          base='https://facilitator.payai.network/discovery/resources/'
          for resource in [
              'https://pa-entity-x402.floot.app/_api/pa-business',
              'https://pa-entity-x402.floot.app/_api/pa-entity-one',
          ]:
              url=base+urllib.parse.quote(resource,safe='')+'/stats'
              print('\n===',resource,'===')
              subprocess.run(['curl','-sS','--max-time','20',url],check=False)
              print()
          PY

          echo '=== Agent402 seller readback ==='
          curl -sS -G 'https://agent402.tools/api/index'             --data-urlencode 'seller=pa-entity-x402.floot.app'             | jq '{sellers:[.sellers[]? | {origin,health,routable,routerDispatchEligible,routerDispatchReason,settlements30d,distinctPayers30d,volume30dUsd}],tools:[.tools[]? | select(.route=="/_api/pa-business" or .route=="/_api/pa-entity-one") | {route,slug,price,health,routerDispatchEligible,routerDispatchReason,routerDispatchByChain}]}'
