name: inspect ag3ntsearch review status

on:
  push:
    paths:
      - '.github/workflows/tmp-ag3ntsearch-status.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Inspect public review/status surfaces
        shell: bash
        run: |
          set +e
          BASE='https://ag3ntsearch.fullyagentnativeapps.com'
          IDS=(
            'contribution:2026-10-01T13:38:23.066Z:244eccd0-c9ce-43da-af59-a541dde5f632'
            'contribution:2026-10-01T14:53:23.291Z:90ea1a5d-f6db-4ee9-969e-47c072985e7a'
          )

          echo '=== common metadata ==='
          for p in / /openapi.json /api/openapi.json /.well-known/openapi.json /robots.txt /sitemap.xml /api /api/contributions; do
            code=$(curl -sS --max-time 20 -o /tmp/body -w '%{http_code}' "$BASE$p")
            echo "--- $p => $code"
            head -c 12000 /tmp/body; echo
          done

          echo '=== receipt-specific candidates ==='
          for id in "${IDS[@]}"; do
            enc=$(python3 -c 'import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1],safe=""))' "$id")
            echo "### $id"
            for p in               "/api/contributions/$enc"               "/api/contributions/status/$enc"               "/api/contribution/$enc"               "/api/status/$enc"               "/api/reviews/$enc"               "/api/contributions?receipt=$enc"               "/api/contributions?id=$enc"; do
              code=$(curl -sS --max-time 20 -o /tmp/body -w '%{http_code}' "$BASE$p")
              echo "--- $p => $code"
              head -c 12000 /tmp/body; echo
            done
          done

          echo '=== discover frontend assets/routes ==='
          curl -sS --max-time 20 "$BASE/" -o /tmp/root.html
          python3 - <<'PY'
          import re,urllib.parse,subprocess
          s=open('/tmp/root.html',errors='ignore').read()
          base='https://ag3ntsearch.fullyagentnativeapps.com'
          srcs=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)',s):
              u=urllib.parse.urljoin(base,src)
              if u not in srcs: srcs.append(u)
          print('SCRIPT_COUNT',len(srcs))
          for i,u in enumerate(srcs[:30]):
              out=f'/tmp/js{i}.txt'
              subprocess.run(['curl','-sS','--max-time','20',u,'-o',out])
              try: j=open(out,errors='ignore').read()
              except: continue
              hits=set()
              for m in re.finditer(r'.{0,180}(?:contribution|review|receipt|status|/api/).{0,300}',j,re.I|re.S):
                  v=m.group(0).replace('\n',' ')
                  if v not in hits:
                      hits.add(v); print('ASSET',u, v[:900])
                  if len(hits)>=80: break
          PY
