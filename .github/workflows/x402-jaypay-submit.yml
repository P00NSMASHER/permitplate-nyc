name: jaypay submit retry

on:
  push:
    paths:
      - '.github/workflows/x402-jaypay-submit.yml'

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Submit cheap SKU
        shell: bash
        run: |
          ENDPOINT='https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s/api/pa-entity-one?q=OpenAI'
          cat > /tmp/payload.json <<'JSON'
          {
            "name":"PA Entity Best Match x402",
            "description":"Low-friction Pennsylvania company identity lookup by business name. Returns one best-ranked legal-entity registry record with filing number, registration type, registered address, city, ZIP, and county for $0.001 USDC.",
            "endpoint":"https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s/api/pa-entity-one?q=OpenAI",
            "method":"GET",
            "price_usdc":0.001,
            "chain":"base",
            "protocol":"x402",
            "category":"company-data",
            "tags":"pennsylvania,business-registry,company-identity,legal-entity,entity-resolution,due-diligence",
            "example":"https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s/api/pa-entity-one?q=OpenAI",
            "submitter_email":""
          }
          JSON
          echo '=== submit ==='
          curl -sS -i -X POST 'https://402directory.com/api/submissions' -H 'content-type: application/json' --data-binary @/tmp/payload.json
          echo
          echo '=== directory lookup ==='
          curl -sS 'https://402directory.com/api/directory' | grep -F "$ENDPOINT" -C 2 || true
