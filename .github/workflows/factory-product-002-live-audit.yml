name: Factory Product 002 live dependency audit

on:
  push:
    branches:
      - x402-product-factory-bootstrap
    paths:
      - '.github/workflows/factory-product-002-live-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Audit Product 002 free dependencies and sample
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            label="$1"; shift
            url="$1"; shift
            code=$(curl -sS -L --max-time 25 -o /tmp/body -w '%{http_code}' "$url" || true)
            echo "=== $label ==="
            echo "HTTP=$code"
            head -c 5000 /tmp/body || true
            echo
          }
          probe CENSUS_DEMO 'https://api-v2.appdeploy.ai/app/us-census-address-geocoder-x402-23mj4x/api/demo?address=600%20North%20Second%20Street%2C%20Suite%20401%2C%20Harrisburg%2C%20PA%2017101'
          probe OFAC_DEMO 'https://api-v2.appdeploy.ai/app/ofac-sdn-name-screen-x402-m9ko96/api/demo?name=OpenAI%20OpCo&limit=3&minScore=90'
          probe RDAP_DEMO 'https://api-v2.appdeploy.ai/app/domain-rdap-lookup-x402-spdfnq/api/demo?domain=openai.com'
          probe VENDOR_INTAKE_DEMO 'https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s/api/vendor-intake-demo?case=proceed'
