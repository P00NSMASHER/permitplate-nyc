name: PA Entity public settlement status once

on:
  push:
    paths:
      - '.github/workflows/tmp-pa-entity-public-settlement-status.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read PayAPI public visibility and PayAI settlements
        shell: bash
        run: |
          set -euo pipefail

          echo '=== PAYAPI SEARCH NAME ==='
          curl -fsSL --get 'https://payapi.market/agent/search'             --data-urlencode 'q=PA Entity Lookup x402' > /tmp/payapi-name.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/payapi-name.json'))
          hits=[]
          for x in d.get('results',[]):
              if 'pa entity lookup x402' in str(x.get('name','')).lower() or 'pa-entity-x402.floot.app' in json.dumps(x).lower():
                  hits.append(x)
          print(json.dumps({'count':len(hits),'matches':hits[:5]},indent=2))
          PY

          echo '=== PAYAPI SEARCH PA REGISTRY ==='
          curl -fsSL --get 'https://payapi.market/agent/search'             --data-urlencode 'q=Pennsylvania business registry' > /tmp/payapi-pa.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/payapi-pa.json'))
          hits=[x for x in d.get('results',[]) if 'pa-entity-x402.floot.app' in json.dumps(x).lower()]
          print(json.dumps({'count':len(hits),'matches':hits[:5]},indent=2))
          PY

          echo '=== PAYAI CHEAP ==='
          ENC_CHEAP=$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote('https://pa-entity-x402.floot.app/_api/pa-entity-one',safe=''))
          PY
          )
          curl -fsSL "https://facilitator.payai.network/discovery/resources/$ENC_CHEAP/stats" |             jq '{resource,settlements,volume,buyers,reliability,cachedAt}'

          echo '=== PAYAI MAIN ==='
          ENC_MAIN=$(python3 - <<'PY'
          import urllib.parse
          print(urllib.parse.quote('https://pa-entity-x402.floot.app/_api/pa-business',safe=''))
          PY
          )
          curl -fsSL "https://facilitator.payai.network/discovery/resources/$ENC_MAIN/stats" |             jq '{resource,settlements,volume,buyers,reliability,cachedAt}'
