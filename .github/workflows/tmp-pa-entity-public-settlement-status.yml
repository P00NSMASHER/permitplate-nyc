name: PA Entity 402directory submit trace

on:
  push:
    paths:
      - '.github/workflows/tmp-pa-entity-public-settlement-status.yml'

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect 402directory public submit form
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://402directory.com/submit' -o /tmp/submit.html
          python3 - <<'PY'
          import re, urllib.parse, subprocess, pathlib
          html=pathlib.Path('/tmp/submit.html').read_text(errors='ignore')

          print('=== FORM TAGS ===')
          for m in re.finditer(r'<form\b[^>]*>|<input\b[^>]*>|<select\b[^>]*>|<textarea\b[^>]*>|<button\b[^>]*>',html,re.I):
              print(m.group(0)[:1600])

          base='https://402directory.com'
          chunks=[]
          for i,src in enumerate(re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)["\x27]',html,re.I)):
              u=urllib.parse.urljoin(base+'/',src)
              out=pathlib.Path(f'/tmp/s{i}.js')
              if subprocess.run(['curl','-fsSL','--max-time','20',u,'-o',str(out)]).returncode==0 and out.exists():
                  chunks.append(out.read_text(errors='ignore'))
          s='\n'.join(chunks)
          low=s.lower()

          for needle in ['submit api','/api/','fetch(','endpointurl','price per call','email','description']:
              print(f'=== {needle} ===')
              start=0; shown=0; n=needle.lower()
              while shown<20:
                  i=low.find(n,start)
                  if i<0: break
                  print(s[max(0,i-1800):min(len(s),i+3600)].replace('\n',' ')[:5400])
                  print('\n---\n')
                  start=i+len(n); shown+=1

          print('=== API CANDIDATES ===')
          vals=set()
          for pat in [
              r'https://402directory\.com[^"\x27\s<>]{0,240}',
              r'/api/[A-Za-z0-9._~!$&()*+,;=:@%/?-]{1,220}',
              r'/[A-Za-z0-9_-]{1,80}(?:submit|directory|service)[A-Za-z0-9_/-]{0,180}'
          ]:
              vals.update(m.group(0) for m in re.finditer(pat,s,re.I))
          for v in sorted(vals): print(v)
          PY
