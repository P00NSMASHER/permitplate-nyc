name: PA Entity Circle discovery check

on:
  push:
    paths:
      - '.github/workflows/pa-entity-circle-discovery.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Extract Circle seller-score API route
        shell: bash
        run: |
          set -euo pipefail
          for page in sell sell/score; do
            curl -sS --max-time 20 "https://agents.circle.com/$page" -o "/tmp/${page//\//-}.html"
          done

          python3 - <<'PY'
          import re, subprocess, urllib.parse, pathlib
          base='https://agents.circle.com'
          urls=[]
          for p in pathlib.Path('/tmp').glob('sell*.html'):
              s=p.read_text(errors='ignore')
              for src in re.findall(r'<script[^>]+src="([^"]+)"',s):
                  u=urllib.parse.urljoin(base,src)
                  if u not in urls: urls.append(u)
          print('SCRIPT_COUNT',len(urls))
          for i,u in enumerate(urls):
              out=f'/tmp/chunk-{i}.js'
              subprocess.run(['curl','-sS','--max-time','20',u,'-o',out],check=False)
              try: s=open(out,errors='ignore').read()
              except: continue
              if re.search(r'readiness|score|sell/score|openapi|x402',s,re.I):
                  print('\n=== ASSET',u,'===')
                  patterns=[
                    r'https?://[^"\'\\ ]+',
                    r'["\'](/api/[^"\']+)["\']',
                    r'fetch\(([^)]{0,500})\)',
                    r'.{0,140}(?:readiness|sell/score|scoreApi|openapi\.json|x402).{0,260}'
                  ]
                  seen=set()
                  for pat in patterns:
                      for m in re.finditer(pat,s,re.I|re.S):
                          val=m.group(0).replace('\n',' ')
                          if val in seen: continue
                          seen.add(val)
                          if len(val)>700: val=val[:700]
                          print(val)
                          if len(seen)>=120: break
                      if len(seen)>=120: break
          PY

          echo '=== SCORE PAGE QUERY VARIANTS ==='
          for q in             'domain=pa-entity-x402.floot.app'             'url=https%3A%2F%2Fpa-entity-x402.floot.app'             'endpoint=pa-entity-x402.floot.app'
          do
            echo "--- $q"
            curl -sS --max-time 20 "https://agents.circle.com/sell/score?$q" |               grep -oiE '.{0,120}(score|pa-entity-x402|scanning|readiness).{0,240}' | head -30 || true
          done
