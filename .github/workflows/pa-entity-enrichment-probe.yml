name: PA Entity enrichment probe

on:
  push:
    paths:
      - '.github/workflows/pa-entity-enrichment-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Benchmark distinct projection on officer dataset
        shell: bash
        run: |
          set -euo pipefail
          SELECT='distinct business_name,filing_number,address_line1,address_line2,city,state,zip,typeofbusinessregistration,creationdate,shortcountyname,county_code'

          for q in OpenAI Sheetz Wawa; do
            QUP=$(printf '%s' "$q" | tr '[:lower:]' '[:upper:]')
            echo "=== PROJECTED DISTINCT $q ==="
            curl -sS -w '\nHTTP=%{http_code} TIME=%{time_total}\n'               --get 'https://data.pa.gov/resource/xvd7-5r2c.json'               --data-urlencode "\$select=$SELECT"               --data-urlencode "\$where=upper(business_name) like '%${QUP}%'"               --data-urlencode "\$order=business_name ASC"               --data-urlencode "\$limit=100" | tee "/tmp/projected-$q.txt"

            echo "=== STARTS-WITH $q ==="
            curl -sS -w '\nHTTP=%{http_code} TIME=%{time_total}\n'               --get 'https://data.pa.gov/resource/xvd7-5r2c.json'               --data-urlencode "\$select=$SELECT"               --data-urlencode "\$where=upper(business_name) like '${QUP}%'"               --data-urlencode "\$order=business_name ASC"               --data-urlencode "\$limit=100" | tee "/tmp/starts-$q.txt"
          done

          echo '=== SUMMARY ==='
          python3 - <<'PY'
          import json,glob,re
          for p in sorted(glob.glob('/tmp/projected-*')+glob.glob('/tmp/starts-*')):
              raw=open(p).read()
              body,meta=raw.split('\nHTTP=',1)
              rows=json.loads(body)
              print(p, meta.strip(), 'ROWS='+str(len(rows)))
              print(json.dumps(rows[:8],indent=2))
          PY
