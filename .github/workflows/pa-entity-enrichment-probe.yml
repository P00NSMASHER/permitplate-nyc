name: PA Entity enrichment probe

on:
  push:
    paths:
      - '.github/workflows/pa-entity-enrichment-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Benchmark officer lookup by filing number
        shell: bash
        run: |
          set -euo pipefail

          echo '=== SINGLE OpenAI principals ==='
          curl -sS -w '\nHTTP=%{http_code} TIME=%{time_total}\n'             --get 'https://data.pa.gov/resource/xvd7-5r2c.json'             --data-urlencode "\$select=filing_number,party_type,first_name,middle_name,last_name"             --data-urlencode "\$where=filing_number='0014371957'"             --data-urlencode "\$limit=100"

          echo '=== SINGLE Sheetz principals ==='
          curl -sS -w '\nHTTP=%{http_code} TIME=%{time_total}\n'             --get 'https://data.pa.gov/resource/xvd7-5r2c.json'             --data-urlencode "\$select=filing_number,party_type,first_name,middle_name,last_name"             --data-urlencode "\$where=filing_number='0000326968'"             --data-urlencode "\$limit=100"

          echo '=== SINGLE Wawa principals ==='
          curl -sS -w '\nHTTP=%{http_code} TIME=%{time_total}\n'             --get 'https://data.pa.gov/resource/xvd7-5r2c.json'             --data-urlencode "\$select=filing_number,party_type,first_name,middle_name,last_name"             --data-urlencode "\$where=filing_number='0000233685'"             --data-urlencode "\$limit=100"

          echo '=== BATCH 3 principals ==='
          curl -sS -w '\nHTTP=%{http_code} TIME=%{time_total}\n'             --get 'https://data.pa.gov/resource/xvd7-5r2c.json'             --data-urlencode "\$select=filing_number,party_type,first_name,middle_name,last_name"             --data-urlencode "\$where=filing_number in('0014371957','0000326968','0000233685')"             --data-urlencode "\$order=filing_number ASC"             --data-urlencode "\$limit=300"

          echo '=== BATCH 5 representative filings ==='
          curl -sS -w '\nHTTP=%{http_code} TIME=%{time_total}\n'             --get 'https://data.pa.gov/resource/xvd7-5r2c.json'             --data-urlencode "\$select=filing_number,party_type,first_name,middle_name,last_name"             --data-urlencode "\$where=filing_number in('0014371957','0000326968','0000233685','0014879623','0013702576')"             --data-urlencode "\$order=filing_number ASC"             --data-urlencode "\$limit=500"
