name: PA best-match directory batch

on:
  push:
    paths:
      - '.github/workflows/pa-entity-status.yml'

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Submit distinct $0.001 best-match tool
        shell: bash
        run: |
          set +e
          ENDPOINT='https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s/api/pa-entity-one?q=OpenAI'
          NAME='PA Entity Best Match x402'
          DESC='Resolve one best Pennsylvania legal-entity match by business name for $0.001 USDC. Returns the top-ranked Department of State registry record for low-cost company identity resolution, vendor matching, and lead normalization.'
          WALLET='0x708f7b52b56eafd7fc1de65fc7752ed732914021'

          echo '=== NOHUMANS ==='
          curl -sS -i -X POST 'https://api.nohumans.directory/v1/listings' \
            -H 'content-type: application/json' \
            --data '{"name":"PA Entity Best Match x402","description":"Resolve one best Pennsylvania legal-entity match by business name for $0.001 USDC. Returns the top-ranked Department of State registry record for low-cost company identity resolution, vendor matching, and lead normalization.","endpoint_url":"https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s/api/pa-entity-one?q=OpenAI","category":"data.company","price_amount":0.001,"price_currency":"USDC","chains":["base"],"sample_query":"https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s/api/pa-entity-one?q=OpenAI","request_schema":{"type":"object","required":["q"],"properties":{"q":{"type":"string","minLength":2,"maxLength":120,"example":"OpenAI","description":"Pennsylvania business name or distinctive name fragment"}}},"response_schema":{"type":"object","required":["query","found","match","source","paid"],"properties":{"query":{"type":"string"},"found":{"type":"boolean"},"match":{"type":["object","null"]},"source":{"type":"string"},"paid":{"type":"boolean"}}}}'
          echo

          echo '=== 402 INDEX ==='
          curl -sS -i -X POST 'https://402index.io/api/v1/register' \
            -H 'content-type: application/json' \
            --data "$(jq -nc --arg url "$ENDPOINT" --arg name "$NAME" --arg description "$DESC" '{url:$url,name:$name,protocol:"x402",http_method:"GET",description:$description,price_usd:0.001,payment_asset:"USDC",payment_network:"Base",category:"data/company"}')"
          echo

          echo '=== X402DASH ==='
          curl -sS -i -X POST 'https://api.x402dash.com/v1/register' \
            -H 'content-type: application/json' \
            --data "$(jq -nc --arg url "$ENDPOINT" --arg name "$NAME" --arg description "$DESC" '{url:$url,name:$name,description:$description,category:"data-enrichment",tags:["pennsylvania","business-registry","company-identity","best-match","entity-resolution"]}')"
          echo

          echo '=== X402 ARENA ==='
          curl -sS -i -X POST 'https://core.x402arena.gg/register' \
            -H 'content-type: application/json' \
            --data "$(jq -nc --arg endpoint "$ENDPOINT" --arg walletAddress "$WALLET" --arg description "$DESC" '{name:"pa-entity-best-match",endpoint:$endpoint,niche:"company-identity",description:$description,walletAddress:$walletAddress,method:"GET",resourceType:"http",inputSchema:{type:"object",properties:{q:{type:"string",minLength:2}},required:["q"]},outputSchema:{type:"object",properties:{query:{type:"string"},found:{type:"boolean"},match:{type:["object","null"]},source:{type:"string"},paid:{type:"boolean"}},required:["query","found","match","source","paid"]}}')"
          echo
