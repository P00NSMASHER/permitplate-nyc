name: PA best-match nohumans submit

on:
  push:
    paths:
      - '.github/workflows/pa-entity-status.yml'

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit paid best-match endpoint without fake free preview
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/nh.json -w '%{http_code}' -X POST 'https://api.nohumans.directory/v1/listings'             -H 'content-type: application/json'             --data '{"name":"PA Entity Best Match x402","description":"Resolve one best Pennsylvania legal-entity match by business name for $0.001 USDC. Returns the top-ranked Pennsylvania Department of State registry record for low-cost company identity resolution, vendor matching, and lead normalization.","endpoint_url":"https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s/api/pa-entity-one?q=OpenAI","category":"data.company","price_amount":0.001,"price_currency":"USDC","chains":["base"],"request_schema":{"type":"object","required":["q"],"properties":{"q":{"type":"string","minLength":2,"maxLength":120,"example":"OpenAI","description":"Pennsylvania business name or distinctive fragment"}}},"response_schema":{"type":"object","required":["query","found","match","source","paid"],"properties":{"query":{"type":"string"},"found":{"type":"boolean"},"match":{"type":["object","null"]},"source":{"type":"string"},"paid":{"type":"boolean"}}}}')
          echo "HTTP_STATUS=$STATUS"

          TOKEN=$(jq -r '.claim_token // empty' /tmp/nh.json)
          if [ -n "$TOKEN" ]; then
            echo "::add-mask::$TOKEN"
          fi

          echo '=== SAFE SUBMISSION RESULT ==='
          jq 'del(.claim_token) | {id,name,status,score,price_amount,price_currency,endpoint_url,category,chains,paid_verified,evidence_tier,request_schema,response_schema,error}' /tmp/nh.json

          ID=$(jq -r '.id // empty' /tmp/nh.json)
          if [ -n "$ID" ]; then
            echo '=== READBACK ==='
            curl -sS "https://api.nohumans.directory/v1/listings/$ID" | jq '{id,name,status,score,probe_count,probes_passed,paid_verified,distinct_payers,evidence_tier,price_amount,endpoint_url}'
          fi
