name: PA Entity Market402 submit

on:
  push:
    paths:
      - '.github/workflows/pa-entity-status.yml'

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit current paid endpoint using current schema
        shell: bash
        run: |
          set +e
          RESOURCE='https://pa-entity-x402.floot.app/_api/pa-business?q=OpenAI&limit=1'

          echo '=== SUBMIT ==='
          curl -sS -i -X POST 'https://market402.com/submit'             -H 'content-type: application/json'             --data "$(jq -nc --arg resource "$RESOURCE" '{resource:$resource}')"
          echo

          echo '=== OPERATOR READBACK ==='
          curl -sS -i 'https://market402.com/op/pa-entity-x402.floot.app.json' | head -c 20000
          echo
