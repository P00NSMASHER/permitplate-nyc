name: PA Entity Market402 resubmit

on:
  push:
    paths:
      - '.github/workflows/pa-entity-status.yml'

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Self-test and submit current paid endpoint
        shell: bash
        run: |
          set +e
          URL='https://pa-entity-x402.floot.app/_api/pa-business?q=OpenAI&limit=1'

          echo '=== SELFTEST ==='
          curl -sS -i -X POST 'https://market402.com/selftest'             -H 'content-type: application/json'             --data "$(jq -nc --arg url "$URL" '{url:$url}')"
          echo

          echo '=== SUBMIT ==='
          curl -sS -i -X POST 'https://market402.com/submit'             -H 'content-type: application/json'             --data "$(jq -nc --arg url "$URL" '{url:$url}')"
          echo

          echo '=== OPERATOR READBACK ==='
          curl -sS -i 'https://market402.com/op/pa-entity-x402.floot.app.json' | head -c 16000
          echo
