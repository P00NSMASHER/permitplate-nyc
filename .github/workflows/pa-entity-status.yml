name: PA best-match Market402 submit

on:
  push:
    paths:
      - '.github/workflows/pa-entity-status.yml'

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test and submit $0.001 best-match endpoint
        shell: bash
        run: |
          set +e
          RESOURCE='https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s/api/pa-entity-one?q=OpenAI'

          echo '=== SELFTEST ==='
          curl -sS -i -X POST 'https://market402.com/selftest'             -H 'content-type: application/json'             --data "$(jq -nc --arg url "$RESOURCE" '{url:$url}')"
          echo

          echo '=== SUBMIT ==='
          curl -sS -i -X POST 'https://market402.com/submit'             -H 'content-type: application/json'             --data "$(jq -nc --arg resource "$RESOURCE" '{resource:$resource}')"
          echo
