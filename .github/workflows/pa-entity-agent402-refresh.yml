name: PA Entity Agent402 refresh
# refresh-marker: agent402-after-first-settlement-2026-10-02
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: permitplate-directory-mutations
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    environment: permitplate-directory-approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Admit fixed origin and exact production main
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          CURRENT="$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          test -n "$CURRENT" && test "$CURRENT" = "$EXPECTED_SHA" || { echo "Stale or unauthorized production source." >&2; exit 1; }
      - name: Refresh Agent402 and inspect routing
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://pa-entity-x402.floot.app'
          echo '=== REGISTER ==='
          curl -sS -i -X POST 'https://agent402.tools/api/index/register'             -H 'content-type: application/json'             --data "$(jq -nc --arg origin "$ORIGIN" '{origin:$origin}')" > /tmp/register.txt
          head -c 12000 /tmp/register.txt

          echo
          echo '=== SELLER ==='
          curl -sS -G 'https://agent402.tools/api/index'             --data-urlencode 'seller=pa-entity-x402.floot.app' > /tmp/seller.json
          head -c 30000 /tmp/seller.json

          echo
          echo '=== ROUTES ==='
          for q in             'Pennsylvania business registry'             'Pennsylvania company identity lookup'             'vendor verification Pennsylvania'             'one Pennsylvania company registration by business name'
          do
            echo "--- $q"
            curl -sS -G 'https://agent402.tools/api/route'               --data-urlencode "q=$q"               --data-urlencode 'include=external' > /tmp/route.json
            head -c 18000 /tmp/route.json
            echo
          done
