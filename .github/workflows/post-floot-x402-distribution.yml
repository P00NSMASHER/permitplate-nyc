name: Post-Floot x402 distribution

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'verification/trigger-post-floot-distribution.txt'

permissions:
  contents: read

jobs:
  distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify complete Floot public portfolio
        env:
          EXPECTED_FLOOT_RESOURCES: '8'
          X402_REHOST_BASE_URL: 'https://pa-entity-x402.floot.app'
          REPORT_PATH: x402-verification-report.json
        run: node scripts/verify-x402-portfolio.mjs

      - name: Repair zero-spend marketplace listings
        env:
          REPORT_PATH: marketplace-post-floot-rehost.json
        run: node scripts/repair-marketplaces-after-floot-rehost.mjs

      - name: Re-register and verify Agent402
        env:
          REPORT_PATH: agent402-post-rehost-report.json
        run: node scripts/verify-agent402-after-floot-rehost.mjs

      - name: Upload distribution receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-floot-x402-distribution
          path: |
            x402-verification-report.json
            marketplace-post-floot-rehost.json
            agent402-post-rehost-report.json
          if-no-files-found: warn
