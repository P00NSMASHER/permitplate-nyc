name: Post-Floot x402 distribution

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'verification/trigger-post-floot-distribution.txt'
  pull_request:
    paths:
      - '.github/workflows/post-floot-x402-distribution.yml'
      - 'tests/test_post_floot_distribution_workflow_policy.py'

permissions: {}

concurrency:
  group: post-floot-x402-distribution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out exact candidate without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Reject branch-selected external marketplace mutation
        run: python3 -m unittest discover -s tests -p 'test_post_floot_distribution_workflow_policy.py' -v

  distribute:
    needs: policy
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact admitted main source without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Admit exact current main before external mutation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Distribution requires main."; exit 1; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "Checked-out source is not the event SHA."; exit 1; }
          remote_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          test -n "$remote_main" || { echo "Unable to resolve current main."; exit 1; }
          test "$GITHUB_SHA" = "$remote_main" || { echo "Event SHA is not exact current main."; exit 1; }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'

      - name: Verify complete Floot public portfolio
        env:
          EXPECTED_FLOOT_RESOURCES: '8'
          X402_REHOST_BASE_URL: 'https://pa-entity-x402.floot.app'
          REPORT_PATH: x402-verification-report.json
        run: node scripts/verify-x402-portfolio.mjs

      - name: Re-register and verify Agent402
        env:
          REPORT_PATH: agent402-post-rehost-report.json
        run: node scripts/verify-agent402-after-floot-rehost.mjs

      - name: Repair zero-spend marketplace listings
        env:
          REPORT_PATH: marketplace-post-floot-rehost.json
        run: node scripts/repair-marketplaces-after-floot-rehost.mjs

      - name: Upload distribution receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: post-floot-x402-distribution-${{ github.sha }}
          path: |
            x402-verification-report.json
            marketplace-post-floot-rehost.json
            agent402-post-rehost-report.json
          if-no-files-found: warn
