name: validate PA Entity manifest with Agent402

on:
  push:
    paths:
      - '.github/workflows/validate-pa-entity-agent402-manifest.yml'
      - 'x402-manifest.json'
      - 'docs/pa-entity-floot-release/x402.json'
      - 'docs/pa-entity-floot-release/x402-services.json'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Parse staged manifests with current Agent402
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/MikeyPetrillo/Agent402.git /tmp/agent402
          cd /tmp/agent402
          npm ci --no-audit --no-fund >/dev/null

          for SOURCE in             "$GITHUB_WORKSPACE/x402-manifest.json"             "$GITHUB_WORKSPACE/docs/pa-entity-floot-release/x402.json"             "$GITHUB_WORKSPACE/docs/pa-entity-floot-release/x402-services.json"
          do
            echo "=== VALIDATE $SOURCE ==="
            SOURCE="$SOURCE" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          process.env.X402_INDEX_CRAWL='off';
          const { normaliseManifestTools } = await import('./src/x402-index.js');

          const origin='https://pa-entity-x402.floot.app';
          const manifest=JSON.parse(fs.readFileSync(process.env.SOURCE,'utf8'));
          const rows=normaliseManifestTools(manifest, origin);
          console.log(JSON.stringify(rows, null, 2));

          const main=rows.find(r=>String(r.route).split('?')[0]==='/_api/pa-business');
          const cheap=rows.find(r=>String(r.route).split('?')[0]==='/_api/pa-entity-one');
          if(!main || !cheap) throw new Error('expected both paid routes');

          const price = row => Number(String(row.price ?? '').replace('$',''));
          if(price(main)!==0.005) throw new Error('main price mismatch: '+main.price);
          if(price(cheap)!==0.001) throw new Error('cheap price mismatch: '+cheap.price);

          for (const [label,row] of [['main',main],['cheap',cheap]]) {
            if(!row.networks?.includes('eip155:8453')) throw new Error(label+' Base network missing');
            if(row.payToByNetwork?.['eip155:8453']?.toLowerCase()!=='0x708f7b52b56eafd7fc1de65fc7752ed732914021') {
              throw new Error(label+' payTo mismatch');
            }
            const domain=row.evmDomainByNetwork?.['eip155:8453'];
            if(domain?.name!=='USD Coin') throw new Error(label+' USDC domain mismatch: '+JSON.stringify(domain));
          }

          console.log('AGENT402_MANIFEST_COMPATIBLE=true');
          NODE
          done
