name: x402 cheap Tollbooth verification

on:
  push:
    paths:
      - '.github/workflows/x402-cheap-tollbooth.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run independent Tollbooth paid verification
        shell: bash
        run: |
          set +e
          URL='https://api-v2.appdeploy.ai/app/pa-entity-lookup-x402-4fbm4s/api/pa-entity-one?q=OpenAI'
          PAYTO='0x708f7b52b56eafd7fc1de65fc7752ed732914021'
          DESC='Low-friction Pennsylvania company identity lookup by business name. Returns one best-ranked legal-entity registry record for $0.001 USDC.'

          echo '=== verify ==='
          curl -sS -i -X POST 'https://www.trytollbooth.com/api/verify'             -H 'content-type: application/json'             --data "$(jq -nc --arg endpoint "$URL" --arg wallet "$PAYTO" '{endpoint:$endpoint,wallet:$wallet}')"

          echo
          echo '=== register ==='
          curl -sS -i -X POST 'https://www.trytollbooth.com/api/services'             -H 'content-type: application/json'             --data "$(jq -nc --arg endpoint "$URL" --arg wallet "$PAYTO" --arg description "$DESC" '{name:"PA Entity Best Match x402",endpoint:$endpoint,category:"data",priceUsdc:0.001,wallet:$wallet,chain:"base",description:$description}')"
