name: Factory Product 003 live smoke

on:
  push:
    branches:
      - x402-product-factory-bootstrap
    paths:
      - 'factory/products/pa-vendor-identity-match/live-smoke.js'
      - '.github/workflows/factory-product-003-live-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run zero-spend live source smoke
        run: node factory/products/pa-vendor-identity-match/live-smoke.js
