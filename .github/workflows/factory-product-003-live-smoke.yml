name: Factory product live smokes

on:
  push:
    branches:
      - x402-product-factory-bootstrap
    paths:
      - 'factory/product-registry.json'
      - 'factory/products/**'
      - 'factory/packages/sources/**'
      - 'factory/scripts/run-live-smokes.js'
      - '.github/workflows/factory-product-003-live-smoke.yml'
  workflow_dispatch:

concurrency:
  group: factory-live-smokes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run every staging product live smoke
        run: node factory/scripts/run-live-smokes.js
