name: Factory product live smokes

on:
  push:
    branches:
      - x402-product-factory-bootstrap
    paths:
      - 'factory/products/pa-vendor-identity-match/**'
      - 'factory/products/pa-business-address-match/**'
      - 'factory/products/pa-business-domain-match/**'
      - 'factory/products/sec-filing-freshness/**'
      - 'factory/products/sec-company-identity-match/**'
      - 'factory/products/domain-registration-age/**'
      - 'factory/products/ofac-name-review-gate/**'
      - 'factory/packages/sources/ofac-name-screen.js'
      - 'factory/products/treasury-average-rate-threshold/**'
      - 'factory/products/treasury-average-rate-trend/**'
      - 'factory/products/treasury-average-rate-spread/**'
      - 'factory/products/pa-business-formation-age/**'
      - 'factory/products/domain-expiration-horizon/**'
      - 'factory/products/domain-last-changed-recency/**'
      - 'factory/packages/sources/live-pa-identity.js'
      - 'factory/packages/sources/sec-filings.js'
      - 'factory/packages/sources/treasury-average-rates.js'
      - '.github/workflows/factory-product-003-live-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Product 003 live source smoke
        run: node factory/products/pa-vendor-identity-match/live-smoke.js
      - name: Product 004 live source smoke
        run: node factory/products/pa-business-address-match/live-smoke.js
      - name: Product 005 live source smoke
        run: node factory/products/pa-business-domain-match/live-smoke.js
      - name: Product 006 live SEC smoke
        run: node factory/products/sec-filing-freshness/live-smoke.js
      - name: Product 013 SEC identity smoke
        run: node factory/products/sec-company-identity-match/live-smoke.js
      - name: Product 007 live RDAP smoke
        run: node factory/products/domain-registration-age/live-smoke.js
      - name: Product 009 live OFAC smoke
        run: node factory/products/ofac-name-review-gate/live-smoke.js
      - name: Product 008 live Treasury smoke
        run: node factory/products/treasury-average-rate-threshold/live-smoke.js
      - name: Product 014 live Treasury trend smoke
        run: node factory/products/treasury-average-rate-trend/live-smoke.js
      - name: Product 015 live Treasury spread smoke
        run: node factory/products/treasury-average-rate-spread/live-smoke.js
      - name: Product 010 live formation-age smoke
        run: node factory/products/pa-business-formation-age/live-smoke.js
      - name: Product 011 live expiration-horizon smoke
        run: node factory/products/domain-expiration-horizon/live-smoke.js
      - name: Product 012 live RDAP recency smoke
        run: node factory/products/domain-last-changed-recency/live-smoke.js
