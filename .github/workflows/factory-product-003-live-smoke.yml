name: Factory product live smokes

on:
  push:
    branches:
      - x402-product-factory-bootstrap
    paths:
      - 'factory/products/pa-vendor-identity-match/**'
      - 'factory/products/pa-business-address-match/**'
      - 'factory/products/pa-business-domain-match/**'
      - 'factory/packages/sources/live-pa-identity.js'
      - '.github/workflows/factory-product-003-live-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Product 003 live source smoke
        run: node factory/products/pa-vendor-identity-match/live-smoke.js
      - name: Product 004 live source smoke
        run: node factory/products/pa-business-address-match/live-smoke.js
      - name: Product 005 live source smoke
        run: node factory/products/pa-business-domain-match/live-smoke.js
