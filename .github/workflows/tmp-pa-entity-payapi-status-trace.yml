name: PA Entity PayAPI public status read

on:
  push:
    paths:
      - '.github/workflows/tmp-pa-entity-payapi-status-trace.yml'

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read public PayAPI listing and settlement state
        shell: bash
        run: |
          set -euo pipefail
          LISTING_ID='3b5351ff-4a2c-4ff9-911e-88c938486208'

          curl -fsSL 'https://payapi.market/list' -o /tmp/list.html
          python3 - <<'PY' > /tmp/env.sh
          import re, urllib.parse, subprocess, pathlib, shlex
          base='https://payapi.market'
          html=pathlib.Path('/tmp/list.html').read_text(errors='ignore')
          chunks=[]
          for i,src in enumerate(re.findall(r'<script[^>]+src=["\x27]([^"\x27]+)["\x27]',html,re.I)):
              u=urllib.parse.urljoin(base+'/',src)
              out=pathlib.Path(f'/tmp/s{i}.js')
              if subprocess.run(['curl','-fsSL','--max-time','20',u,'-o',str(out)]).returncode==0 and out.exists():
                  chunks.append(out.read_text(errors='ignore'))
          s='\n'.join(chunks)

          urls=re.findall(r'https://[A-Za-z0-9.-]+\.supabase\.co',s)
          keys=re.findall(r'(?:sb_publishable_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+)',s)
          if not urls or not keys:
              raise SystemExit('public Supabase config not found')
          print('SUPABASE_URL='+shlex.quote(urls[0]))
          print('ANON_KEY='+shlex.quote(keys[0]))
          PY
          source /tmp/env.sh

          echo '=== LISTING ==='
          curl -fsSL "$SUPABASE_URL/rest/v1/api_listings?id=eq.$LISTING_ID&select=id,name,status,payment_verified,health_status,triage_status,triage_reasons,triage_checked_at,x402_payto_status,x402_payto_checked_at,reliability_score,total_requests,total_revenue,updated_at,paid_route_url,paid_route_quote_usdc" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" | jq .

          echo '=== PUBLIC PRODUCT LEDGER ==='
          curl -fsSL --get "$SUPABASE_URL/rest/v1/x402_ledger_public" \
            --data-urlencode 'listing=eq.PA Entity Lookup x402' \
            --data-urlencode 'outcome=eq.PRODUCT' \
            --data-urlencode 'select=listing,route,amount_usdc,outcome' \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" | jq .
